<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>ICE Verbindungen</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ICE Verbindungen">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23d22'/%3E%3Crect x='14' y='46' width='72' height='9' rx='4.5' fill='%23fff'/%3E%3Ccircle cx='26' cy='50.5' r='11' fill='%23fff'/%3E%3Ccircle cx='74' cy='50.5' r='11' fill='%23fff'/%3E%3Ccircle cx='26' cy='50.5' r='5' fill='%23d22'/%3E%3Ccircle cx='74' cy='50.5' r='5' fill='%23d22'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-row">
    <h1 id="title">ICE&nbsp;Verbindungen</h1>
    <button class="pill-btn" id="statsBtn" aria-label="Statistiken">
      <span id="headerCount">0/0</span>
      <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M5 9h3v11H5zM10.5 4h3v16h-3zM16 13h3v7h-3z"/></svg>
    </button>
  </div>
  <div class="searchwrap">
    <svg class="searchicon" viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
    <input type="search" id="search" placeholder="Linie, Bahnhof oder Zugnummer" autocomplete="off" autocorrect="off" autocapitalize="off">
    <button id="clearSearch" class="clear-btn" hidden>&times;</button>
  </div>
  <div class="chips" id="chips"></div>
</header>

<main>
  <div class="listmeta" id="listMeta"></div>
  <div id="list"></div>
  <div class="empty" id="empty" hidden>
    <div class="empty-icon">🚆</div>
    <p id="emptyText">Nichts gefunden</p>
  </div>
  <footer class="credits">
    Liniennetz: <a href="https://de.wikipedia.org/wiki/Liste_der_Intercity-Express-Linien" target="_blank" rel="noopener">Wikipedia – Liste der ICE-Linien</a> (Stand 09/2026)
  </footer>
</main>

<div class="tabbar">
  <button class="tab active" id="tabLinien">
    <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 2c-4 0-8 .5-8 4v9.5A3.5 3.5 0 0 0 7.5 19L6 20.5v.5h12v-.5L16.5 19a3.5 3.5 0 0 0 3.5-3.5V6c0-3.5-4-4-8-4zM7.5 17A1.5 1.5 0 1 1 9 15.5 1.5 1.5 0 0 1 7.5 17zm3.5-7H6V6h5zm2 0V6h5v4zm3.5 7a1.5 1.5 0 1 1 1.5-1.5 1.5 1.5 0 0 1-1.5 1.5z"/></svg>
    <span>Linien</span>
  </button>
  <button class="tab" id="tabFahrten">
    <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M19 4h-1V2h-2v2H8V2H6v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 16H5V10h14zM5 8V6h14v2z"/></svg>
    <span>Fahrten</span>
  </button>
  <button class="tab tab-add" id="tabAdd">
    <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z"/></svg>
    <span>Eintragen</span>
  </button>
</div>

<!-- Linien-Detail -->
<div class="sheet-backdrop" id="detailBackdrop" hidden></div>
<div class="sheet sheet-tall" id="detailSheet" hidden>
  <div class="sheet-handle"></div>
  <div class="sheet-head">
    <h2 id="detailTitle">Linie</h2>
    <button class="close-btn" id="detailClose">&times;</button>
  </div>
  <div class="sheet-content" id="detailContent"></div>
</div>

<!-- Fahrt eintragen / bearbeiten -->
<div class="sheet-backdrop" id="editBackdrop" hidden></div>
<div class="sheet sheet-tall" id="editSheet" hidden>
  <div class="sheet-handle"></div>
  <div class="sheet-head">
    <h2 id="editTitle">Fahrt eintragen</h2>
    <button class="close-btn" id="editClose">&times;</button>
  </div>
  <div class="sheet-content" id="editContent"></div>
</div>

<!-- Bahnhofsauswahl -->
<div class="sheet-backdrop" id="pickBackdrop" hidden></div>
<div class="sheet sheet-tall" id="pickSheet" hidden>
  <div class="sheet-handle"></div>
  <div class="sheet-head">
    <h2 id="pickTitle">Bahnhof</h2>
    <button class="close-btn" id="pickClose">&times;</button>
  </div>
  <div class="pick-search">
    <input type="search" id="pickSearch" placeholder="Bahnhof suchen" autocomplete="off" autocorrect="off" autocapitalize="off">
  </div>
  <div class="sheet-content" id="pickContent"></div>
</div>

<!-- Statistik -->
<div class="sheet-backdrop" id="statsBackdrop" hidden></div>
<div class="sheet sheet-tall" id="statsSheet" hidden>
  <div class="sheet-handle"></div>
  <div class="sheet-head">
    <h2>Statistiken</h2>
    <button class="close-btn" id="statsClose">&times;</button>
  </div>
  <div class="sheet-content" id="statsContent"></div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
