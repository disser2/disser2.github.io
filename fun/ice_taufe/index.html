<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>ICE Taufnamen</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ICE Taufnamen">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23d22'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle' fill='%23fff' font-family='Helvetica' font-weight='bold'%3EICE%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-row">
    <h1>ICE&nbsp;Taufnamen</h1>
    <button class="pill-btn" id="statsBtn" aria-label="Statistiken">
      <span id="headerCount">0/0</span>
      <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M5 9h3v11H5zM10.5 4h3v16h-3zM16 13h3v7h-3z"/></svg>
    </button>
  </div>
  <div class="searchwrap">
    <svg class="searchicon" viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
    <input type="search" id="search" placeholder="Taufname, Triebzug oder Ort" autocomplete="off" autocorrect="off" autocapitalize="off">
    <button id="clearSearch" class="clear-btn" hidden>&times;</button>
  </div>
  <div class="chips" id="chips">
    <button class="chip active" data-filter="alle">Alle</button>
    <button class="chip" data-filter="gesehen">Gesehen</button>
    <button class="chip" data-filter="fehlt">Fehlt</button>
    <span class="chip-sep"></span>
    <button class="chip" data-kat="stadt">Städte</button>
    <button class="chip" data-kat="region">Regionen</button>
    <button class="chip" data-aktiv="1">Aktuell&nbsp;unterwegs</button>
    <span class="chip-sep"></span>
    <span id="typChips"></span>
  </div>
</header>

<main>
  <div class="listmeta" id="listMeta"></div>
  <div id="list"></div>
  <div class="empty" id="empty" hidden>
    <div class="empty-icon">🔍</div>
    <p>Nichts gefunden</p>
  </div>
  <footer class="credits">
    Datenbasis: <a href="https://de.wikipedia.org/wiki/Liste_benannter_IC/ICE-Fahrzeuge" target="_blank" rel="noopener">Wikipedia – Liste benannter IC/ICE-Fahrzeuge</a> (Stand 08/2026)<br>
    Wappen: Wikimedia Commons
  </footer>
</main>

<div class="tabbar">
  <button class="tab active" id="sortName" title="Nach Name sortieren">
    <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M3 6h18v2H3zm0 5h12v2H3zm0 5h8v2H3z"/></svg>
    <span>Name</span>
  </button>
  <button class="tab" id="sortDatum" title="Nach Taufdatum sortieren">
    <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M19 4h-1V2h-2v2H8V2H6v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 16H5V10h14zM5 8V6h14v2z"/></svg>
    <span>Taufdatum</span>
  </button>
  <button class="tab" id="sortSeen" title="Nach Sichtung sortieren">
    <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 5c-5 0-9.3 3.1-11 7 1.7 3.9 6 7 11 7s9.3-3.1 11-7c-1.7-3.9-6-7-11-7zm0 11.5A4.5 4.5 0 1 1 16.5 12 4.5 4.5 0 0 1 12 16.5zM12 9a3 3 0 1 0 3 3 3 3 0 0 0-3-3z"/></svg>
    <span>Gesehen</span>
  </button>
</div>

<!-- Detail-Sheet -->
<div class="sheet-backdrop" id="detailBackdrop" hidden></div>
<div class="sheet" id="detailSheet" hidden>
  <div class="sheet-handle"></div>
  <div class="sheet-content" id="detailContent"></div>
</div>

<!-- Statistik-Sheet -->
<div class="sheet-backdrop" id="statsBackdrop" hidden></div>
<div class="sheet sheet-tall" id="statsSheet" hidden>
  <div class="sheet-handle"></div>
  <div class="sheet-head">
    <h2>Statistiken</h2>
    <button class="close-btn" id="statsClose">&times;</button>
  </div>
  <div class="sheet-content" id="statsContent"></div>
</div>

<!-- Wappen-Lightbox -->
<div class="lightbox" id="lightbox" hidden>
  <button class="lb-close" id="lbClose" aria-label="Schließen">&times;</button>
  <div class="lb-inner">
    <div class="lb-img" id="lbImg"></div>
    <div class="lb-cap" id="lbCap"></div>
  </div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
