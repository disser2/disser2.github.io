<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Kuchen-Chaos</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
:root{
  --bg:#1c2637; --bg2:#141b28; --panel:#2e3a52; --panel-dark:#0f1521;
  --red:#f8494c; --red-dark:#9c1f28; --blue:#3fa7ff; --gold:#ffb03b;
  --white:#f4f0e8; --green:#37b26c;
}
*{box-sizing:border-box; margin:0; padding:0; user-select:none; -webkit-user-select:none;}
html,body{height:100%;}
body{
  font-family:'Press Start 2P','Courier New',monospace;
  color:var(--white);
  background:
    repeating-linear-gradient(45deg, rgba(255,255,255,.015) 0 2px, transparent 2px 6px),
    repeating-linear-gradient(-45deg, rgba(0,0,0,.06) 0 2px, transparent 2px 6px),
    radial-gradient(ellipse at 50% 20%, #26334a 0%, var(--bg) 55%, var(--bg2) 100%);
  display:flex; flex-direction:column; align-items:center;
  min-height:100%; padding:14px 10px 30px; overflow-x:hidden;
}
/* ---------- header ---------- */
.topbar{display:flex; align-items:center; gap:14px; margin-bottom:14px; flex-wrap:wrap; justify-content:center;}
h1{
  font-size:22px; letter-spacing:1px; color:#fff;
  background:linear-gradient(#ff6b6d,var(--red) 55%,#d93036);
  border:3px solid var(--panel-dark); border-radius:12px;
  padding:14px 18px 12px;
  box-shadow:0 6px 0 var(--panel-dark), inset 0 -4px 0 rgba(0,0,0,.25), inset 0 3px 0 rgba(255,255,255,.25);
  text-shadow:3px 3px 0 var(--panel-dark);
  transform:rotate(-2deg);
  animation:bob 2.6s ease-in-out infinite;
}
@keyframes bob{0%,100%{transform:rotate(-2deg) translateY(0)}50%{transform:rotate(-1deg) translateY(-3px)}}
.stat{
  background:var(--panel); border:3px solid var(--panel-dark); border-radius:10px;
  padding:10px 14px; box-shadow:0 5px 0 var(--panel-dark);
  text-align:center; min-width:110px;
}
.stat .lbl{font-size:8px; color:#9fb0cc; margin-bottom:7px; letter-spacing:1px;}
.stat .val{font-size:16px; color:var(--gold); text-shadow:2px 2px 0 var(--panel-dark);}
/* ---------- board ---------- */
#board{
  display:grid; grid-template-columns:repeat(4, 96px); grid-auto-rows:88px; gap:9px;
  background:#20293c;
  border:3px solid var(--panel-dark); border-radius:14px;
  padding:12px; box-shadow:0 7px 0 var(--panel-dark), inset 0 0 30px rgba(0,0,0,.45);
}
.cell{
  position:relative; border-radius:9px;
  background:#1a2233;
  box-shadow:inset 0 3px 8px rgba(0,0,0,.6), inset 0 -2px 0 rgba(255,255,255,.03);
  display:flex; align-items:center; justify-content:center;
  transition:box-shadow .12s, background .12s;
}
.cell.place-ok{cursor:pointer; outline:3px dashed rgba(255,176,59,.55); outline-offset:-3px;}
.cell.place-ok:hover{background:#293654; outline-color:var(--gold);}
.cell svg{display:block;}
.cell.complete{animation:flash .5s steps(2) 2;}
@keyframes flash{0%,100%{filter:none}50%{filter:brightness(2.1) saturate(1.6); }}
.cell.pop svg{animation:pop .18s ease-out;}
@keyframes pop{0%{transform:scale(1.18)}100%{transform:scale(1)}}
/* ---------- tray ---------- */
#traywrap{margin-top:16px; text-align:center;}
.traylbl{font-size:9px; color:#9fb0cc; margin-bottom:8px; letter-spacing:1px;}
#tray{
  display:flex; gap:12px; justify-content:center;
  background:#20293c; border:3px solid var(--panel-dark); border-radius:14px;
  padding:12px 14px; box-shadow:0 7px 0 var(--panel-dark), inset 0 0 24px rgba(0,0,0,.4);
}
.tslot{
  width:104px; height:96px; border-radius:10px; background:#1a2233;
  box-shadow:inset 0 3px 8px rgba(0,0,0,.6);
  display:flex; align-items:center; justify-content:center;
  transition:transform .12s;
  position:relative;
}
.tslot.has{cursor:pointer;}
.tslot.has:hover{transform:translateY(-3px);}
.tslot.sel{
  transform:translateY(-7px);
  outline:3px solid var(--gold); outline-offset:-1px;
  box-shadow:inset 0 3px 8px rgba(0,0,0,.6), 0 0 18px rgba(255,176,59,.35);
  animation:wig .5s ease-in-out infinite;
}
@keyframes wig{0%,100%{transform:translateY(-7px) rotate(-1.5deg)}50%{transform:translateY(-7px) rotate(1.5deg)}}
/* ---------- misc ---------- */
button{
  font-family:inherit; font-size:11px; color:#fff; cursor:pointer;
  background:linear-gradient(#ff6b6d,var(--red) 55%,#d93036);
  border:3px solid var(--panel-dark); border-radius:10px;
  padding:12px 16px 10px; box-shadow:0 5px 0 var(--panel-dark);
  text-shadow:2px 2px 0 var(--panel-dark);
}
button:active{transform:translateY(3px); box-shadow:0 2px 0 var(--panel-dark);}
button.blue{background:linear-gradient(#6fc0ff,var(--blue) 55%,#1d7fd4);}
.help{margin-top:16px; font-size:8px; line-height:2; color:#8fa0bd; max-width:430px; text-align:center;}
.token{
  position:fixed; z-index:50; width:20px; height:20px; border-radius:50%;
  border:3px solid; pointer-events:none;
  transition:transform .17s ease-in; box-shadow:0 3px 0 rgba(0,0,0,.4);
}
.popup{
  position:fixed; z-index:60; pointer-events:none; font-size:12px; color:var(--gold);
  text-shadow:2px 2px 0 var(--panel-dark);
  animation:rise .8s ease-out forwards;
}
.popup.big{font-size:15px; color:#7dff9b;}
@keyframes rise{0%{opacity:1; transform:translateY(0)}100%{opacity:0; transform:translateY(-46px)}}
#overlay{
  position:fixed; inset:0; z-index:100; display:none;
  background:rgba(10,14,22,.82);
  align-items:center; justify-content:center;
}
#overlay.show{display:flex;}
.gopanel{
  background:var(--panel); border:4px solid var(--panel-dark); border-radius:16px;
  padding:34px 40px; text-align:center;
  box-shadow:0 9px 0 var(--panel-dark), 0 0 60px rgba(248,73,76,.25);
  animation:drop .35s ease-out;
}
@keyframes drop{0%{transform:translateY(-60px) scale(.8); opacity:0}100%{transform:none; opacity:1}}
.gopanel h2{color:var(--red); font-size:24px; text-shadow:3px 3px 0 var(--panel-dark); margin-bottom:18px;}
.gopanel p{font-size:11px; line-height:2; margin-bottom:20px;}
.gopanel .fs{color:var(--gold); font-size:18px;}
@media (max-width:460px){
  #board{grid-template-columns:repeat(4, 74px); grid-auto-rows:70px; gap:7px;}
  .tslot{width:80px; height:78px;}
  h1{font-size:15px;}
}
</style>
</head>
<body>
<div class="topbar">
  <h1>KUCHEN-CHAOS</h1>
  <div class="stat"><div class="lbl">PUNKTE</div><div class="val" id="score">0</div></div>
  <div class="stat"><div class="lbl">RUNDE</div><div class="val" id="round">1</div></div>
  <button class="blue" id="restart">NEU</button>
</div>

<div id="board"></div>

<div id="traywrap">
  <div class="traylbl">&#9660; NEUE KUCHENTELLER &#9660;</div>
  <div id="tray"></div>
</div>

<div class="help">
  TELLER UNTEN W&Auml;HLEN &rarr; FREIES FELD KLICKEN.<br>
  GLEICHE SORTEN SAMMELN SICH BEI NACHBARN.<br>
  6 GLEICHE ST&Uuml;CKE = KUCHEN KOMPLETT = +100!
</div>

<div id="overlay">
  <div class="gopanel">
    <h2>VERLOREN!</h2>
    <p>ALLE FELDER SIND VOLL.<br><br>PUNKTE: <span class="fs" id="finalscore">0</span><br>RUNDEN: <span class="fs" id="finalround">0</span></p>
    <button id="again">NOCHMAL!</button>
  </div>
</div>

<script>
"use strict";
const W=4, H=5, SIZE=W*H, MAX=6;
const SORTEN=[
  {name:"Erdbeere",  top:"#ff8fa3", side:"#c94b66", deco:"#e0243f", shape:"berry"},
  {name:"Schoko",    top:"#9a6a44", side:"#5d3823", deco:"#38200f", shape:"chip"},
  {name:"Blaubeere", top:"#8f7ae6", side:"#5544a8", deco:"#2f2775", shape:"berry"},
  {name:"Zitrone",   top:"#ffd95e", side:"#cf9c26", deco:"#fff7d9", shape:"cream"},
  {name:"Pistazie",  top:"#9fd86b", side:"#5f9639", deco:"#2f6b1f", shape:"nuts"},
  {name:"Karamell",  top:"#f2ddb8", side:"#c09a5e", deco:"#b06a1e", shape:"drizzle"},
];
let board, tray, score, round, sel=null, busy=false, over=false;

const $=s=>document.querySelector(s);
const rnd=n=>Math.floor(Math.random()*n);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const cnt=(p,t)=>p.slices.reduce((a,x)=>a+(x===t?1:0),0);

function neighbors(i){
  const r=Math.floor(i/W), c=i%W, out=[];
  if(r>0)out.push(i-W); if(r<H-1)out.push(i+W);
  if(c>0)out.push(i-1); if(c<W-1)out.push(i+1);
  return out;
}
function sortSlices(s){
  const c={}; s.forEach(t=>c[t]=(c[t]||0)+1);
  return Object.keys(c).map(Number).sort((a,b)=>c[b]-c[a]||a-b)
    .flatMap(t=>Array(c[t]).fill(t));
}
function newPlate(){
  const nT=[1,1,2,2,2,3][rnd(6)];
  const types=[];
  while(types.length<nT){const t=rnd(6); if(!types.includes(t))types.push(t);}
  let total=nT+rnd(Math.min(4,5-nT)+1);
  if(total<2)total=2;
  const slices=[];
  for(let i=0;i<total;i++) slices.push(i<nT?types[i]:types[rnd(nT)]);
  return {slices:sortSlices(slices)};
}

/* ---------- sound ---------- */
let AC=null;
function beep(f,d=0.07,type="square",v=0.12,delay=0){
  try{
    if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==="suspended")AC.resume();
    const t=AC.currentTime+delay;
    const o=AC.createOscillator(), g=AC.createGain();
    o.type=type; o.frequency.value=f;
    g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(0.001,t+d);
    o.connect(g).connect(AC.destination); o.start(t); o.stop(t+d+0.02);
  }catch(e){}
}

/* ---------- svg kuchen ---------- */
function plateSVG(plate,scale){
  const cx=55, cy=38, rx=40, ry=23, dep=12;
  const w=110, h=94;
  let s=`<svg viewBox="0 0 ${w} ${h}" width="${w*scale}" height="${h*scale}">`;
  // teller
  s+=`<ellipse cx="${cx}" cy="${cy+dep+6}" rx="51" ry="27" fill="#0b101a" opacity="0.5"/>`;
  s+=`<ellipse cx="${cx}" cy="${cy+dep+3}" rx="50" ry="27" fill="#b9c2d6" stroke="#101623" stroke-width="3"/>`;
  s+=`<ellipse cx="${cx}" cy="${cy+dep+1}" rx="50" ry="27" fill="#e9edf6" stroke="#101623" stroke-width="3"/>`;
  s+=`<ellipse cx="${cx}" cy="${cy+dep+1}" rx="37" ry="18.5" fill="none" stroke="#c3cbdd" stroke-width="2"/>`;
  if(plate){
    const slots=plate.slices.map((t,i)=>({t,i}));
    const D=Math.PI/180;
    slots.sort((a,b)=>Math.sin((a.i*60-60)*D)-Math.sin((b.i*60-60)*D));
    for(const {t,i} of slots){
      const S=SORTEN[t];
      const m=2.5*D;
      const t0=(i*60-90)*D+m, t1=((i+1)*60-90)*D-m, mid=(t0+t1)/2;
      const ex=Math.cos(mid)*2.5, ey=Math.sin(mid)*1.6;
      const P=a=>[cx+ex+rx*Math.cos(a), cy+ey+ry*Math.sin(a)];
      const [x0,y0]=P(t0),[x1,y1]=P(t1);
      const wedge=dy=>`M ${cx+ex} ${cy+ey+dy} L ${x0.toFixed(1)} ${(y0+dy).toFixed(1)} A ${rx} ${ry} 0 0 1 ${x1.toFixed(1)} ${(y1+dy).toFixed(1)} Z`;
      // extrusion: gestapelte kopien
      s+=`<path d="${wedge(dep)}" fill="${S.side}" stroke="#101623" stroke-width="3"/>`;
      for(let k=dep-1;k>=1;k--) s+=`<path d="${wedge(k)}" fill="${S.side}"/>`;
      // creme-schicht
      s+=`<path d="${wedge(4)}" fill="#fdf6ea"/>`;
      s+=`<path d="${wedge(0)}" fill="${S.top}" stroke="#101623" stroke-width="2.5" stroke-linejoin="round"/>`;
      // deko
      const dx=cx+ex+rx*0.6*Math.cos(mid), dy2=cy+ey+ry*0.6*Math.sin(mid);
      s+=deco(S,dx,dy2);
    }
  }
  return s+`</svg>`;
}
function deco(S,x,y){
  switch(S.shape){
    case "berry":  return `<circle cx="${x}" cy="${y}" r="4" fill="${S.deco}" stroke="#101623" stroke-width="1.5"/><circle cx="${x-1.3}" cy="${y-1.3}" r="1.1" fill="#ffffff" opacity="0.8"/>`;
    case "chip":   return `<rect x="${x-3.4}" y="${y-3.4}" width="6.8" height="6.8" rx="1.5" fill="${S.deco}" stroke="#101623" stroke-width="1.5" transform="rotate(12 ${x} ${y})"/>`;
    case "cream":  return `<circle cx="${x}" cy="${y}" r="4.4" fill="${S.deco}" stroke="#101623" stroke-width="1.5"/><circle cx="${x}" cy="${y}" r="1.6" fill="#ffd95e"/>`;
    case "nuts":   return `<circle cx="${x-2.4}" cy="${y-1}" r="2.1" fill="${S.deco}" stroke="#101623" stroke-width="1.2"/><circle cx="${x+2.6}" cy="${y+1.4}" r="2.1" fill="${S.deco}" stroke="#101623" stroke-width="1.2"/>`;
    case "drizzle":return `<ellipse cx="${x}" cy="${y}" rx="5" ry="2.3" fill="${S.deco}" stroke="#101623" stroke-width="1.3" transform="rotate(-14 ${x} ${y})"/>`;
  }
  return "";
}

/* ---------- rendering ---------- */
function cellScale(){return window.innerWidth<=460?0.66:0.84;}
function render(){
  const b=$("#board");
  b.innerHTML="";
  for(let i=0;i<SIZE;i++){
    const d=document.createElement("div");
    d.className="cell"; d.dataset.cell=i;
    if(board[i]) d.innerHTML=plateSVG(board[i],cellScale());
    else if(sel!==null && !busy && !over) d.classList.add("place-ok");
    d.addEventListener("click",()=>onCell(i));
    b.appendChild(d);
  }
  const t=$("#tray");
  t.innerHTML="";
  for(let i=0;i<3;i++){
    const d=document.createElement("div");
    d.className="tslot"; d.dataset.slot=i;
    if(tray[i]){
      d.classList.add("has");
      if(i===sel)d.classList.add("sel");
      d.innerHTML=plateSVG(tray[i],cellScale());
    }
    d.addEventListener("click",()=>onTray(i));
    t.appendChild(d);
  }
  $("#score").textContent=score;
  $("#round").textContent=round;
}
function popup(el,txt,big){
  const r=el.getBoundingClientRect();
  const p=document.createElement("div");
  p.className="popup"+(big?" big":""); p.textContent=txt;
  p.style.left=(r.left+r.width/2-24)+"px";
  p.style.top=(r.top+6)+"px";
  document.body.appendChild(p);
  setTimeout(()=>p.remove(),800);
}
function cellEl(i){return document.querySelector(`[data-cell="${i}"]`);}
async function flyToken(from,to,type){
  const a=cellEl(from).getBoundingClientRect(), b=cellEl(to).getBoundingClientRect();
  const tok=document.createElement("div");
  tok.className="token";
  tok.style.background=SORTEN[type].top;
  tok.style.borderColor="#101623";
  tok.style.left=(a.left+a.width/2-10)+"px";
  tok.style.top=(a.top+a.height/2-10)+"px";
  document.body.appendChild(tok);
  tok.getBoundingClientRect();
  tok.style.transform=`translate(${b.left-a.left}px, ${b.top-a.top}px) scale(0.85)`;
  await sleep(180);
  tok.remove();
}

/* ---------- spiellogik ---------- */
function findMove(){
  let best=null;
  for(let s=0;s<SIZE;s++){
    const ps=board[s]; if(!ps)continue;
    for(const d of neighbors(s)){
      const pd=board[d]; if(!pd||pd.slices.length>=MAX)continue;
      const seen=new Set();
      for(const t of ps.slices){
        if(seen.has(t))continue; seen.add(t);
        const cD=cnt(pd,t); if(cD===0)continue;
        const cS=cnt(ps,t);
        if(cD>=cS){
          const sc=cD*100+cS;
          if(!best||sc>best.sc)best={s,d,t,sc};
        }
      }
    }
  }
  return best;
}
async function completeCake(i){
  const el=cellEl(i);
  el.classList.add("complete");
  beep(660,0.09,"square",0.13,0);
  beep(880,0.09,"square",0.13,0.09);
  beep(1320,0.14,"square",0.13,0.18);
  await sleep(520);
  score+=100;
  popup(el,"+100",true);
  board[i]=null;
  render();
}
async function resolve(){
  let mv;
  while((mv=findMove())){
    const {s,d,t}=mv;
    board[s].slices.splice(board[s].slices.indexOf(t),1);
    render();
    await flyToken(s,d,t);
    board[d].slices=sortSlices([...board[d].slices,t]);
    beep(430+cnt(board[d],t)*60,0.05,"square",0.09);
    if(board[s].slices.length===0)board[s]=null;
    render();
    const dEl=cellEl(d); if(dEl){dEl.classList.add("pop"); setTimeout(()=>dEl.classList.remove("pop"),200);}
    const pd=board[d];
    if(pd&&pd.slices.length===MAX&&pd.slices.every(x=>x===pd.slices[0])){
      await completeCake(d);
    }
    await sleep(50);
  }
}
function onTray(i){
  if(busy||over||!tray[i])return;
  sel=i; beep(300,0.04,"square",0.08); render();
}
async function onCell(i){
  if(busy||over||sel===null||board[i]||!tray[sel])return;
  busy=true;
  board[i]=tray[sel]; tray[sel]=null; sel=null;
  score+=10; beep(220,0.06,"square",0.11); beep(330,0.05,"square",0.09,0.05);
  render();
  popup(cellEl(i),"+10");
  await resolve();
  if(tray.every(p=>!p)){
    round++;
    tray=[newPlate(),newPlate(),newPlate()];
  }
  sel=tray.findIndex(p=>p); if(sel<0)sel=null;
  busy=false;
  render();
  if(board.every(p=>p)&&tray.some(p=>p)) gameOver();
}
function gameOver(){
  over=true;
  $("#finalscore").textContent=score;
  $("#finalround").textContent=round;
  $("#overlay").classList.add("show");
  beep(300,0.2,"sawtooth",0.12,0);
  beep(220,0.25,"sawtooth",0.12,0.2);
  beep(140,0.5,"sawtooth",0.13,0.45);
}
async function init(){
  board=Array(SIZE).fill(null);
  score=0; round=1; over=false; sel=null;
  $("#overlay").classList.remove("show");
  const cells=[];
  while(cells.length<4){const c=rnd(SIZE); if(!cells.includes(c))cells.push(c);}
  cells.forEach(c=>board[c]=newPlate());
  tray=[newPlate(),newPlate(),newPlate()];
  render();
  busy=true;
  await resolve();
  sel=0; busy=false;
  render();
}
$("#restart").addEventListener("click",init);
$("#again").addEventListener("click",init);
window.addEventListener("resize",render);
init();
</script>
</body>
</html>
