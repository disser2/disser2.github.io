<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chronikum – Das Timeline-Spiel der Geschichte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --nacht:#0F1826;
  --panel:#17233A;
  --panel2:#1D2C47;
  --linie:#2C3D5C;
  --pergament:#F0E7D2;
  --pergament2:#E4D8BC;
  --tinte:#232A38;
  --messing:#C9A24B;
  --messing-hell:#E4C878;
  --nebel:#8FA1B8;
  --gruen:#7FB069;
  --rot:#C25B4A;
  --radius:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--nacht);
  color:#E9EDF4;
  font-family:"IBM Plex Sans",system-ui,sans-serif;
  min-height:100vh;
  background-image:
    radial-gradient(ellipse 80% 50% at 50% -10%, rgba(201,162,75,0.08), transparent),
    repeating-linear-gradient(90deg, transparent 0 119px, rgba(255,255,255,0.015) 119px 120px);
}
h1,h2,h3,.serif{font-family:"Fraunces",serif}
.mono{font-family:"IBM Plex Mono",monospace}
button{font-family:inherit;cursor:pointer;border:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--messing-hell);outline-offset:2px}

.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 60px}

/* ---------- Header ---------- */
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:10px 0 22px;border-bottom:1px solid var(--linie);margin-bottom:24px}
header h1{font-size:clamp(1.5rem,4vw,2.1rem);font-weight:900;letter-spacing:.5px;color:var(--pergament)}
header h1 span{color:var(--messing)}
header .sub{color:var(--nebel);font-size:.85rem}

/* ---------- Setup ---------- */
.card-panel{background:var(--panel);border:1px solid var(--linie);border-radius:var(--radius);padding:28px 24px}
.setup h2{font-size:1.4rem;color:var(--pergament);margin-bottom:6px}
.setup p{color:var(--nebel);margin-bottom:20px;max-width:60ch;line-height:1.55}
.setup label{display:block;font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--nebel);margin:14px 0 6px}
.setup input[type=text]{
  width:100%;max-width:340px;background:var(--nacht);border:1px solid var(--linie);
  border-radius:6px;padding:10px 12px;color:#E9EDF4;font-size:1rem}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--nacht);border:1px solid var(--linie);color:var(--nebel);padding:8px 16px;border-radius:999px;font-size:.95rem;font-weight:500}
.chip.on{background:var(--messing);border-color:var(--messing);color:var(--tinte)}
.btn{
  background:var(--messing);color:var(--tinte);font-weight:600;font-size:1rem;
  padding:12px 26px;border-radius:8px;transition:transform .12s, background .12s}
.btn:hover{background:var(--messing-hell);transform:translateY(-1px)}
.btn.ghost{background:transparent;color:var(--nebel);border:1px solid var(--linie)}
.btn.ghost:hover{color:#E9EDF4;background:var(--panel2)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.setup .start{margin-top:26px}

/* ---------- Scoreboard ---------- */
.scores{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.score{
  flex:1;min-width:130px;background:var(--panel);border:1px solid var(--linie);
  border-radius:8px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.score.active{border-color:var(--messing);box-shadow:0 0 0 1px var(--messing), 0 4px 18px rgba(201,162,75,.15)}
.score .name{font-weight:600;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score .pts{font-family:"IBM Plex Mono",monospace;color:var(--messing-hell);font-size:1.05rem}

/* ---------- Zieh-Karte ---------- */
.stage{display:flex;flex-direction:column;gap:22px}
.draw-area{display:flex;justify-content:center}
.event-card{
  width:min(420px,100%);background:linear-gradient(160deg,var(--pergament),var(--pergament2));
  color:var(--tinte);border-radius:12px;padding:26px 24px 22px;text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,.45), inset 0 0 0 1px rgba(35,42,56,.15);
  position:relative}
.event-card::before{
  content:"";position:absolute;inset:7px;border:1px solid rgba(35,42,56,.28);border-radius:8px;pointer-events:none}
.event-card .eyebrow{font-size:.7rem;text-transform:uppercase;letter-spacing:.18em;color:#7A6A45;margin-bottom:10px}
.event-card h3{font-size:clamp(1.15rem,3vw,1.5rem);font-weight:600;line-height:1.3}
.event-card .year{
  font-family:"Fraunces",serif;font-weight:900;font-size:2.4rem;color:#8A6E2F;margin-top:10px;
  display:none}
.event-card .desc{display:none;color:#4A4230;font-size:.9rem;margin-top:10px;line-height:1.5}
.event-card.revealed .year,.event-card.revealed .desc{display:block}
.event-card.correct{box-shadow:0 0 0 3px var(--gruen), 0 10px 30px rgba(0,0,0,.45)}
.event-card.wrong{box-shadow:0 0 0 3px var(--rot), 0 10px 30px rgba(0,0,0,.45)}
.hint{text-align:center;color:var(--nebel);font-size:.9rem}
.hint b{color:var(--messing-hell)}

/* ---------- Timeline ---------- */
#timelines{display:flex;flex-direction:column;gap:14px}
.timeline-wrap{background:var(--panel);border:1px solid var(--linie);border-radius:var(--radius);padding:18px 8px 22px;position:relative;overflow:hidden;transition:border-color .15s, box-shadow .15s}
.timeline-wrap.active{border-color:var(--messing);box-shadow:0 0 0 1px var(--messing), 0 6px 22px rgba(201,162,75,.12)}
.timeline-wrap.inactive{opacity:.72}
.timeline-wrap.inactive .tcard{width:96px;padding:9px 8px}
.timeline-wrap.inactive .tcard .y{font-size:1.05rem}
.timeline-wrap.inactive .tcard .t{font-size:.68rem}
.timeline-label{font-size:.72rem;text-transform:uppercase;letter-spacing:.16em;color:var(--nebel);padding:0 14px 12px;display:flex;justify-content:space-between;gap:10px}
.timeline-label .owner{color:var(--pergament);font-weight:600}
.timeline-wrap.active .timeline-label .owner{color:var(--messing-hell)}
.timeline-label .turn-tag{color:var(--messing);letter-spacing:.12em}
.timeline-scroll{overflow-x:auto;padding:8px 14px 14px;-webkit-overflow-scrolling:touch}
.timeline{display:flex;align-items:stretch;gap:0;min-width:min-content;position:relative;padding-top:14px}
.timeline::before{
  content:"";position:absolute;top:0;left:0;right:0;height:8px;
  background:repeating-linear-gradient(90deg, var(--linie) 0 1px, transparent 1px 14px);
  border-top:1px solid var(--linie)}
.tcard{
  width:132px;flex:0 0 auto;background:linear-gradient(165deg,var(--pergament),var(--pergament2));
  color:var(--tinte);border-radius:8px;padding:12px 10px;margin:0 2px;
  box-shadow:0 4px 12px rgba(0,0,0,.35);
  display:flex;flex-direction:column;gap:6px;animation:drop .35s ease}
@keyframes drop{from{transform:translateY(-14px);opacity:0}to{transform:none;opacity:1}}
.tcard .y{font-family:"Fraunces",serif;font-weight:900;font-size:1.3rem;color:#8A6E2F}
.tcard .t{font-size:.78rem;font-weight:600;line-height:1.3}
.slot{
  flex:0 0 auto;width:34px;align-self:stretch;margin:0 2px;border-radius:8px;
  border:2px dashed var(--linie);background:transparent;color:var(--nebel);
  font-size:1.2rem;transition:all .15s;min-height:90px}
.slot.enabled{border-color:var(--messing);color:var(--messing);cursor:pointer;background:rgba(201,162,75,.06)}
.slot.enabled:hover{background:rgba(201,162,75,.2);width:46px;color:var(--messing-hell)}
.slot:not(.enabled){opacity:.25;cursor:default}

/* ---------- Feedback / Modals ---------- */
.feedback{text-align:center;padding:6px 0}
.feedback .msg{font-family:"Fraunces",serif;font-size:1.5rem;font-weight:600}
.feedback .msg.ok{color:var(--gruen)}
.feedback .msg.no{color:var(--rot)}
.feedback .next{margin-top:14px}
.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}

.overlay{
  position:fixed;inset:0;background:rgba(8,12,20,.8);display:flex;align-items:center;justify-content:center;
  padding:20px;z-index:50}
.overlay .inner{background:var(--panel);border:1px solid var(--messing);border-radius:14px;padding:36px 30px;text-align:center;max-width:480px}
.overlay .inner-final{max-width:760px;max-height:88vh;overflow-y:auto}
.overlay h2{font-size:2rem;color:var(--messing-hell);font-weight:900;margin-bottom:8px}
.overlay p{color:var(--nebel);margin-bottom:22px;line-height:1.5}
.hidden{display:none!important}

/* ---------- Finale Listen ---------- */
#finalLists{display:flex;flex-direction:column;gap:16px;margin-bottom:24px;text-align:left}
.final-block{background:var(--nacht);border:1px solid var(--linie);border-radius:10px;padding:14px 16px}
.final-block.winner{border-color:var(--messing);box-shadow:0 0 0 1px var(--messing)}
.final-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.final-head .fname{font-family:"Fraunces",serif;font-weight:600;font-size:1.1rem;color:var(--pergament)}
.final-block.winner .final-head .fname{color:var(--messing-hell)}
.final-head .fcount{font-family:"IBM Plex Mono",monospace;color:var(--nebel);font-size:.9rem}
.final-rows{display:flex;flex-direction:column;gap:4px}
.final-row{display:flex;gap:12px;align-items:baseline;font-size:.9rem;padding:3px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.final-row:last-child{border-bottom:none}
.final-row .fy{font-family:"IBM Plex Mono",monospace;color:var(--messing);min-width:82px;flex:0 0 auto;text-align:right}
.final-row .ft{color:#D9E0EA}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
@media (max-width:560px){
  .event-card{padding:20px 16px 18px}
  .tcard{width:112px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Chroni<span>kum</span></h1>
    <div class="sub serif">Ordne die Geschichte. Zehn Karten gewinnen.</div>
  </header>

  <!-- SETUP -->
  <section id="setup" class="card-panel setup">
    <h2>Neue Partie</h2>
    <p>Wie Hitster, nur mit Weltgeschichte: Ziehe ein Ereignis, ordne es in deine Zeitleiste ein – ohne die Jahreszahl zu kennen. Liegt es richtig, bleibt die Karte. Wer zuerst <b style="color:var(--messing-hell)">10 Karten</b> gesammelt hat, gewinnt.</p>
    <label>Anzahl Spieler</label>
    <div class="chips" id="playerCount">
      <button class="chip" data-n="1">1</button>
      <button class="chip on" data-n="2">2</button>
      <button class="chip" data-n="3">3</button>
      <button class="chip" data-n="4">4</button>
    </div>
    <div id="nameInputs"></div>
    <label>Schwierigkeit</label>
    <div class="chips" id="difficulty">
      <button class="chip on" data-d="all">Alle Epochen</button>
      <button class="chip" data-d="modern">Ab 1500</button>
      <button class="chip" data-d="20th">Ab 1900</button>
    </div>
    <button class="btn start" id="startBtn">Partie starten</button>
  </section>

  <!-- GAME -->
  <section id="game" class="hidden">
    <div class="scores" id="scores"></div>
    <div class="stage">
      <div class="draw-area">
        <div class="event-card" id="eventCard">
          <div class="eyebrow" id="cardEyebrow">Ereignis</div>
          <h3 id="cardTitle"></h3>
          <div class="year" id="cardYear"></div>
          <div class="desc" id="cardDesc"></div>
        </div>
      </div>
      <div class="hint" id="hint"></div>
      <div class="feedback hidden" id="feedback">
        <div class="msg" id="feedbackMsg"></div>
        <div class="next"><button class="btn" id="nextBtn">Weiter</button></div>
      </div>
      <div id="timelines"></div>
      <div class="controls">
        <button class="btn ghost" id="quitBtn">Partie beenden</button>
      </div>
    </div>
  </section>

  <!-- WIN -->
  <div class="overlay hidden" id="winOverlay">
    <div class="inner inner-final">
      <h2 id="winTitle"></h2>
      <p id="winText"></p>
      <div id="finalLists"></div>
      <button class="btn" id="againBtn">Neue Partie</button>
    </div>
  </div>
</div>

// ---------------- State ----------------
const WIN_CARDS = 10;
let players = [], current = 0, deck = [], drawn = null, phase = "place", difficulty = "all";

const $ = id => document.getElementById(id);
const fmtYear = y => y < 0 ? Math.abs(y) + " v. Chr." : String(y);

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

// ---------------- Setup UI ----------------
let playerN = 2;
$("playerCount").addEventListener("click", e=>{
  const b = e.target.closest(".chip"); if(!b) return;
  playerN = +b.dataset.n;
  [...$("playerCount").children].forEach(c=>c.classList.toggle("on", c===b));
  renderNameInputs();
});
$("difficulty").addEventListener("click", e=>{
  const b = e.target.closest(".chip"); if(!b) return;
  difficulty = b.dataset.d;
  [...$("difficulty").children].forEach(c=>c.classList.toggle("on", c===b));
});
function renderNameInputs(){
  const box = $("nameInputs"); box.innerHTML = "";
  for(let i=0;i<playerN;i++){
    const lab = document.createElement("label"); lab.textContent = "Name Spieler " + (i+1);
    const inp = document.createElement("input"); inp.type="text"; inp.placeholder="Spieler " + (i+1); inp.dataset.idx=i; inp.maxLength=20;
    box.append(lab, inp);
  }
}
renderNameInputs();

$("startBtn").addEventListener("click", startGame);
$("againBtn").addEventListener("click", ()=>{ $("winOverlay").classList.add("hidden"); $("game").classList.add("hidden"); $("setup").classList.remove("hidden"); });
$("quitBtn").addEventListener("click", ()=>{ $("game").classList.add("hidden"); $("setup").classList.remove("hidden"); });
$("nextBtn").addEventListener("click", nextTurn);

// ---------------- Game ----------------
function startGame(){
  let pool = EVENTS.slice();
  if(difficulty==="modern") pool = pool.filter(e=>e.y>=1500);
  if(difficulty==="20th") pool = pool.filter(e=>e.y>=1900);
  deck = shuffle(pool.slice());

  players = [];
  const inputs = [...$("nameInputs").querySelectorAll("input")];
  for(let i=0;i<playerN;i++){
    const name = (inputs[i]?.value.trim()) || "Spieler " + (i+1);
    players.push({name, timeline:[deck.pop()]});
  }
  current = 0;
  $("setup").classList.add("hidden");
  $("game").classList.remove("hidden");
  beginTurn();
}

function beginTurn(){
  if(deck.length===0){ endByDeck(); return; }
  drawn = deck.pop();
  phase = "place";
  const ec = $("eventCard");
  ec.classList.remove("revealed","correct","wrong");
  $("cardEyebrow").textContent = "Ereignis für " + players[current].name;
  $("cardTitle").textContent = drawn.t;
  $("cardYear").textContent = fmtYear(drawn.y);
  $("cardDesc").textContent = drawn.d;
  $("feedback").classList.add("hidden");
  $("hint").innerHTML = "<b>" + esc(players[current].name) + "</b>, wann war das? Wähle eine Lücke in deiner Zeitleiste.";
  render();
}

function render(){
  // Scoreboard
  const sb = $("scores"); sb.innerHTML = "";
  players.forEach((p,i)=>{
    const d = document.createElement("div");
    d.className = "score" + (i===current ? " active":"");
    d.innerHTML = '<span class="name">'+esc(p.name)+'</span><span class="pts">'+p.timeline.length+' / '+WIN_CARDS+'</span>';
    sb.append(d);
  });
  // Zeitleisten aller Spieler
  const box = $("timelines"); box.innerHTML = "";
  players.forEach((p, pIdx)=>{
    const isActive = pIdx===current;
    const wrap = document.createElement("div");
    wrap.className = "timeline-wrap " + (isActive ? "active" : "inactive");

    const label = document.createElement("div");
    label.className = "timeline-label";
    label.innerHTML = '<span class="owner">'+esc(p.name)+
      '</span><span>'+(isActive ? '<span class="turn-tag">am Zug</span> &nbsp;·&nbsp; ' : '')+
      '← früher · später →</span>';
    wrap.append(label);

    const scroll = document.createElement("div"); scroll.className = "timeline-scroll";
    const tl = document.createElement("div"); tl.className = "timeline";
    const cards = p.timeline.slice().sort((a,b)=>a.y-b.y);
    const canPlace = isActive && phase==="place";

    for(let i=0;i<=cards.length;i++){
      const slot = document.createElement("button");
      slot.className = "slot" + (canPlace ? " enabled":"");
      slot.textContent = "+";
      slot.setAttribute("aria-label","Hier einordnen");
      slot.disabled = !canPlace;
      if(canPlace) slot.addEventListener("click", ()=>place(i, cards));
      tl.append(slot);
      if(i<cards.length){
        const c = document.createElement("div");
        c.className = "tcard";
        c.innerHTML = '<div class="y">'+fmtYear(cards[i].y)+'</div><div class="t">'+esc(cards[i].t)+'</div>';
        tl.append(c);
      }
    }
    scroll.append(tl); wrap.append(scroll); box.append(wrap);
  });
}

function place(idx, cards){
  if(phase!=="place") return;
  phase = "revealed";
  const left = idx>0 ? cards[idx-1].y : -Infinity;
  const right = idx<cards.length ? cards[idx].y : Infinity;
  const ok = drawn.y >= left && drawn.y <= right;

  const ec = $("eventCard");
  ec.classList.add("revealed", ok ? "correct" : "wrong");
  $("hint").textContent = "";

  if(ok) players[current].timeline.push(drawn);

  const fb = $("feedback"), msg = $("feedbackMsg");
  fb.classList.remove("hidden");
  msg.className = "msg " + (ok ? "ok" : "no");
  msg.textContent = ok ? "Richtig eingeordnet!" : "Leider falsch – Karte verworfen.";
  render();

  if(players[current].timeline.length >= WIN_CARDS){
    setTimeout(()=>win(players[current]), 700);
  }
}

function nextTurn(){
  current = (current+1) % players.length;
  beginTurn();
}

function renderFinalLists(winnerName){
  const box = $("finalLists"); box.innerHTML = "";
  players.forEach(p=>{
    const cards = p.timeline.slice().sort((a,b)=>a.y-b.y);
    const block = document.createElement("div");
    block.className = "final-block" + (p.name===winnerName ? " winner" : "");
    let rows = "";
    cards.forEach(c=>{
      rows += '<div class="final-row"><span class="fy">'+fmtYear(c.y)+
              '</span><span class="ft">'+esc(c.t)+'</span></div>';
    });
    block.innerHTML =
      '<div class="final-head"><span class="fname">'+esc(p.name)+
      (p.name===winnerName ? ' 🏛️' : '')+'</span>'+
      '<span class="fcount">'+cards.length+' Karten</span></div>'+
      '<div class="final-rows">'+rows+'</div>';
    box.append(block);
  });
}

function win(p){
  $("winTitle").textContent = "🏛️ " + p.name + " gewinnt!";
  $("winText").textContent = p.name + " hat als Erste:r " + WIN_CARDS + " Ereignisse korrekt in die Zeitleiste eingeordnet. Hier die finalen Zeitleisten:";
  renderFinalLists(p.name);
  $("winOverlay").classList.remove("hidden");
}

function endByDeck(){
  const best = players.slice().sort((a,b)=>b.timeline.length-a.timeline.length)[0];
  $("winTitle").textContent = "Kartenstapel leer";
  $("winText").textContent = "Die längste Zeitleiste hat " + best.name + " mit " + best.timeline.length + " Karten. Hier die finalen Zeitleisten:";
  renderFinalLists(best.name);
  $("winOverlay").classList.remove("hidden");
}

function esc(s){const d=document.createElement("div");d.textContent=s;return d.innerHTML;}
</script>
