<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swarm Development Simulation</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Swarm Development Simulation</h1>
    <canvas id="swarmCanvas" width="800" height="600"></canvas>
<div>
    <label for="numIndividuals">Number of Individuals:</label>
    <input type="number" id="numIndividuals" value="100" min="1" max="500">
</div>
<div>
    <label for="individualSize">Individual Size:</label>
    <input type="number" id="individualSize" value="5" min="1" max="20">
</div>
<div>
    <label for="speed">Speed:</label>
    <input type="number" id="speed" value="2" min="1" max="10">
</div>
<div>
    <label for="attractionStrength">Attraction Strength:</label>
    <input type="number" id="attractionStrength" value="0.1" step="0.01" min="0" max="1">
</div>
    <script src="script.js"></script>
</body>
</html>
