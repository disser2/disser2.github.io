<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QR-Code-Anatomie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme: light;
  --bg:#EDF0EC; --panel:#FFFFFF; --panel-2:#F6F8F5; --ink:#141A1C; --muted:#5C686D;
  --line:#D3D9D4; --line-soft:#E4E8E4; --accent:#0E8C7F; --accent-ink:#FFFFFF;
  --chip:#EEF2EF; --focus:#1F3A93; --shadow:0 1px 0 rgba(20,26,28,.04), 0 12px 28px -18px rgba(20,26,28,.35);
  --tile:#FFFFFF;
  --sans:"Archivo", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#101416; --panel:#182023; --panel-2:#1D2629; --ink:#E4EAE6; --muted:#93A1A5;
    --line:#2B3538; --line-soft:#232C2F; --accent:#3CC2B2; --accent-ink:#0B1413;
    --chip:#222C2F; --focus:#8FB0FF; --shadow:0 1px 0 rgba(0,0,0,.2), 0 14px 30px -18px rgba(0,0,0,.7);
    --tile:#F4F6F3;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#101416; --panel:#182023; --panel-2:#1D2629; --ink:#E4EAE6; --muted:#93A1A5;
  --line:#2B3538; --line-soft:#232C2F; --accent:#3CC2B2; --accent-ink:#0B1413;
  --chip:#222C2F; --focus:#8FB0FF; --shadow:0 1px 0 rgba(0,0,0,.2), 0 14px 30px -18px rgba(0,0,0,.7);
  --tile:#F4F6F3;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0; text-wrap:balance; font-weight:650; letter-spacing:-.01em}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px}
.wrap{max-width:1240px; margin:0 auto; padding-inline:20px}
.mono{font-family:var(--mono)}
.label{font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted)}

/* Kopf */
header.top{padding-block:22px 14px}
.top .wrap{display:flex; flex-wrap:wrap; align-items:flex-end; gap:8px 20px}
.brand{display:flex; align-items:center; gap:12px}
.glyph{width:34px; height:34px; display:grid; grid-template-columns:repeat(3,1fr); gap:2px}
.glyph i{background:var(--ink); border-radius:1px}
.glyph i:nth-child(2),.glyph i:nth-child(4),.glyph i:nth-child(9){background:transparent}
.glyph i:nth-child(5){background:var(--accent)}
.top h1{font-size:24px}
.top p{margin:0; color:var(--muted); max-width:62ch}
.back{margin-left:auto; font-size:13px; color:var(--muted); text-decoration:none; border:1px solid var(--line); padding:5px 10px; border-radius:4px}
.back:hover{color:var(--ink); border-color:var(--muted)}

/* Eingabe */
.input-card{background:var(--panel); border:1px solid var(--line); border-radius:8px; box-shadow:var(--shadow)}
.types{display:flex; gap:2px; overflow-x:auto; border-bottom:1px solid var(--line-soft); padding-inline:14px}
.types button{appearance:none; border:0; background:none; padding:11px 10px 10px; border-bottom:2px solid transparent; cursor:pointer; color:var(--muted); font-weight:560; white-space:nowrap; font-size:14px}
.types button[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--accent)}
.types button:hover{color:var(--ink)}
.input-body{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:18px; padding:14px}
.fields{display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:10px 12px}
.fields .wide{grid-column:1/-1}
.field label{display:block; font-size:12px; color:var(--muted); margin-bottom:3px}
.field input,.field select,.field textarea{width:100%; padding:8px 10px; border:1px solid var(--line); background:var(--panel-2); border-radius:5px; font-size:14px}
.field textarea{resize:vertical; min-height:62px; font-family:var(--mono); font-size:13px}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent); outline:none}
.settings{display:flex; flex-wrap:wrap; gap:12px; align-items:flex-end; align-content:flex-start; max-width:430px}
.seg{display:inline-flex; border:1px solid var(--line); border-radius:5px; overflow:hidden}
.seg button{appearance:none; border:0; background:var(--panel-2); padding:7px 11px; cursor:pointer; font-family:var(--mono); font-size:13px; border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink)}
.payload{grid-column:1/-1; display:flex; gap:10px; align-items:baseline; border-top:1px dashed var(--line); padding-top:10px; min-width:0}
.payload code{font-family:var(--mono); font-size:12.5px; background:var(--chip); padding:3px 7px; border-radius:4px; overflow-wrap:anywhere; white-space:pre-wrap; flex:1; min-width:0}
.err{color:#C4362F; font-size:13px}

/* Hauptbereich */
main{padding-block:18px 40px}
.stage{display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); gap:18px; margin-top:18px; align-items:start}
.panel{background:var(--panel); border:1px solid var(--line); border-radius:8px}
.viewer{padding:14px}
.viewbar{display:flex; flex-wrap:wrap; gap:10px 14px; align-items:center; margin-bottom:12px}
.toggle{display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--muted); cursor:pointer; user-select:none}
.toggle input{accent-color:var(--accent)}
.canvas-box{background:var(--tile); border-radius:6px; position:relative; aspect-ratio:1/1; max-width:100%; touch-action:manipulation}
#qr{display:block; width:100%; height:100%; cursor:crosshair; border-radius:6px}
.legend{display:flex; flex-wrap:wrap; gap:6px; margin-top:12px}
.legend button{appearance:none; display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); background:var(--panel-2); border-radius:999px; padding:3px 10px 3px 6px; font-size:12.5px; cursor:pointer}
.legend button:hover,.legend button.on{border-color:var(--ink)}
.legend .sw{width:12px; height:12px; border-radius:2px; flex:0 0 auto}
.legend .n{font-family:var(--mono); font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums}

.side{display:flex; flex-direction:column; gap:18px; min-width:0}
.stats{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:8px; overflow:hidden}
.stat{background:var(--panel); padding:10px 12px}
.stat b{display:block; font-size:19px; font-weight:650; font-variant-numeric:tabular-nums; letter-spacing:-.01em}
.stat span{font-size:12px; color:var(--muted)}

.inspector{padding:14px 16px; min-height:208px}
.insp-head{display:flex; align-items:center; gap:10px; margin-bottom:8px}
.insp-head .sw{width:16px; height:16px; border-radius:3px; flex:0 0 auto}
.insp-head h3{font-size:17px}
.insp-head .pos{margin-left:auto; font-family:var(--mono); font-size:12px; color:var(--muted)}
.inspector p{margin:6px 0; color:var(--ink); max-width:65ch}
.kv{display:grid; grid-template-columns:auto 1fr; gap:3px 14px; font-size:13.5px; margin-top:10px}
.kv dt{color:var(--muted)}
.kv dd{margin:0; font-family:var(--mono); font-size:13px; overflow-wrap:anywhere}
.bits{display:inline-flex; gap:2px; vertical-align:middle}
.bits i{font-style:normal; width:17px; height:20px; display:inline-grid; place-items:center; font-family:var(--mono); font-size:12px; border:1px solid var(--line); border-radius:3px; background:var(--panel-2)}
.bits i.cur{background:var(--ink); color:var(--panel); border-color:var(--ink)}
.hint{font-size:12.5px; color:var(--muted)}

.context{padding:14px 16px}
.context h3{font-size:15px; margin-bottom:2px}
.ctx-list{display:flex; flex-direction:column; gap:4px; margin-top:10px}
.ctx-row{display:grid; grid-template-columns:120px minmax(0,1fr); gap:10px; padding:6px 8px; border-radius:5px; cursor:pointer; border:1px solid transparent; align-items:baseline}
.ctx-row:hover,.ctx-row.on{background:var(--panel-2); border-color:var(--line)}
.ctx-row .k{font-size:12.5px; color:var(--muted)}
.ctx-row .v{font-family:var(--mono); font-size:12.5px; overflow-wrap:anywhere}
.ctx-row .v small{color:var(--muted); font-family:var(--sans)}

/* Tabs unten */
.deep{margin-top:18px}
.deep-tabs{display:flex; gap:2px; overflow-x:auto; border-bottom:1px solid var(--line); padding-inline:14px}
.deep-tabs button{appearance:none; border:0; background:none; padding:12px 10px 11px; cursor:pointer; color:var(--muted); font-weight:560; border-bottom:2px solid transparent; white-space:nowrap; font-size:14px}
.deep-tabs button[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--accent)}
.deep-body{padding:16px}
.deep-body > section > p.lead{margin:0 0 12px; max-width:78ch; color:var(--muted)}
.chips{display:flex; flex-wrap:wrap; gap:5px}
.chip{border:1px solid var(--line); border-radius:5px; padding:4px 7px 5px; background:var(--panel-2); cursor:pointer; display:flex; flex-direction:column; gap:1px; min-width:0}
.chip:hover,.chip.on{border-color:var(--ink)}
.chip .t{font-size:11.5px; color:var(--muted); display:flex; gap:6px; align-items:center; white-space:nowrap}
.chip .t .sw{width:8px; height:8px; border-radius:2px}
.chip .b{font-family:var(--mono); font-size:12.5px; letter-spacing:.04em}
.chip .c{font-family:var(--mono); font-size:13px; font-weight:600}
.blocks{display:flex; flex-direction:column; gap:12px}
.block-row{display:flex; gap:10px; align-items:flex-start}
.block-row .bn{font-family:var(--mono); font-size:12px; color:var(--muted); width:62px; flex:0 0 auto; padding-top:4px}
.cws{display:flex; flex-wrap:wrap; gap:3px; min-width:0}
.cw{font-family:var(--mono); font-size:12px; padding:3px 5px; border-radius:3px; cursor:pointer; border:1px solid transparent; font-variant-numeric:tabular-nums; line-height:1.2; text-align:center}
.cw small{display:block; font-size:9.5px; opacity:.75}
.cw:hover,.cw.on{border-color:var(--ink)}
.bitrow{display:flex; flex-wrap:wrap; gap:3px; align-items:center; margin:6px 0}
.bitrow .rl{width:150px; font-size:12.5px; color:var(--muted); flex:0 0 auto}
.bitcell{width:26px; height:30px; display:inline-grid; place-items:center; font-family:var(--mono); font-size:13px; border-radius:3px; cursor:pointer; border:1px solid var(--line); background:var(--panel-2); line-height:1}
.bitcell small{font-size:8.5px; color:var(--muted); display:block}
.bitcell:hover,.bitcell.on{border-color:var(--ink)}
.grp-sep{width:8px}
.masks{display:grid; grid-template-columns:repeat(auto-fill,minmax(132px,1fr)); gap:10px}
.mask-card{border:1px solid var(--line); border-radius:6px; padding:8px; background:var(--panel-2); cursor:pointer; text-align:left; appearance:none; display:flex; flex-direction:column; gap:5px}
.mask-card.sel{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent)}
.mask-card canvas{width:100%; aspect-ratio:1/1; background:#fff; border-radius:3px; image-rendering:pixelated}
.mask-card .mh{display:flex; justify-content:space-between; font-size:12.5px; font-weight:600}
.mask-card .mf{font-family:var(--mono); font-size:11px; color:var(--muted)}
.mask-card .pen{font-family:var(--mono); font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums}
.pathctl{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:10px}
.pathctl input[type=range]{flex:1; min-width:160px; accent-color:var(--accent)}
.btn{appearance:none; border:1px solid var(--line); background:var(--panel-2); padding:6px 12px; border-radius:5px; cursor:pointer; font-size:13.5px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.explain{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:14px}
.explain div{border-top:2px solid var(--line); padding-top:8px}
.explain h4{margin:0 0 4px; font-size:14px}
.explain p{margin:0; font-size:13.5px; color:var(--muted)}
.scroll-x{overflow-x:auto}
footer{color:var(--muted); font-size:12.5px; padding-block:0 30px}

@media (max-width: 900px){
  .stage{grid-template-columns:minmax(0,1fr)}
  .input-body{grid-template-columns:minmax(0,1fr)}
  .settings{max-width:none}
}
@media (max-width: 480px){
  .wrap{padding-inline:16px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ctx-row{grid-template-columns:minmax(0,1fr)}
  .bitrow .rl{width:100%}
  .top h1{font-size:21px}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important; animation:none!important} }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <div class="glyph" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <h1>QR-Code-Anatomie</h1>
    </div>
    <p>Inhalt eingeben, Code erzeugen und Modul für Modul nachvollziehen, welcher Bereich welche Information trägt.</p>
    <a class="back" href="../simulationen.html">← Alle Simulationen</a>
  </div>
</header>

<main class="wrap">
  <!-- Eingabe -->
  <div class="input-card">
    <div class="types" role="tablist" id="types"></div>
    <div class="input-body">
      <div class="fields" id="fields"></div>
      <div class="settings">
        <div class="field">
          <label>Fehlerkorrektur</label>
          <div class="seg" id="ecl">
            <button data-v="L" title="ca. 7 % der Codewörter rekonstruierbar">L</button>
            <button data-v="M" title="ca. 15 %">M</button>
            <button data-v="Q" title="ca. 25 %">Q</button>
            <button data-v="H" title="ca. 30 %">H</button>
          </div>
        </div>
        <div class="field">
          <label for="mode">Kodiermodus</label>
          <select id="mode">
            <option value="auto">automatisch</option>
            <option value="numeric">numerisch</option>
            <option value="alnum">alphanumerisch</option>
            <option value="byte">Byte (UTF-8)</option>
          </select>
        </div>
        <div class="field">
          <label for="maskSel">Maske</label>
          <select id="maskSel">
            <option value="-1">automatisch</option>
            <option value="0">0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option>
            <option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option>
          </select>
        </div>
        <div class="field">
          <label for="minVer">Mindestversion</label>
          <select id="minVer"></select>
        </div>
      </div>
      <div class="payload">
        <span class="label">Nutzlast</span>
        <code id="payload"></code>
      </div>
      <div class="err" id="err" hidden></div>
    </div>
  </div>

  <!-- Code + Inspektor -->
  <div class="stage">
    <div class="panel viewer">
      <div class="viewbar">
        <div class="seg" id="view">
          <button data-v="role">Funktion</button>
          <button data-v="content">Inhalt</button>
          <button data-v="block">Blöcke</button>
          <button data-v="plain">Schwarz-Weiß</button>
        </div>
        <label class="toggle"><input type="checkbox" id="unmask"> Maske entfernen</label>
        <label class="toggle"><input type="checkbox" id="bounds" checked> Codewort-Grenzen</label>
        <label class="toggle"><input type="checkbox" id="nums"> Nummern</label>
      </div>
      <div class="canvas-box" id="cbox"><canvas id="qr" aria-label="QR-Code, mit der Maus erkundbar"></canvas></div>
      <div class="legend" id="legend"></div>
    </div>

    <div class="side">
      <div class="stats" id="stats"></div>
      <div class="panel inspector" id="inspector" aria-live="polite"></div>
      <div class="panel context" id="context"></div>
    </div>
  </div>

  <!-- Vertiefung -->
  <div class="panel deep">
    <div class="deep-tabs" role="tablist" id="deepTabs">
      <button data-t="bits">Bitstrom</button>
      <button data-t="cw">Codewörter &amp; Blöcke</button>
      <button data-t="format">Format &amp; Version</button>
      <button data-t="mask">Masken</button>
      <button data-t="path">Lesepfad</button>
      <button data-t="about">Grundlagen</button>
    </div>
    <div class="deep-body" id="deepBody"></div>
  </div>
</main>
<footer class="wrap">Kodierung nach ISO/IEC 18004 (Modell 2, Versionen 1–40), vollständig im Browser berechnet. Mit der Handykamera scannbar.</footer>

<script>
'use strict';
/* =====================================================================
   QR-Encoder mit Buchführung: jedes Modul weiß, woher es kommt.
   ===================================================================== */
const QR = (() => {
  const ECL = { L:{fb:1, i:0}, M:{fb:0, i:1}, Q:{fb:3, i:2}, H:{fb:2, i:3} };
  const ECC_PER_BLOCK = [
    [-1,7,10,15,20,26,18,20,24,30,18,20,24,26,30,22,24,28,30,28,28,28,28,30,30,26,28,30,30,30,30,30,30,30,30,30,30,30,30,30,30],
    [-1,10,16,26,18,24,16,18,22,22,26,30,22,22,24,24,28,28,26,26,26,26,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28],
    [-1,13,22,18,26,18,24,18,22,20,24,28,26,24,20,30,24,28,28,26,30,28,30,30,30,30,28,30,30,30,30,30,30,30,30,30,30,30,30,30,30],
    [-1,17,28,22,16,22,28,26,26,24,28,24,28,22,24,24,30,28,28,26,28,30,24,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30]];
  const NUM_BLOCKS = [
    [-1,1,1,1,1,1,2,2,2,2,4,4,4,4,4,6,6,6,6,7,8,8,9,9,10,12,12,12,13,14,15,16,17,18,19,19,20,21,22,24,25],
    [-1,1,1,1,2,2,4,4,4,5,5,5,8,9,9,10,10,11,13,14,16,17,17,18,20,21,23,25,26,28,29,31,33,35,37,38,40,43,45,47,49],
    [-1,1,1,2,2,4,4,6,6,8,8,8,10,12,16,12,17,16,18,21,20,23,23,25,27,29,34,34,35,38,40,43,45,48,51,53,56,59,62,65,68],
    [-1,1,1,2,4,4,4,5,6,8,8,11,11,16,16,18,16,19,21,25,25,25,34,30,32,35,37,40,42,45,48,51,54,57,60,63,66,70,74,77,81]];
  const ALNUM = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ $%*+-./:';
  const MODES = {
    numeric:{ind:0b0001, name:'numerisch', cc:[10,12,14]},
    alnum:  {ind:0b0010, name:'alphanumerisch', cc:[9,11,13]},
    byte:   {ind:0b0100, name:'Byte', cc:[8,16,16]},
  };
  const MASK_FN = [
    (x,y)=>(x+y)%2===0,
    (x,y)=>y%2===0,
    (x,y)=>x%3===0,
    (x,y)=>(x+y)%3===0,
    (x,y)=>(Math.floor(x/3)+Math.floor(y/2))%2===0,
    (x,y)=>x*y%2+x*y%3===0,
    (x,y)=>(x*y%2+x*y%3)%2===0,
    (x,y)=>((x+y)%2+x*y%3)%2===0,
  ];
  const MASK_TXT = ['(i+j) mod 2 = 0','i mod 2 = 0','j mod 3 = 0','(i+j) mod 3 = 0',
    '(⌊i/2⌋+⌊j/3⌋) mod 2 = 0','(ij mod 2)+(ij mod 3) = 0','((ij mod 2)+(ij mod 3)) mod 2 = 0','((i+j) mod 2+(ij mod 3)) mod 2 = 0'];

  function ccIdx(ver){ return ver<=9?0:ver<=26?1:2; }
  function numRawDataModules(ver){
    let r = (16*ver+128)*ver+64;
    if (ver>=2){ const na = Math.floor(ver/7)+2; r -= (25*na-10)*na-55; if (ver>=7) r -= 36; }
    return r;
  }
  function numDataCodewords(ver, ecl){
    const e = ECL[ecl].i;
    return Math.floor(numRawDataModules(ver)/8) - ECC_PER_BLOCK[e][ver]*NUM_BLOCKS[e][ver];
  }
  function alignPositions(ver){
    if (ver===1) return [];
    const size = ver*4+17, n = Math.floor(ver/7)+2;
    const step = ver===32 ? 26 : Math.ceil((ver*4+4)/(n*2-2))*2;
    const r = [6];
    for (let pos=size-7; r.length<n; pos-=step) r.splice(1,0,pos);
    return r;
  }
  // GF(256), Polynom 0x11D
  function gmul(x,y){ let z=0; for (let i=7;i>=0;i--){ z=(z<<1)^((z>>>7)*0x11D); z^=((y>>>i)&1)*x; } return z; }
  function rsDivisor(deg){
    const r = new Array(deg).fill(0); r[deg-1]=1; let root=1;
    for (let i=0;i<deg;i++){ for (let j=0;j<deg;j++){ r[j]=gmul(r[j],root); if (j+1<deg) r[j]^=r[j+1]; } root=gmul(root,2); }
    return r;
  }
  function rsRemainder(data, div){
    const r = div.map(()=>0);
    for (const b of data){ const f = b ^ r.shift(); r.push(0); div.forEach((c,i)=> r[i]^=gmul(c,f)); }
    return r;
  }
  function utf8(str){
    // liefert Bytes mit Zuordnung zum Zeichenindex (UTF-16-Index im String)
    const out = [];
    for (let i=0;i<str.length;){
      const cp = str.codePointAt(i), w = cp>0xFFFF?2:1;
      const bytes = Array.from(new TextEncoder().encode(String.fromCodePoint(cp)));
      bytes.forEach((b,k)=> out.push({b, ci:i, cw:w, k, n:bytes.length}));
      i += w;
    }
    return out;
  }
  function autoMode(t){
    if (/^[0-9]*$/.test(t)) return 'numeric';
    if ([...t].every(c=>ALNUM.includes(c))) return 'alnum';
    return 'byte';
  }
  function canMode(t, m){
    if (m==='numeric') return /^[0-9]*$/.test(t);
    if (m==='alnum') return [...t].every(c=>ALNUM.includes(c));
    return true;
  }
  const bin = (v,n)=> v.toString(2).padStart(n,'0');

  // Nutzdaten-Elemente (ohne Modus/Zeichenzähler) und deren Bitlänge
  function payloadItems(text, mode){
    const items = [];
    if (mode==='numeric'){
      for (let i=0;i<text.length;i+=3){
        const s = text.substr(i,3), n = s.length===3?10:s.length===2?7:4;
        items.push({kind:'char', text:s, ci:i, cn:s.length, value:+s, bits:bin(+s,n),
          note:`Ziffern „${s}“ als Zahl ${+s} in ${n} Bit`});
      }
    } else if (mode==='alnum'){
      for (let i=0;i<text.length;i+=2){
        const s = text.substr(i,2);
        if (s.length===2){
          const a = ALNUM.indexOf(s[0]), b = ALNUM.indexOf(s[1]), v = a*45+b;
          items.push({kind:'char', text:s, ci:i, cn:2, value:v, bits:bin(v,11), note:`„${s[0]}“=${a}, „${s[1]}“=${b} → ${a}·45+${b} = ${v} in 11 Bit`});
        } else {
          const a = ALNUM.indexOf(s);
          items.push({kind:'char', text:s, ci:i, cn:1, value:a, bits:bin(a,6), note:`„${s}“=${a} in 6 Bit`});
        }
      }
    } else {
      for (const u of utf8(text)){
        const ch = text.substr(u.ci, u.cw);
        const disp = ch===' '?'␣':ch==='\n'?'↵':ch==='\r'?'␍':ch;
        items.push({kind:'char', text:disp, ci:u.ci, cn:u.cw, value:u.b, bits:bin(u.b,8),
          note: u.n===1 ? `Zeichen „${disp}“ = 0x${u.b.toString(16).toUpperCase().padStart(2,'0')} (UTF-8)`
                        : `Zeichen „${disp}“, UTF-8-Byte ${u.k+1} von ${u.n}: 0x${u.b.toString(16).toUpperCase()}`});
      }
    }
    return items;
  }

  function penalty(m){
    const n = m.length; let p1=0,p2=0,p3=0,dark=0;
    const line = (get)=>{
      let run=1;
      for (let i=1;i<=n;i++){
        if (i<n && get(i)===get(i-1)) run++;
        else { if (run>=5) p1 += 3+(run-5); run=1; }
      }
      const at = i => (i<0||i>=n) ? false : get(i);
      for (let i=-4;i<n;i++){
        // 1:1:3:1:1 mit 4 hellen Modulen davor oder danach
        if (at(i+4)&&!at(i+5)&&at(i+6)&&at(i+7)&&at(i+8)&&!at(i+9)&&at(i+10)){
          const pre = !at(i)&&!at(i+1)&&!at(i+2)&&!at(i+3);
          const post = !at(i+11)&&!at(i+12)&&!at(i+13)&&!at(i+14);
          if (pre||post) p3+=40;
        }
      }
    };
    for (let y=0;y<n;y++) line(i=>m[y][i]);
    for (let x=0;x<n;x++) line(i=>m[i][x]);
    for (let y=0;y<n-1;y++) for (let x=0;x<n-1;x++){
      const c=m[y][x]; if (c===m[y][x+1]&&c===m[y+1][x]&&c===m[y+1][x+1]) p2+=3;
    }
    for (let y=0;y<n;y++) for (let x=0;x<n;x++) if (m[y][x]) dark++;
    const pct = dark*100/(n*n);
    const p4 = Math.floor(Math.abs(pct-50)/5)*10;
    return {p1,p2,p3,p4,total:p1+p2+p3+p4, pct};
  }

  function formatBits(ecl, mask){
    const data = (ECL[ecl].fb<<3)|mask;
    let rem = data; for (let i=0;i<10;i++) rem=(rem<<1)^((rem>>>9)*0x537);
    return {data, bch:rem&0x3FF, raw:(data<<10)|(rem&0x3FF), bits:((data<<10)|(rem&0x3FF))^0x5412};
  }
  function versionBits(ver){
    let rem = ver; for (let i=0;i<12;i++) rem=(rem<<1)^((rem>>>11)*0x1F25);
    return {bch:rem&0xFFF, bits:(ver<<12)|(rem&0xFFF)};
  }

  function encode(text, opt){
    const ecl = opt.ecl;
    let mode = opt.mode==='auto' ? autoMode(text) : opt.mode;
    if (!canMode(text, mode)) throw new Error(`Der Text enthält Zeichen, die im Modus „${MODES[mode].name}“ nicht darstellbar sind. Alphanumerisch erlaubt nur 0–9, A–Z (Großbuchstaben), Leerzeichen und $ % * + - . / :`);
    const items = payloadItems(text, mode);
    const payloadBits = items.reduce((s,it)=>s+it.bits.length,0);
    const charCount = mode==='byte' ? items.length : text.length;

    // kleinste passende Version
    let ver = Math.max(1, opt.minVer||1), cap;
    for (;;ver++){
      if (ver>40) throw new Error('Der Inhalt ist zu lang für einen QR-Code mit dieser Fehlerkorrekturstufe (maximal Version 40).');
      const ccb = MODES[mode].cc[ccIdx(ver)];
      cap = numDataCodewords(ver, ecl)*8;
      if (charCount < (1<<ccb) && 4+ccb+payloadBits <= cap) break;
    }
    const ccBits = MODES[mode].cc[ccIdx(ver)];
    const all = [
      {kind:'mode', text:'Modus', bits:bin(MODES[mode].ind,4), note:`Modusindikator ${bin(MODES[mode].ind,4)} = ${MODES[mode].name}`},
      {kind:'count', text:'Länge', bits:bin(charCount,ccBits), value:charCount,
        note:`Zeichenzähler: ${charCount} ${mode==='byte'?'Bytes':'Zeichen'} in ${ccBits} Bit (Version ${ver})`},
      ...items];
    let len = all.reduce((s,it)=>s+it.bits.length,0);
    const term = Math.min(4, cap-len);
    if (term>0){ all.push({kind:'term', text:'Ende', bits:'0'.repeat(term), note:`Terminator: ${term} Nullbits markieren das Ende der Daten`}); len+=term; }
    if (len%8){ const k=8-len%8; all.push({kind:'padbits', text:'Auffüllen', bits:'0'.repeat(k), note:`${k} Nullbits bis zur nächsten Bytegrenze`}); len+=k; }
    for (let pb=0xEC; len<cap; pb^=0xEC^0x11){
      all.push({kind:'padbyte', text:pb===0xEC?'EC':'11', value:pb, bits:bin(pb,8), note:`Füllbyte 0x${pb.toString(16).toUpperCase()} (${bin(pb,8)}); 0xEC und 0x11 wechseln sich ab, bis die Kapazität voll ist`});
      len+=8;
    }
    // Bitliste mit Herkunft
    const bitOwner = [], bitArr = [];
    all.forEach((it,idx)=>{ it.idx=idx; it.start=bitArr.length; for (const c of it.bits){ bitArr.push(c==='1'?1:0); bitOwner.push(idx); } });
    const dataCw = [];
    for (let i=0;i<bitArr.length;i+=8){ let v=0; for (let k=0;k<8;k++) v=(v<<1)|bitArr[i+k]; dataCw.push(v); }

    // Blöcke + Reed-Solomon
    const e = ECL[ecl].i, nb = NUM_BLOCKS[e][ver], eccLen = ECC_PER_BLOCK[e][ver];
    const rawCw = Math.floor(numRawDataModules(ver)/8);
    const nShort = nb - rawCw%nb, shortLen = Math.floor(rawCw/nb);
    const div = rsDivisor(eccLen);
    const blocks = [];
    for (let i=0,k=0;i<nb;i++){
      const dlen = shortLen-eccLen+(i<nShort?0:1);
      const dat = dataCw.slice(k,k+dlen), ecc = rsRemainder(dat, div);
      blocks.push({data:dat.map((v,j)=>({v, di:k+j})), ecc:ecc.map(v=>({v})), dlen});
      k+=dlen;
    }
    // Verschränkung
    const cws = [];
    const maxD = Math.max(...blocks.map(b=>b.dlen));
    for (let j=0;j<maxD;j++) blocks.forEach((b,bi)=>{ if (j<b.dlen){ const c=b.data[j]; c.ii=cws.length; cws.push({type:'data', v:c.v, block:bi, j, di:c.di}); } });
    for (let j=0;j<eccLen;j++) blocks.forEach((b,bi)=>{ const c=b.ecc[j]; c.ii=cws.length; cws.push({type:'ec', v:c.v, block:bi, j}); });

    // Matrix aufbauen
    const size = ver*4+17;
    const M = Array.from({length:size},()=>new Array(size).fill(false));
    const role = Array.from({length:size},()=>new Array(size).fill(null));
    const info = Array.from({length:size},()=>new Array(size).fill(null));
    const setF = (x,y,dark,r,inf)=>{ M[y][x]=dark; role[y][x]=r; info[y][x]=inf; };
    for (let i=0;i<size;i++){ setF(6,i,i%2===0,'timing',{grp:'timing-v', k:i}); setF(i,6,i%2===0,'timing',{grp:'timing-h', k:i}); }
    [[3,3,'oben links'],[size-4,3,'oben rechts'],[3,size-4,'unten links']].forEach(([cx,cy,name],fi)=>{
      for (let dy=-4;dy<=4;dy++) for (let dx=-4;dx<=4;dx++){
        const x=cx+dx, y=cy+dy; if (x<0||y<0||x>=size||y>=size) continue;
        const d = Math.max(Math.abs(dx),Math.abs(dy));
        if (d===4) setF(x,y,false,'separator',{grp:'sep-'+fi, name});
        else setF(x,y,d!==2,'finder',{grp:'finder-'+fi, name, ring:d});
      }
    });
    const ap = alignPositions(ver); let ai=0;
    ap.forEach((ay,i)=>ap.forEach((ax,j)=>{
      if ((i===0&&j===0)||(i===0&&j===ap.length-1)||(i===ap.length-1&&j===0)) return;
      const id=ai++;
      for (let dy=-2;dy<=2;dy++) for (let dx=-2;dx<=2;dx++)
        setF(ax+dx, ay+dy, Math.max(Math.abs(dx),Math.abs(dy))!==1, 'alignment', {grp:'align-'+id, cx:ax, cy:ay});
    }));
    // Format-Bereiche reservieren (Platzhalter), Dunkelmodul
    const fmtPos = []; // [bit] -> [[x,y],[x,y]]
    for (let i=0;i<15;i++) fmtPos.push([]);
    for (let i=0;i<=5;i++) fmtPos[i].push([8,i]);
    fmtPos[6].push([8,7]); fmtPos[7].push([8,8]); fmtPos[8].push([7,8]);
    for (let i=9;i<15;i++) fmtPos[i].push([14-i,8]);
    for (let i=0;i<8;i++) fmtPos[i].push([size-1-i,8]);
    for (let i=8;i<15;i++) fmtPos[i].push([8,size-15+i]);
    fmtPos.forEach((ps,b)=>ps.forEach(([x,y],c)=>setF(x,y,false,'format',{grp:'fmt-'+b, bit:b, copy:c+1})));
    setF(8,size-8,true,'darkmodule',{grp:'darkmodule'});
    const verPos = [];
    let vb = null;
    if (ver>=7){
      vb = versionBits(ver);
      for (let i=0;i<18;i++){
        const a=size-11+i%3, b=Math.floor(i/3), bit=(vb.bits>>>i)&1;
        setF(a,b,!!bit,'version',{grp:'ver-'+i, bit:i, copy:1});
        setF(b,a,!!bit,'version',{grp:'ver-'+i, bit:i, copy:2});
        verPos.push([[a,b],[b,a]]);
      }
    }
    // Daten im Zickzack platzieren
    const path = [];
    const nbits = cws.length*8; let bi2=0;
    for (let right=size-1; right>=1; right-=2){
      if (right===6) right=5;
      for (let vert=0; vert<size; vert++) for (let j=0;j<2;j++){
        const x=right-j, upward=((right+1)&2)===0, y=upward?size-1-vert:vert;
        if (role[y][x]) continue;
        if (bi2<nbits){
          const ci=bi2>>>3, k=bi2&7, c=cws[ci], v=(c.v>>>(7-k))&1;
          M[y][x]=!!v; role[y][x]=c.type;
          const inf = {grp:'cw-'+ci, cw:ci, bit:k, stream:bi2, v, upward};
          if (c.type==='data'){ inf.gbit = c.di*8+k; inf.item = bitOwner[inf.gbit]; }
          info[y][x]=inf;
          path.push([x,y,bi2]);
          bi2++;
        } else {
          M[y][x]=false; role[y][x]='remainder'; info[y][x]={grp:'remainder', v:0};
          path.push([x,y,-1]);
        }
      }
    }
    const raw = M.map(r=>r.slice());
    const isFn = r => r!=='data'&&r!=='ec'&&r!=='remainder';
    function withMask(mk){
      const m = raw.map(r=>r.slice());
      for (let y=0;y<size;y++) for (let x=0;x<size;x++) if (!isFn(role[y][x]) && MASK_FN[mk](x,y)) m[y][x]=!m[y][x];
      const fb = formatBits(ecl, mk).bits;
      fmtPos.forEach((ps,b)=>ps.forEach(([x,y])=> m[y][x] = !!((fb>>>b)&1)));
      m[size-8][8]=true;
      return m;
    }
    const masks = [];
    for (let mk=0;mk<8;mk++){ const m = withMask(mk); masks.push({m, pen:penalty(m)}); }
    let mask = opt.mask;
    if (mask<0){ mask=0; for (let mk=1;mk<8;mk++) if (masks[mk].pen.total<masks[mask].pen.total) mask=mk; }
    const final = masks[mask].m;
    const fmt = formatBits(ecl, mask);

    // Gruppen-Index
    const groups = new Map();
    for (let y=0;y<size;y++) for (let x=0;x<size;x++){
      const g = info[y][x].grp; if (!groups.has(g)) groups.set(g, []); groups.get(g).push([x,y]);
    }
    // Bit -> Modul
    const streamPos = new Array(nbits);
    path.forEach(([x,y,s])=>{ if (s>=0) streamPos[s]=[x,y]; });
    const dataBitPos = (gbit)=>{ const di=gbit>>>3, k=gbit&7; const c = cwOfData[di]; return streamPos[c*8+k]; };
    const cwOfData = []; cws.forEach((c,i)=>{ if (c.type==='data') cwOfData[c.di]=i; });

    return {text, ecl, mode, ver, size, mask, cap, items:all, bitArr, dataCw, cws, blocks, eccLen, nb,
      raw, final, role, info, masks, fmt, fmtPos, vb, verPos, path, groups, streamPos, dataBitPos, cwOfData,
      charCount, ccBits, payloadBits, alignPos:ap, withMask, isFn};
  }
  return {encode, MASK_FN, MASK_TXT, MODES, ECL, formatBits, versionBits};
})();

   Inhaltstypen: Formulare -> Nutzlast, und Nutzlast -> Felder
   ===================================================================== */
const escWifi = s => s.replace(/([\\;,:"])/g,'\\$1');
const TYPES = [
  {id:'url', name:'URL', fields:[{k:'url', l:'Adresse', v:'https://www.iais.fraunhofer.de/de/forschung/healthcare.html?ref=qr#team', wide:true}],
    build:f=>f.url},
  {id:'text', name:'Freitext', fields:[{k:'t', l:'Text', v:'Hallo QR! Jedes Modul hat eine Aufgabe.', wide:true, area:true}],
    build:f=>f.t},
  {id:'wifi', name:'WLAN', fields:[{k:'s', l:'Netzwerkname (SSID)', v:'Labor-Gast'},{k:'p', l:'Passwort', v:'Pr1mzahl;42'},
      {k:'t', l:'Verschlüsselung', v:'WPA', opts:['WPA','WEP','nopass']},{k:'h', l:'Verstecktes Netz', v:'false', opts:['false','true']}],
    build:f=>`WIFI:T:${f.t};S:${escWifi(f.s)};${f.t==='nopass'?'':'P:'+escWifi(f.p)+';'}${f.h==='true'?'H:true;':''};`},
  {id:'vcard', name:'Kontakt', fields:[{k:'fn', l:'Vorname', v:'Erika'},{k:'ln', l:'Nachname', v:'Mustermann'},
      {k:'org', l:'Organisation', v:'Beispiel-Institut'},{k:'tel', l:'Telefon', v:'+49 228 1234567'},
      {k:'mail', l:'E-Mail', v:'erika@example.org'},{k:'url', l:'Webseite', v:'https://example.org'}],
    build:f=>['BEGIN:VCARD','VERSION:3.0',`N:${f.ln};${f.fn};;;`,`FN:${f.fn} ${f.ln}`, f.org&&`ORG:${f.org}`, f.tel&&`TEL:${f.tel}`, f.mail&&`EMAIL:${f.mail}`, f.url&&`URL:${f.url}`,'END:VCARD'].filter(Boolean).join('\n')},
  {id:'mail', name:'E-Mail', fields:[{k:'to', l:'Empfänger', v:'studie@example.org'},{k:'sub', l:'Betreff', v:'Teilnahme'},{k:'body', l:'Text', v:'Ich möchte teilnehmen.', wide:true}],
    build:f=>{ const q=[]; if (f.sub) q.push('subject='+encodeURIComponent(f.sub)); if (f.body) q.push('body='+encodeURIComponent(f.body)); return 'mailto:'+f.to+(q.length?'?'+q.join('&'):''); }},
  {id:'tel', name:'Telefon', fields:[{k:'n', l:'Nummer', v:'+492281234567'}], build:f=>'tel:'+f.n.replace(/[^\d+]/g,'')},
  {id:'geo', name:'Ort', fields:[{k:'lat', l:'Breitengrad', v:'50.7496'},{k:'lon', l:'Längengrad', v:'7.2031'}], build:f=>`geo:${f.lat},${f.lon}`},
  {id:'num', name:'Zahl', fields:[{k:'n', l:'Ziffernfolge', v:'4006381333931', wide:true}], build:f=>f.n},
];

function analyzePayload(t){
  const rows = [];
  const add = (k, a, b, note)=>{ if (b>a) rows.push({k, a, b, v:t.slice(a,b), note}); };
  let m;
  if ((m = /^([a-z][a-z0-9+.-]*:)(\/\/)?([^\/?#]*)([^?#]*)(\?[^#]*)?(#.*)?$/i.exec(t)) && /^https?:$/i.test(m[1])){
    let p=0;
    add('Schema', p, p+=m[1].length+(m[2]||'').length, 'Protokoll, legt fest, wie der Link geöffnet wird');
    add('Host', p, p+=m[3].length, 'Server, der angefragt wird');
    add('Pfad', p, p+=m[4].length, 'Dokument auf dem Server');
    if (m[5]){
      const q0=p; p+=1; add('Query-Start', q0, p, 'Beginn der Parameter');
      m[5].slice(1).split('&').forEach((kv,i,arr)=>{ add('Parameter', p, p+kv.length, kv.split('=')[0]+' = '+(kv.split('=')[1]??'')); p+=kv.length; if (i<arr.length-1){ p+=1; } });
    }
    if (m[6]) add('Fragment', p, p+m[6].length, 'Sprungmarke innerhalb der Seite, wird nicht an den Server gesendet');
    return {type:'Webadresse (URL)', desc:'Die Kamera-App erkennt „http(s)://“ und bietet an, die Seite zu öffnen. Der QR-Code selbst kennt keine Links, nur Zeichen.', rows};
  }
  if (t.startsWith('WIFI:')){
    add('Präfix', 0, 5, 'Kennung für WLAN-Zugangsdaten');
    const re = /([TSPH]):((?:\\.|[^;])*);/g; let r;
    const nm = {T:'Verschlüsselung', S:'SSID', P:'Passwort', H:'Versteckt'};
    while ((r = re.exec(t))) add(nm[r[1]]||r[1], r.index, r.index+r[0].length, r[2].replace(/\\(.)/g,'$1'));
    return {type:'WLAN-Zugang', desc:'De-facto-Format (ursprünglich von ZXing), das Smartphones direkt als WLAN-Beitritt anbieten. Sonderzeichen ; , : " \\ werden mit \\ maskiert.', rows};
  }
  if (t.startsWith('BEGIN:VCARD')){
    let p=0; t.split('\n').forEach(line=>{ const key=line.split(/[:;]/)[0]; add(key, p, p+line.length, {BEGIN:'Anfang des Datensatzes',VERSION:'vCard-Version',N:'Name, strukturiert',FN:'Anzeigename',ORG:'Organisation',TEL:'Telefonnummer',EMAIL:'E-Mail-Adresse',URL:'Webseite',END:'Ende des Datensatzes'}[key]||''); p+=line.length+1; });
    return {type:'Kontakt (vCard 3.0)', desc:'Zeilenweises Textformat nach RFC 2426. Jede Zeile ist ein Feld; das Telefon legt daraus einen Kontakt an.', rows};
  }
  if (t.startsWith('mailto:')){
    add('Schema', 0, 7, 'öffnet das Mailprogramm');
    const q = t.indexOf('?'); const end = q<0?t.length:q;
    add('Empfänger', 7, end, 'Adresse');
    if (q>=0){ let p=q+1; t.slice(q+1).split('&').forEach(kv=>{ add(kv.split('=')[0], p, p+kv.length, decodeURIComponent((kv.split('=')[1]||'').replace(/\+/g,' '))); p+=kv.length+1; }); }
    return {type:'E-Mail-Entwurf', desc:'mailto-URI nach RFC 6068; Umlaute und Leerzeichen sind prozentkodiert und kosten daher je drei Zeichen.', rows};
  }
  if (t.startsWith('tel:')){ add('Schema',0,4,'öffnet die Telefon-App'); add('Nummer',4,t.length,'im internationalen Format'); return {type:'Telefonnummer', desc:'tel-URI nach RFC 3966.', rows}; }
  if ((m=/^geo:(-?[\d.]+),(-?[\d.]+)$/.exec(t))){
    add('Schema',0,4,'öffnet eine Karten-App'); add('Breite',4,4+m[1].length,'Grad Nord'); add('Länge',5+m[1].length,t.length,'Grad Ost');
    return {type:'Geoposition', desc:'geo-URI nach RFC 5870 (WGS 84).', rows};
  }
  if (/^\d+$/.test(t)){
    add('Ziffern', 0, t.length, `${t.length} Ziffern`);
    return {type:'Ziffernfolge', desc:'Reine Ziffern passen in den numerischen Modus: drei Ziffern brauchen nur 10 Bit statt 24 Bit im Bytemodus.', rows};
  }
  let p=0; t.split('\n').forEach((line,i)=>{ add('Zeile '+(i+1), p, p+line.length, ''); p+=line.length+1; });
  return {type:'Freitext', desc:'Keine Struktur erkannt. Das Lesegerät zeigt den Text einfach an.', rows};
}

   ===================================================================== */
const ROLE = {
  finder:    {c:'#1F3A93', n:'Suchmuster', d:'Die drei großen Quadrate (7×7) in den Ecken. Ihr Hell-Dunkel-Verhältnis 1:1:3:1:1 ist aus jeder Richtung gleich; daran findet der Scanner Lage, Größe und Drehung des Codes.'},
  separator: {c:'#9AA8BA', n:'Trennzone', d:'Ein Modul breiter heller Rand um jedes Suchmuster. Er trennt das Suchmuster sauber von den Daten.'},
  timing:    {c:'#DC9A00', n:'Taktmuster', d:'Abwechselnd dunkle und helle Module in Zeile und Spalte 6. Sie liefern das Raster: daran zählt der Scanner die Modulspalten ab, auch wenn der Druck verzerrt ist.'},
  alignment: {c:'#7B4BD1', n:'Ausrichtungsmuster', d:'Kleine 5×5-Quadrate ab Version 2. Sie korrigieren perspektivische Verzerrung und Wölbung, besonders bei großen Codes.'},
  format:    {c:'#D23A6A', n:'Formatinformation', d:'15 Bit, zweimal gespeichert: Fehlerkorrekturstufe (2 Bit), Maskennummer (3 Bit) und 10 Bit BCH-Prüfcode. Wird als Erstes gelesen.'},
  version:   {c:'#1F9CC6', n:'Versionsinformation', d:'Ab Version 7: 6 Bit Versionsnummer plus 12 Bit Golay-Prüfcode, je ein 6×3-Block oben rechts und unten links.'},
  darkmodule:{c:'#101010', n:'Dunkelmodul', d:'Ein einzelnes Modul, das immer dunkel ist (Position (4V+9, 8)). Es hat keine Datenbedeutung.'},
  data:      {c:'#0E8C7F', n:'Datencodewörter', d:'Die eigentliche Nachricht: Modusindikator, Zeichenzähler, Nutzdaten, Terminator und Füllbytes, in Bytes (Codewörter) zerlegt.'},
  ec:        {c:'#E0691B', n:'Fehlerkorrektur', d:'Reed-Solomon-Codewörter. Aus ihnen lassen sich beschädigte oder verdeckte Codewörter rekonstruieren.'},
  remainder: {c:'#8A8F94', n:'Restbits', d:'Überzählige Module, in die kein ganzes Codewort mehr passt. Sie tragen keine Information (vor dem Maskieren hell).'},
};
const CONTENT = {
  mode:{c:'#1F3A93', n:'Modusindikator'}, count:{c:'#7B4BD1', n:'Zeichenzähler'},
  char:{c:'#0E8C7F', c2:'#1579A6', n:'Nutzdaten'}, term:{c:'#D23A6A', n:'Terminator'},
  padbits:{c:'#A6ADB3', n:'Auffüllbits'}, padbyte:{c:'#8C9A3E', n:'Füllbytes'},
  ec:{c:'#E0691B', n:'Fehlerkorrektur'}, fn:{c:'#C5CACF', n:'Funktionsmuster'},
};
const BLOCK_HUES = ['#0E8C7F','#1F3A93','#C7447A','#D08A00','#6A4CC9','#2C9AC4','#8C9A3E','#B5532D'];
function hexToRgb(h){ const n=parseInt(h.slice(1),16); return [n>>16&255, n>>8&255, n&255]; }
function tint(h, a){ const [r,g,b]=hexToRgb(h); return `rgb(${Math.round(r+(255-r)*a)},${Math.round(g+(255-g)*a)},${Math.round(b+(255-b)*a)})`; }

/* =====================================================================
   Zustand und UI
   ===================================================================== */
const S = {type:'url', vals:{}, ecl:'M', mode:'auto', mask:-1, minVer:1, view:'role', unmask:false, bounds:true, nums:false,
  q:null, hover:null, pin:null, hl:null, hlLabel:null, tab:'bits', pathStep:0, playing:false};
TYPES.forEach(t=>{ S.vals[t.id]={}; t.fields.forEach(f=>S.vals[t.id][f.k]=f.v); });
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hex2 = v => v.toString(16).toUpperCase().padStart(2,'0');

function renderTypes(){
  $('#types').innerHTML = TYPES.map(t=>`<button role="tab" data-id="${t.id}" aria-selected="${t.id===S.type}">${t.name}</button>`).join('');
  const t = TYPES.find(t=>t.id===S.type);
  $('#fields').innerHTML = t.fields.map(f=>{
    const id = `f-${t.id}-${f.k}`, v = esc(S.vals[t.id][f.k]);
    const ctl = f.opts ? `<select id="${id}" data-k="${f.k}">${f.opts.map(o=>`<option ${o===S.vals[t.id][f.k]?'selected':''}>${o}</option>`).join('')}</select>`
      : f.area ? `<textarea id="${id}" data-k="${f.k}" rows="3">${v}</textarea>`
      : `<input id="${id}" data-k="${f.k}" value="${v}" spellcheck="false" autocomplete="off">`;
    return `<div class="field ${f.wide?'wide':''}"><label for="${id}">${f.l}</label>${ctl}</div>`;
  }).join('');
}
$('#types').addEventListener('click', e=>{ const b=e.target.closest('button'); if(!b) return; S.type=b.dataset.id; S.pin=null; renderTypes(); rebuild(); });
$('#fields').addEventListener('input', e=>{ const k=e.target.dataset.k; if(!k) return; S.vals[S.type][k]=e.target.value; rebuild(); });
function segInit(id, key, cb){
  const el = $(id);
  const sync = ()=> el.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.v===S[key]));
  el.addEventListener('click', e=>{ const b=e.target.closest('button'); if(!b) return; S[key]=b.dataset.v; sync(); cb(); });
  sync();
}
segInit('#ecl','ecl', ()=>rebuild());
segInit('#view','view', ()=>{ draw(); renderLegend(); });
$('#mode').onchange = e=>{ S.mode=e.target.value; rebuild(); };
$('#maskSel').onchange = e=>{ S.mask=+e.target.value; rebuild(); };
$('#minVer').innerHTML = Array.from({length:40},(_,i)=>`<option value="${i+1}">${i+1}${i===0?' (kleinste)':''}</option>`).join('');
$('#minVer').onchange = e=>{ S.minVer=+e.target.value; rebuild(); };
$('#unmask').onchange = e=>{ S.unmask=e.target.checked; draw(); };
$('#bounds').onchange = e=>{ S.bounds=e.target.checked; draw(); };
$('#nums').onchange = e=>{ S.nums=e.target.checked; draw(); };

function currentText(){ const t=TYPES.find(t=>t.id===S.type); return t.build(S.vals[S.type]); }

function rebuild(){
  const text = currentText();
  $('#payload').textContent = text.length ? text : '(leer)';
  try{
    S.q = QR.encode(text, {ecl:S.ecl, mode:S.mode, mask:S.mask, minVer:S.minVer});
    $('#err').hidden = true;
  } catch(err){
    $('#err').textContent = err.message; $('#err').hidden = false; return;
  }
  S.hover=null; S.hl=null;
  if (S.pin && !S.q.groups.has(S.pin.grp)) S.pin=null;
  S.pathStep = Math.min(S.pathStep, S.q.path.length);
  sizeCanvas(); draw(); renderLegend(); renderStats(); renderInspector(); renderContext(); renderDeep();
}

/* ---------- Zeichnen ---------- */
const cv = $('#qr'), ctx = cv.getContext('2d');
const QZ = 2; // sichtbare Ruhezone in Modulen
let cell = 10, off = 0;
function sizeCanvas(){
  const box = $('#cbox').getBoundingClientRect();
  const dpr = window.devicePixelRatio||1, px = Math.max(200, Math.floor(box.width));
  cv.width = px*dpr; cv.height = px*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const n = S.q.size + 2*QZ;
  cell = px/n; off = QZ*cell;
}
function moduleColor(x,y,dark){
  const q=S.q, r=q.role[y][x], inf=q.info[y][x];
  if (S.view==='plain') return dark ? '#111' : '#fff';
  let base;
  if (S.view==='role') base = ROLE[r].c;
  else if (S.view==='content'){
    if (r==='data'){ const it=q.items[inf.item]; base = it.kind==='char' ? (it.idx%2?CONTENT.char.c2:CONTENT.char.c) : CONTENT[it.kind].c; }
    else if (r==='ec') base = CONTENT.ec.c;
    else base = dark ? '#6C737A' : null;
    if (!base) return '#F1F3F4';
  } else {
    if (r==='data'||r==='ec'){ const c=q.cws[inf.cw]; base = BLOCK_HUES[c.block%BLOCK_HUES.length]; if (r==='ec') return dark ? tint(base,.42) : tint(base,.9); }
    else return dark ? '#6C737A' : '#F1F3F4';
  }
  return dark ? base : tint(base, .83);
}
function draw(){
  const q=S.q; if (!q) return;
  const n=q.size, W=(n+2*QZ)*cell;
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,W);
  const mat = S.unmask ? q.raw : q.final;
  const hlSet = S.hl ? new Set(S.hl.map(([x,y])=>y*n+x)) : null;
  for (let y=0;y<n;y++) for (let x=0;x<n;x++){
    ctx.fillStyle = moduleColor(x,y,mat[y][x]);
    ctx.fillRect(off+x*cell, off+y*cell, Math.ceil(cell), Math.ceil(cell));
  }
  // Codewort-Grenzen
  if (S.bounds && S.view!=='plain'){
    ctx.strokeStyle='rgba(20,26,28,.55)'; ctx.lineWidth=Math.max(1, cell/9);
    ctx.beginPath();
    const key=(x,y)=> q.info[y][x].grp.replace(/^(finder|sep|align|fmt|ver|timing)-.*$/,'$1');
    for (let y=0;y<n;y++) for (let x=0;x<n;x++){
      const k=key(x,y);
      if (!(q.role[y][x]==='data'||q.role[y][x]==='ec'||q.role[y][x]==='remainder')) continue;
      if (x+1<n && key(x+1,y)!==k){ ctx.moveTo(off+(x+1)*cell, off+y*cell); ctx.lineTo(off+(x+1)*cell, off+(y+1)*cell); }
      if (x>0 && q.isFn(q.role[y][x-1])){ ctx.moveTo(off+x*cell, off+y*cell); ctx.lineTo(off+x*cell, off+(y+1)*cell); }
      if (y+1<n && key(x,y+1)!==k){ ctx.moveTo(off+x*cell, off+(y+1)*cell); ctx.lineTo(off+(x+1)*cell, off+(y+1)*cell); }
      if (y>0 && q.isFn(q.role[y-1][x])){ ctx.moveTo(off+x*cell, off+y*cell); ctx.lineTo(off+(x+1)*cell, off+y*cell); }
    }
    ctx.stroke();
  }
  // Codewort-Nummern
  if (S.nums && cell>=9){
    ctx.font = `600 ${Math.max(7,cell*0.62)}px "IBM Plex Mono", monospace`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    const seen = new Set();
    for (const [x,y,s] of q.path){ if (s<0) continue; const ci=s>>>3; if (seen.has(ci)) continue; seen.add(ci);
      const g=q.groups.get('cw-'+ci); let sx=0,sy=0; g.forEach(([a,b])=>{sx+=a;sy+=b;}); sx/=g.length; sy/=g.length;
      const label = (q.cws[ci].type==='data'?'D':'E')+(ci+1);
      ctx.lineWidth=3; ctx.strokeStyle='rgba(255,255,255,.9)'; ctx.fillStyle='#111';
      ctx.strokeText(label, off+(sx+.5)*cell, off+(sy+.5)*cell); ctx.fillText(label, off+(sx+.5)*cell, off+(sy+.5)*cell);
    }
  }
  // Hervorhebung
  if (hlSet){
    ctx.fillStyle='rgba(255,255,255,.58)';
    for (let y=0;y<n;y++) for (let x=0;x<n;x++) if (!hlSet.has(y*n+x)) ctx.fillRect(off+x*cell, off+y*cell, Math.ceil(cell), Math.ceil(cell));
    ctx.strokeStyle='#111'; ctx.lineWidth=Math.max(1.5, cell/5); ctx.beginPath();
    for (const [x,y] of S.hl){
      const X=off+x*cell, Y=off+y*cell;
      if (!hlSet.has(y*n+x-1)||x===0){ ctx.moveTo(X,Y); ctx.lineTo(X,Y+cell); }
      if (!hlSet.has(y*n+x+1)||x===n-1){ ctx.moveTo(X+cell,Y); ctx.lineTo(X+cell,Y+cell); }
      if (!hlSet.has((y-1)*n+x)){ ctx.moveTo(X,Y); ctx.lineTo(X+cell,Y); }
      if (!hlSet.has((y+1)*n+x)){ ctx.moveTo(X,Y+cell); ctx.lineTo(X+cell,Y+cell); }
    }
    ctx.stroke();
  }
  // Lesepfad
  if (S.tab==='path' && S.pathStep>0){
    ctx.strokeStyle='rgba(224,105,27,.95)'; ctx.lineWidth=Math.max(1.5,cell/6); ctx.lineJoin='round';
    ctx.beginPath();
    for (let i=0;i<S.pathStep;i++){ const [x,y]=q.path[i]; const X=off+(x+.5)*cell, Y=off+(y+.5)*cell; i?ctx.lineTo(X,Y):ctx.moveTo(X,Y); }
    ctx.stroke();
    const [x,y]=q.path[S.pathStep-1];
    ctx.strokeStyle='#111'; ctx.lineWidth=Math.max(2,cell/4);
    ctx.strokeRect(off+x*cell, off+y*cell, cell, cell);
  }
  // Ausgewähltes Modul
  const cur = S.hover || S.pin;
  if (cur){ ctx.strokeStyle='#E0691B'; ctx.lineWidth=Math.max(2,cell/4); ctx.strokeRect(off+cur.x*cell+1, off+cur.y*cell+1, cell-2, cell-2); }
}

/* ---------- Interaktion am Canvas ---------- */
function modAt(ev){
  const r = cv.getBoundingClientRect(), px=(ev.clientX-r.left), py=(ev.clientY-r.top);
  const x=Math.floor((px-off)/cell), y=Math.floor((py-off)/cell);
  if (x<0||y<0||x>=S.q.size||y>=S.q.size) return null;
  return {x,y,grp:S.q.info[y][x].grp};
}
cv.addEventListener('mousemove', ev=>{
  if (!S.q) return; const m=modAt(ev);
  if (m && S.hover && m.x===S.hover.x && m.y===S.hover.y) return;
  S.hover=m; setHL(m ? S.q.groups.get(m.grp) : (S.pin?S.q.groups.get(S.pin.grp):null)); renderInspector();
});
cv.addEventListener('mouseleave', ()=>{ S.hover=null; setHL(S.pin?S.q.groups.get(S.pin.grp):null); renderInspector(); });
cv.addEventListener('click', ev=>{
  const m=modAt(ev);
  S.pin = (m && !(S.pin && S.pin.x===m.x && S.pin.y===m.y)) ? m : null;
  S.hover = null;
  setHL(S.pin?S.q.groups.get(S.pin.grp):null); renderInspector();
});
document.addEventListener('keydown', e=>{ if (e.key==='Escape'){ S.pin=null; S.hover=null; setHL(null); renderInspector(); } });
function setHL(list){ S.hl=list||null; draw(); }
window.addEventListener('resize', ()=>{ if (S.q){ sizeCanvas(); draw(); } });

/* ---------- Legende ---------- */
function renderLegend(){
  const q=S.q; if(!q) return;
  let entries;
  if (S.view==='content'){
    const cnt={}; for (let y=0;y<q.size;y++) for (let x=0;x<q.size;x++){ const r=q.role[y][x]; let k; if (r==='data') k=q.items[q.info[y][x].item].kind; else if (r==='ec') k='ec'; else k='fn'; cnt[k]=(cnt[k]||0)+1; }
    entries = Object.keys(CONTENT).filter(k=>cnt[k]).map(k=>({k, c:CONTENT[k].c, n:CONTENT[k].n, cnt:cnt[k], sel:()=>{
      const out=[]; for (let y=0;y<q.size;y++) for (let x=0;x<q.size;x++){ const r=q.role[y][x]; const kk = r==='data'?q.items[q.info[y][x].item].kind : r==='ec'?'ec':'fn'; if (kk===k) out.push([x,y]); } return out; }}));
  } else if (S.view==='block'){
    entries = Array.from({length:q.nb},(_,b)=>({k:'b'+b, c:BLOCK_HUES[b%BLOCK_HUES.length], n:`Block ${b+1}`, cnt:(q.blocks[b].dlen+q.eccLen)*8, sel:()=>{
      const out=[]; for (let y=0;y<q.size;y++) for (let x=0;x<q.size;x++){ const inf=q.info[y][x]; if (inf.cw!=null && q.cws[inf.cw].block===b) out.push([x,y]); } return out; }}));
    if (entries.length>12){ const more=entries.length-12; entries=entries.slice(0,12); entries.push({k:'more', c:'transparent', n:`+${more} weitere`, cnt:'', sel:()=>null}); }
  } else {
    const cnt={}; for (let y=0;y<q.size;y++) for (let x=0;x<q.size;x++){ const r=q.role[y][x]; cnt[r]=(cnt[r]||0)+1; }
    entries = Object.keys(ROLE).filter(k=>cnt[k]).map(k=>({k, c:ROLE[k].c, n:ROLE[k].n, cnt:cnt[k], sel:()=>{
      const out=[]; for (let y=0;y<q.size;y++) for (let x=0;x<q.size;x++) if (q.role[y][x]===k) out.push([x,y]); return out; }}));
  }
  const el=$('#legend');
  el.innerHTML = entries.map((e,i)=>`<button data-i="${i}"><span class="sw" style="background:${e.c}"></span>${e.n}<span class="n">${e.cnt}</span></button>`).join('');
  el.querySelectorAll('button').forEach(b=>{
    const e=entries[+b.dataset.i];
    b.onmouseenter=()=>{ setHL(e.sel()); if (S.view==='role'&&ROLE[e.k]) showRoleInfo(e.k); };
    b.onmouseleave=()=>{ setHL(S.pin?q.groups.get(S.pin.grp):null); renderInspector(); };
    b.onfocus=b.onmouseenter; b.onblur=b.onmouseleave;
  });
}

/* ---------- Kennzahlen ---------- */
function renderStats(){
  const q=S.q;
  const dataCw=q.dataCw.length, ecCw=q.cws.length-dataCw;
  const used = q.charCount ? (4+q.ccBits+q.payloadBits) : 0;
  const corr = q.blocks.map(b=>Math.floor(q.eccLen/2)/(b.dlen+q.eccLen));
  const minCorr = Math.min(...corr);
  $('#stats').innerHTML = [
    [`V${q.ver}`, `Version · ${q.size}×${q.size} Module`],
    [QR.MODES[q.mode].name, `Modus · ${q.charCount} ${q.mode==='byte'?'Bytes':'Zeichen'}`],
    [`${Math.round(used/q.cap*100)} %`, `Kapazität belegt (${used}/${q.cap} Bit)`],
    [`${dataCw} + ${ecCw}`, `Daten- + Korrektur-Codewörter`],
    [`${q.nb}`, q.nb===1?'Reed-Solomon-Block':'Reed-Solomon-Blöcke'],
    [`${(minCorr*100).toFixed(0)} %`, `Stufe ${q.ecl}: reparierbare Codewörter`],
  ].map(([b,s])=>`<div class="stat"><b>${b}</b><span>${s}</span></div>`).join('');
}

/* ---------- Inspektor ---------- */
function bitsHtml(str, cur){ return `<span class="bits">${[...str].map((c,i)=>`<i class="${i===cur?'cur':''}">${c}</i>`).join('')}</span>`; }
function showRoleInfo(k){
  const r=ROLE[k];
  $('#inspector').innerHTML = `<div class="insp-head"><span class="sw" style="background:${r.c}"></span><h3>${r.n}</h3></div><p>${r.d}</p>`;
}
function renderInspector(){
  const q=S.q, el=$('#inspector'), m=S.hover||S.pin;
  if (!m){
    el.innerHTML = `<div class="insp-head"><h3>Modul-Inspektor</h3></div>
      <p>Fahre mit der Maus über den Code. Jedes Quadrat (Modul) ist ein Bit; hier steht, zu welchem Bereich es gehört und was es bedeutet. Ein Klick fixiert die Auswahl, <span class="mono">Esc</span> hebt sie auf.</p>
      <p class="hint">Tipp: Die Ansicht „Inhalt“ färbt nach Bedeutung der Bits, „Blöcke“ zeigt die Reed-Solomon-Blöcke. Auf dem Handy: Modul antippen.</p>`;
    return;
  }
  const {x,y}=m, r=q.role[y][x], inf=q.info[y][x], R=ROLE[r];
  const dark=q.final[y][x], rawv=q.raw[y][x];
  const isData = r==='data'||r==='ec'||r==='remainder';
  const mk = isData && QR.MASK_FN[q.mask](x,y);
  let h = `<div class="insp-head"><span class="sw" style="background:${R.c}"></span><h3>${R.n}</h3><span class="pos">Zeile ${y} · Spalte ${x}</span></div>`;
  const kv = [];
  kv.push(['Farbe im Code', dark?'dunkel (1)':'hell (0)']);
  if (r==='finder'){ h+=`<p>${R.d}</p>`; kv.push(['Muster', `Suchmuster ${inf.name}`], ['Ring', ['Kern (3×3)','Kern (3×3)','heller Ring','dunkler Rahmen'][inf.ring]]); }
  else if (r==='alignment'){ h+=`<p>${R.d}</p>`; kv.push(['Mittelpunkt', `(${inf.cy}, ${inf.cx})`], ['Zentren in V'+q.ver, q.alignPos.join(', ')]); }
  else if (r==='timing'){ h+=`<p>${R.d}</p>`; kv.push(['Richtung', inf.grp==='timing-h'?'waagerecht (Zeile 6)':'senkrecht (Spalte 6)'], ['Regel', 'dunkel, wenn Index gerade']); }
  else if (r==='format'){
    const b=inf.bit, fb=q.fmt;
    const what = b>=10 ? (b>=13?`Fehlerkorrekturstufe (${q.ecl})`:`Maskennummer (${q.mask})`) : 'BCH-Prüfbit';
    h+=`<p>${R.d}</p>`;
    kv.push(['Bit', `${b} von 14 · Kopie ${inf.copy}`], ['Bedeutung', what], ['vor XOR-Maske', ((fb.raw>>>b)&1)+' ⊕ '+((0x5412>>>b)&1)+' = '+((fb.bits>>>b)&1)]);
  }
  else if (r==='version'){ h+=`<p>${R.d}</p>`; kv.push(['Bit', `${inf.bit} von 17 · Kopie ${inf.copy}`], ['Bedeutung', inf.bit>=12?`Versionsnummer ${q.ver} (${q.ver.toString(2).padStart(6,'0')})`:'Golay-Prüfbit']); }
  else if (r==='data'){
    const c=q.cws[inf.cw], it=q.items[inf.item], off=inf.gbit-it.start;
    h+=`<p>${esc(it.note)}.</p>`;
    kv.push(['Codewort', `D${c.di+1} = 0x${hex2(c.v)} · ${bitsHtml(c.v.toString(2).padStart(8,'0'), inf.bit)}`]);
    kv.push(['Block', `${c.block+1} von ${q.nb}, Position ${c.j+1}`]);
    kv.push(['Feld', `${CONTENT[it.kind].n}: ${bitsHtml(it.bits, off)}`]);
    kv.push(['Reihenfolge', `Bit ${inf.stream+1} im verschränkten Datenstrom`]);
  }
  else if (r==='ec'){
    const c=q.cws[inf.cw];
    h+=`<p>${R.d} Dieses Codewort sichert Block ${c.block+1} ab.</p>`;
    kv.push(['Codewort', `E${c.j+1} von Block ${c.block+1} = 0x${hex2(c.v)} · ${bitsHtml(c.v.toString(2).padStart(8,'0'), inf.bit)}`]);
    kv.push(['Reihenfolge', `Bit ${inf.stream+1} im verschränkten Datenstrom`]);
  }
  else h+=`<p>${R.d}</p>`;
  if (isData) kv.push(['Maske '+q.mask, `${QR.MASK_TXT[q.mask]} → ${mk?'invertiert':'unverändert'}: ${rawv?1:0} → ${dark?1:0}`]);
  h += `<dl class="kv">${kv.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>`;
  el.innerHTML = h;
}

/* ---------- Kontext ---------- */
function charRangeModules(a,b){
  const q=S.q, out=[];
  q.items.forEach(it=>{ if (it.kind==='char' && it.ci<b && it.ci+it.cn>a) for (let k=0;k<it.bits.length;k++) out.push(q.dataBitPos(it.start+k)); });
  return out;
}
function itemModules(it){ const q=S.q, out=[]; for (let k=0;k<it.bits.length;k++) out.push(q.dataBitPos(it.start+k)); return out; }
function renderContext(){
  const q=S.q, a=analyzePayload(q.text);
  const bytes = q.mode==='byte' ? q.charCount : null;
  $('#context').innerHTML = `<div class="label">Was steckt drin</div><h3>${a.type}</h3><p class="hint" style="margin:4px 0 0">${a.desc}${bytes!=null && bytes!==q.text.length ? ` Umlaute und Sonderzeichen belegen in UTF-8 mehrere Bytes: ${q.text.length} Zeichen → ${bytes} Bytes.`:''}</p>
    <div class="ctx-list">${a.rows.map((r,i)=>`<div class="ctx-row" data-i="${i}" tabindex="0"><span class="k">${esc(r.k)}</span><span class="v">${esc(r.v)}${r.note?`<br><small>${esc(r.note)}</small>`:''}</span></div>`).join('')}</div>`;
  $('#context').querySelectorAll('.ctx-row').forEach(el=>{
    const r=a.rows[+el.dataset.i];
    el.onmouseenter = el.onfocus = ()=>{ setHL(charRangeModules(r.a,r.b)); };
    el.onmouseleave = el.onblur = ()=>{ setHL(S.pin?q.groups.get(S.pin.grp):null); };
  });
}

/* ---------- Vertiefung ---------- */
$('#deepTabs').addEventListener('click', e=>{ const b=e.target.closest('button'); if(!b) return; S.tab=b.dataset.t; stopPlay(); renderDeep(); draw(); });
function hoverBind(root, sel, getMods){
  root.querySelectorAll(sel).forEach(el=>{
    el.onmouseenter = ()=>setHL(getMods(el));
    el.onmouseleave = ()=>setHL(S.pin?S.q.groups.get(S.pin.grp):null);
  });
}
function renderDeep(){
  const q=S.q; if(!q) return;
  $('#deepTabs').querySelectorAll('button').forEach(b=>b.setAttribute('aria-selected', b.dataset.t===S.tab));
  const body=$('#deepBody');
  if (S.tab==='bits'){
    const total = q.items.reduce((s,i)=>s+i.bits.length,0);
    body.innerHTML = `<section><p class="lead">Bevor irgendetwas gezeichnet wird, entsteht ein Bitstrom: 4 Bit Modus, dann die Länge, dann die Nutzdaten, ein Terminator und Füllbytes, bis die Kapazität von ${q.cap} Bit (${q.dataCw.length} Codewörter) für Version ${q.ver}-${q.ecl} erreicht ist. Fahre über ein Feld, um seine Module im Code zu sehen.</p>
      <div class="chips">${q.items.map((it,i)=>{
        const c = it.kind==='char' ? (it.idx%2?CONTENT.char.c2:CONTENT.char.c) : CONTENT[it.kind].c;
        const head = it.kind==='char' ? `<span class="c">${esc(it.text)}</span>` : `<span class="t"><span class="sw" style="background:${c}"></span>${it.text}</span>`;
        return `<div class="chip" data-i="${i}" title="${esc(it.note)}">${head}<span class="b" style="color:${c}">${it.bits}</span></div>`;
      }).join('')}</div>
      <p class="hint" style="margin-top:10px">${total} Bit gesamt. Nutzdaten ${q.payloadBits} Bit, Verwaltung ${4+q.ccBits} Bit, Rest Auffüllung.</p></section>`;
    hoverBind(body, '.chip', el=>itemModules(q.items[+el.dataset.i]));
  }
  else if (S.tab==='cw'){
    body.innerHTML = `<section><p class="lead">Die ${q.dataCw.length} Datencodewörter werden auf ${q.nb} ${q.nb===1?'Block':'Blöcke'} verteilt. Jeder Block erhält ${q.eccLen} Reed-Solomon-Codewörter (Rest der Polynomdivision über GF(256)). Ein Block verkraftet bis zu ${Math.floor(q.eccLen/2)} fehlerhafte Codewörter. Im Symbol werden die Blöcke dann verschränkt (erst D1 aller Blöcke, dann D2, …), damit ein lokaler Schaden sich auf viele Blöcke verteilt. Die kleine Zahl ist die Position im Symbol.</p>
      <div class="blocks">${q.blocks.map((b,bi)=>`<div class="block-row"><span class="bn">Block ${bi+1}</span><div class="cws">
        ${b.data.map((c,j)=>`<span class="cw" data-ii="${c.ii}" style="background:${tint(BLOCK_HUES[bi%8],.78)}" title="D${c.di+1}, Block ${bi+1}">${hex2(c.v)}<small>${c.ii+1}</small></span>`).join('')}
        ${b.ecc.map((c,j)=>`<span class="cw" data-ii="${c.ii}" style="background:${tint('#E0691B',.8)}" title="E${j+1}, Block ${bi+1}">${hex2(c.v)}<small>${c.ii+1}</small></span>`).join('')}
      </div></div>`).join('')}</div>
      <p class="hint" style="margin-top:10px">Farbig nach Block: Datencodewörter. Orange: Fehlerkorrektur-Codewörter des jeweiligen Blocks.</p></section>`;
    hoverBind(body, '.cw', el=>q.groups.get('cw-'+el.dataset.ii));
  }
  else if (S.tab==='format'){
    const f=q.fmt, bits=n=>Array.from({length:15},(_,i)=>(n>>>(14-i))&1);
    const row=(label, arr, cls)=>`<div class="bitrow"><span class="rl">${label}</span>${arr.map((v,i)=>`${i===2||i===5?'<span class="grp-sep"></span>':''}<span class="bitcell" data-b="${14-i}" style="${cls?cls(i):''}">${v}<small>${14-i}</small></span>`).join('')}</div>`;
    const col = i => i<2?`background:${tint('#D23A6A',.75)}`: i<5?`background:${tint('#7B4BD1',.75)}`:'';
    let h = `<section><p class="lead">Die Formatinformation verrät dem Scanner, wie der Rest zu lesen ist. 5 Datenbits (Stufe ${q.ecl} = ${(QR.ECL[q.ecl].fb).toString(2).padStart(2,'0')}, Maske ${q.mask} = ${q.mask.toString(2).padStart(3,'0')}) werden mit einem BCH(15,5)-Code geschützt (Generator 10100110111) und mit 101010000010010 per XOR verknüpft, damit nie lauter Nullen entstehen. Sie steht zweimal im Code; Bits ab Bit 7 überspringen das Taktmuster.</p>
      ${row('Daten + BCH', bits(f.raw), col)}
      ${row('XOR-Maske', bits(0x5412))}
      ${row('gespeichert', bits(f.bits), col)}
      <p class="hint">Rot: Fehlerkorrekturstufe (L=01, M=00, Q=11, H=10). Violett: Maskennummer. Rest: BCH-Prüfbits. Fahre über ein Bit, um beide Kopien zu sehen.</p>`;
    if (q.vb){
      const vb = Array.from({length:18},(_,i)=>(q.vb.bits>>>(17-i))&1);
      h += `<h3 style="font-size:15px;margin:18px 0 4px">Versionsinformation</h3><p class="lead">Ab Version 7 steht die Versionsnummer ${q.ver} (6 Bit) mit 12 Golay-Prüfbits in zwei 6×3-Feldern.</p>
        <div class="bitrow"><span class="rl">Version + Golay</span>${vb.map((v,i)=>`${i===6?'<span class="grp-sep"></span>':''}<span class="bitcell vb" data-b="${17-i}" style="${i<6?`background:${tint('#1F9CC6',.72)}`:''}">${v}<small>${17-i}</small></span>`).join('')}</div>`;
    } else h += `<p class="hint" style="margin-top:14px">Versionsinformation gibt es erst ab Version 7; kleinere Versionen erkennt der Scanner an der Größe (${q.size} = 4·${q.ver}+17 Module).</p>`;
    body.innerHTML = h + '</section>';
    hoverBind(body, '.bitcell:not(.vb)', el=>q.groups.get('fmt-'+el.dataset.b));
    hoverBind(body, '.bitcell.vb', el=>q.groups.get('ver-'+el.dataset.b));
  }
  else if (S.tab==='mask'){
    const best = q.masks.reduce((b,m,i)=>m.pen.total<q.masks[b].pen.total?i:b,0);
    body.innerHTML = `<section><p class="lead">Nach dem Platzieren werden alle Daten- und Korrekturmodule mit einem von 8 Mustern per XOR verknüpft (Funktionsmuster bleiben unberührt). Ziel: keine großen einfarbigen Flächen und keine Muster, die wie ein Suchmuster aussehen. Jede Maske bekommt Strafpunkte nach vier Regeln (N1 Läufe, N2 2×2-Blöcke, N3 Suchmuster-Imitate, N4 Dunkelanteil); die mit den wenigsten gewinnt. Klick wählt eine Maske fest.</p>
      <div class="masks">${q.masks.map((m,i)=>`<button class="mask-card ${i===q.mask?'sel':''}" data-m="${i}">
        <span class="mh"><span>Maske ${i}${i===best?' ★':''}</span><span class="mono">${m.pen.total}</span></span>
        <canvas width="${q.size}" height="${q.size}" data-m="${i}"></canvas>
        <span class="mf">${QR.MASK_TXT[i]}</span>
        <span class="pen">N1 ${m.pen.p1} · N2 ${m.pen.p2} · N3 ${m.pen.p3} · N4 ${m.pen.p4}</span></button>`).join('')}</div>
      <p class="hint" style="margin-top:10px">★ = geringste Strafpunkte. i = Zeile, j = Spalte. Aktiv: Maske ${q.mask}${S.mask<0?' (automatisch)':' (manuell)'}. Mit „Maske entfernen“ oben siehst du die Daten vor dem XOR.</p></section>`;
    body.querySelectorAll('canvas').forEach(c=>{
      const k=+c.dataset.m, x=c.getContext('2d'), m=q.masks[k].m, img=x.createImageData(q.size,q.size);
      for (let yy=0;yy<q.size;yy++) for (let xx=0;xx<q.size;xx++){
        const isD = !q.isFn(q.role[yy][xx]), pat = isD && QR.MASK_FN[k](xx,yy);
        const o=(yy*q.size+xx)*4; const d=m[yy][xx];
        const col = d ? (pat?[14,110,100]:[20,20,20]) : (pat?[205,236,231]:[255,255,255]);
        img.data.set([...col,255], o);
      }
      x.putImageData(img,0,0);
    });
    body.querySelectorAll('.mask-card').forEach(b=>b.onclick=()=>{ S.mask=+b.dataset.m; $('#maskSel').value=S.mask; rebuild(); });
  }
  else if (S.tab==='path'){
    body.innerHTML = `<section><p class="lead">Die Bits werden in Zweierspalten von rechts unten beginnend im Zickzack eingetragen: hoch, dann runter, dann wieder hoch. Funktionsmuster werden übersprungen, Spalte 6 (Taktmuster) ganz ausgelassen. Das erste Codewort liegt also immer unten rechts.</p>
      <div class="pathctl"><button class="btn primary" id="play">Abspielen</button><button class="btn" id="stepB">−8</button><button class="btn" id="stepF">+8</button>
      <input type="range" id="pathR" min="0" max="${q.path.length}" value="${S.pathStep}" aria-label="Position auf dem Lesepfad"><span class="mono" id="pathN"></span></div>
      <div id="pathInfo" class="hint"></div></section>`;
    const upd=()=>{ $('#pathR').value=S.pathStep; $('#pathN').textContent=`${S.pathStep} / ${q.path.length}`;
      if (S.pathStep>0){ const [x,y,s]=q.path[S.pathStep-1];
        if (s<0) $('#pathInfo').textContent=`Restbit an Zeile ${y}, Spalte ${x}: kein Codewort mehr übrig.`;
        else { const c=q.cws[s>>>3]; $('#pathInfo').innerHTML=`Bit ${s+1}: ${c.type==='data'?'Datencodewort D'+(c.di+1):'Korrekturcodewort E'+(c.j+1)} von Block ${c.block+1}, Bit ${(s&7)+1} von 8 → <b>${(c.v>>>(7-(s&7)))&1}</b> (Zeile ${y}, Spalte ${x})`; }
      } else $('#pathInfo').textContent='Schieberegler bewegen oder abspielen.';
      draw(); };
    $('#pathR').oninput=e=>{ stopPlay(); S.pathStep=+e.target.value; upd(); };
    $('#stepB').onclick=()=>{ stopPlay(); S.pathStep=Math.max(0,S.pathStep-8); upd(); };
    $('#stepF').onclick=()=>{ stopPlay(); S.pathStep=Math.min(q.path.length,S.pathStep+8); upd(); };
    $('#play').onclick=()=>{ if (S.playing){ stopPlay(); return; } if (S.pathStep>=q.path.length) S.pathStep=0; S.playing=true; $('#play').textContent='Pause';
      const speed=Math.max(2, Math.round(q.path.length/400));
      const tick=()=>{ if(!S.playing) return; S.pathStep=Math.min(q.path.length,S.pathStep+speed); upd(); if (S.pathStep>=q.path.length) stopPlay(); else S.raf=requestAnimationFrame(tick); };
      tick(); };
    upd();
  }
  else {
    body.innerHTML = `<section><div class="explain">
      <div><h4>Module und Versionen</h4><p>Ein QR-Code ist ein Raster aus N×N Modulen mit N = 4·V+17. Version 1 hat 21×21 Module, Version 40 hat 177×177. Die Version wird so klein wie möglich gewählt, sodass die Daten noch hineinpassen.</p></div>
      <div><h4>Funktionsmuster</h4><p>Such-, Takt- und Ausrichtungsmuster sind in jedem Code gleich. Sie tragen keine Daten, sondern helfen dem Scanner, Lage und Raster zu bestimmen. Dazu kommt eine Ruhezone von 4 hellen Modulen rundherum.</p></div>
      <div><h4>Kodiermodi</h4><p>Numerisch: 3 Ziffern in 10 Bit. Alphanumerisch: 2 Zeichen aus 45 in 11 Bit. Byte: 8 Bit je Byte, heute meist UTF-8. Großgeschriebene URLs passen deshalb in kleinere Codes.</p></div>
      <div><h4>Reed-Solomon</h4><p>Die Nachricht wird als Polynom über dem Körper GF(2⁸) aufgefasst und durch ein Generatorpolynom geteilt; der Rest sind die Korrektur-Codewörter. Mit e Korrekturwörtern lassen sich ⌊e/2⌋ unbekannte Fehler oder e bekannte Ausfälle beheben.</p></div>
      <div><h4>Verschränkung</h4><p>Große Codes teilen die Daten in mehrere Blöcke und legen deren Codewörter abwechselnd ab. Ein Kaffeefleck trifft dann viele Blöcke ein bisschen statt einen Block ganz.</p></div>
      <div><h4>Maskierung</h4><p>Eine von 8 XOR-Masken bricht Flächen und Pseudo-Suchmuster auf. Welche benutzt wurde, steht in der Formatinformation, damit der Scanner sie wieder entfernen kann.</p></div>
      <div><h4>Fehlerkorrekturstufen</h4><p>L, M, Q, H erlauben die Rekonstruktion von etwa 7, 15, 25 bzw. 30 % der Codewörter. Höhere Stufen kosten Platz, deshalb wächst der Code mit der Stufe.</p></div>
      <div><h4>Lesen</h4><p>Scanner: Suchmuster finden → Raster über Taktmuster → Format lesen → Maske entfernen → Zickzack auslesen → Blöcke entschränken → Reed-Solomon korrigieren → Bitstrom dekodieren.</p></div>
    </div></section>`;
  }
}
function stopPlay(){ S.playing=false; if (S.raf) cancelAnimationFrame(S.raf); const b=$('#play'); if (b) b.textContent='Abspielen'; }

/* ---------- Start ---------- */
renderTypes();
$('#minVer').value = '1';
rebuild();
</script>
</body>
</html>
