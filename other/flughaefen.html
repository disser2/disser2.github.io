<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Flughäfen">
<meta name="theme-color" content="#F2F2F7">
<title>Flughäfen</title>
<style>
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --fill:#E9E9EF; --fill2:#E5E5EA; --text:#000; --text2:#8A8A8E; --text3:#C7C7CC;
  --blue:#007AFF; --green:#34C759; --red:#FF3B30; --sep:#D8D8DC; --sheet:#FFFFFF; --group:#F2F2F7; --shadow:0 8px 30px rgba(0,0,0,.12);
  --eu-bg:#E1EDFF; --eu-fg:#0A5AD6; --as-bg:#FFE3E0; --as-fg:#C8321F; --na-bg:#FFEBD9; --na-fg:#B85A00;
  --sa-bg:#DDF5E4; --sa-fg:#1E8A3E; --af-bg:#FFF4CC; --af-fg:#8F6A00; --oc-bg:#EEE3FF; --oc-fg:#6A35C9;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000; --card:#1C1C1E; --fill:#2C2C2E; --fill2:#3A3A3C; --text:#fff; --text2:#8E8E93; --text3:#48484A;
    --blue:#0A84FF; --green:#30D158; --red:#FF453A; --sep:#38383A; --sheet:#1C1C1E; --group:#2C2C2E; --shadow:0 8px 30px rgba(0,0,0,.6);
    --eu-bg:#0F2A4F; --eu-fg:#6FA8FF; --as-bg:#4A1914; --as-fg:#FF8A7A; --na-bg:#4A2A0B; --na-fg:#FFB066;
    --sa-bg:#10361D; --sa-fg:#5FD984; --af-bg:#3F3308; --af-fg:#F2CD4A; --oc-bg:#2F1C52; --oc-fg:#B794FF;
  }
}
:root[data-theme="dark"]{
  --bg:#000; --card:#1C1C1E; --fill:#2C2C2E; --fill2:#3A3A3C; --text:#fff; --text2:#8E8E93; --text3:#48484A;
  --blue:#0A84FF; --green:#30D158; --red:#FF453A; --sep:#38383A; --sheet:#1C1C1E; --group:#2C2C2E; --shadow:0 8px 30px rgba(0,0,0,.6);
  --eu-bg:#0F2A4F; --eu-fg:#6FA8FF; --as-bg:#4A1914; --as-fg:#FF8A7A; --na-bg:#4A2A0B; --na-fg:#FFB066;
  --sa-bg:#10361D; --sa-fg:#5FD984; --af-bg:#3F3308; --af-fg:#F2CD4A; --oc-bg:#2F1C52; --oc-fg:#B794FF;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;font-size:15px;line-height:1.3;overflow-x:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);padding:10px 16px 0}
.titlebar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0 12px}
h1{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:0;line-height:1.1}
.tb-right{display:flex;gap:8px;align-items:center}
.pill{background:var(--blue);color:#fff;border-radius:999px;padding:6px 13px;font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.pill svg{width:13px;height:13px}
.addbtn{width:34px;height:34px;border-radius:50%;background:var(--fill);color:var(--blue);display:grid;place-items:center;font-size:21px;font-weight:500;line-height:1}
.search{display:flex;align-items:center;gap:8px;background:var(--fill);border-radius:12px;padding:0 10px;height:38px}
.search svg{width:18px;height:18px;color:var(--text2);flex:none}
.search input{flex:1;border:0;background:transparent;font:inherit;color:var(--text);outline:none;min-width:0;height:100%}
.search input::placeholder{color:var(--text2)}
.clear{color:var(--text2);font-size:18px;width:24px;height:24px;border-radius:50%;display:none;place-items:center}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 12px;margin:0 -16px;scrollbar-width:none;align-items:center}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--fill);border-radius:999px;padding:6px 13px;font-weight:600;font-size:14px;white-space:nowrap}
.chip.on{background:var(--blue);color:#fff}
.vsep{flex:none;width:1px;height:24px;background:var(--sep)}
.divider{height:1px;background:var(--sep);margin:0 -16px}

main{padding:10px 16px 120px}
.count{color:var(--text2);font-size:13px;margin:6px 4px 10px}
.list{display:flex;flex-direction:column;gap:8px}
.card{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:16px;padding:10px 12px;border:2px solid transparent;width:100%;text-align:left}
.card.seen{border-color:var(--green)}
.check{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--text3);display:grid;place-items:center}
.card.seen .check{background:var(--green);border-color:var(--green)}
.check svg{width:15px;height:15px;color:#fff;opacity:0}
.card.seen .check svg{opacity:1}
.body{flex:1;min-width:0}
.city{font-size:17px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin-top:4px}
.tag{border-radius:6px;padding:1px 6px;font-weight:700;font-size:12.5px}
.tag.code{letter-spacing:.04em}
.tag.cc{background:var(--fill);color:var(--text)}
.tag.own{border:1.5px dashed var(--text3);color:var(--text2);background:none;font-weight:600}
.c-EU{background:var(--eu-bg);color:var(--eu-fg)} .c-AS{background:var(--as-bg);color:var(--as-fg)} .c-NA{background:var(--na-bg);color:var(--na-fg)}
.c-SA{background:var(--sa-bg);color:var(--sa-fg)} .c-AF{background:var(--af-bg);color:var(--af-fg)} .c-OC{background:var(--oc-bg);color:var(--oc-fg)}
.aname{color:var(--text2);font-size:12.5px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.date{color:var(--green);font-weight:700;font-size:13.5px;margin-top:3px;font-variant-numeric:tabular-nums}
.flag{flex:none;width:44px;height:44px;display:grid;place-items:center;font-size:34px;line-height:1}
.empty{text-align:center;color:var(--text2);padding:50px 20px}
.empty b{display:block;color:var(--text);font-size:16px;margin-bottom:6px}

.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;gap:4px;padding:6px;border-radius:999px;background:color-mix(in srgb,var(--card) 82%,transparent);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);box-shadow:var(--shadow);border:0.5px solid var(--sep)}
.tab{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 14px;border-radius:999px;color:var(--text2);font-size:11px;font-weight:600;min-width:70px}
.tab svg{width:20px;height:20px}
.tab.on{color:var(--blue);background:var(--fill)}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--sheet);border-radius:22px 22px 0 0;max-height:calc(100% - 60px - env(safe-area-inset-top,0px));display:flex;flex-direction:column;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom,0px);max-width:640px;margin:0 auto}
.sheet.on{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--text3);margin:8px auto 4px}
.sh-head{display:flex;align-items:center;justify-content:space-between;padding:8px 20px 8px}
.sh-head h2{margin:0;font-size:21px;font-weight:800;letter-spacing:-.01em}
.xbtn{width:30px;height:30px;border-radius:50%;background:var(--fill);color:var(--text2);display:grid;place-items:center}
.xbtn svg{width:14px;height:14px}
.sh-body{overflow-y:auto;padding:4px 20px 28px;-webkit-overflow-scrolling:touch}
@media (prefers-reduced-motion: reduce){.sheet,.scrim{transition:none}}

.ring{position:relative;width:180px;height:180px;margin:14px auto 22px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .frac{color:var(--text2);font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.ring .pct{font-size:34px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.ring .lbl{color:var(--text2);font-size:11px;font-weight:600;letter-spacing:.14em}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:24px}
.quick div{background:var(--group);border-radius:14px;padding:12px;text-align:center}
.quick b{display:block;font-size:19px;font-weight:800;font-variant-numeric:tabular-nums}
.quick span{color:var(--text2);font-size:12px}
.sec{color:var(--text2);font-size:13px;font-weight:600;margin:0 4px 8px}
.group{background:var(--group);border-radius:16px;padding:6px 16px;margin-bottom:24px}
.row{display:grid;grid-template-columns:104px 1fr 56px;align-items:center;gap:10px;padding:8px 0;font-size:14px}
.row .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:12px;border-radius:6px;background:var(--fill2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);border-radius:8px;min-width:0}
.row .v{color:var(--text2);text-align:right;font-variant-numeric:tabular-nums}
.months{display:flex;align-items:flex-end;gap:6px;height:150px;padding:22px 0 0}
.mcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.mcol b{font-size:12px;font-variant-numeric:tabular-nums}
.mcol i{width:100%;max-width:22px;background:var(--blue);border-radius:5px 5px 2px 2px;min-height:3px}
.mcol i.z{background:var(--fill2)}
.mcol span{font-size:11px;color:var(--text2)}
.countries{display:flex;flex-wrap:wrap;gap:6px;padding:8px 0}
.countries span{background:var(--card);border-radius:8px;padding:4px 8px;font-size:15px}

.hero-ap{text-align:center;padding:4px 0 18px}
.hero-ap .f{font-size:46px;line-height:1.1}
.hero-ap .c{font-size:20px;font-weight:800;margin-top:4px}
.hero-ap .s{color:var(--text2);margin-top:2px;font-size:13.5px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:12.5px;color:var(--text2);font-weight:600;margin-left:4px}
.field input,.field select{font:inherit;color:var(--text);background:var(--group);border:0;border-radius:11px;padding:0 12px;height:42px;width:100%;appearance:none;-webkit-appearance:none}
.field input[type=date]{display:flex;align-items:center}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:block;width:100%;height:46px;border-radius:13px;font-weight:700;font-size:15px;margin-top:10px}
.btn.primary{background:var(--blue);color:#fff}
.btn.danger{background:var(--group);color:var(--red)}
.btn.plain{background:var(--group);color:var(--blue)}
.err{color:var(--red);font-size:14px;min-height:18px;margin:0 4px}
.foot{color:var(--text2);font-size:13px;text-align:center;margin-top:18px}
.toast{font-size:14px!important;position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translate(-50%,-150%);z-index:60;background:var(--card);box-shadow:var(--shadow);border-radius:999px;padding:10px 18px;font-weight:600;font-size:15px;transition:transform .3s}
.toast.on{transform:translate(-50%,0)}
.coords{font-size:11.5px;color:var(--text2);margin-top:3px;font-variant-numeric:tabular-nums}
.facts{background:var(--group);border-radius:16px;padding:4px 16px;margin-bottom:18px}
.fact{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--sep);font-size:14px}
.fact:last-child{border-bottom:0}
.fact span:first-child{color:var(--text2)}
.fact span:last-child{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.plan{background:var(--group);border-radius:16px;overflow:hidden;margin-bottom:10px;position:relative}
.plan svg{display:block;width:100%;height:auto}
.plan .attr{position:absolute;right:6px;bottom:4px;font-size:10px;color:#fff;text-shadow:0 0 3px #000}
.seg{display:flex;background:var(--fill);border-radius:10px;padding:2px;margin-bottom:10px}
.seg button{flex:1;padding:6px 0;border-radius:8px;font-size:13px;font-weight:600;color:var(--text2)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tiles{position:relative;width:100%;height:260px;overflow:hidden;background:var(--fill2)}
.tiles img{position:absolute;width:256px;height:256px;max-width:none;user-select:none}
.tiles .pin{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--red);border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.5)}
.tiles .off{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:20px;color:var(--text2);font-size:14px}
.zoom{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:34px;height:34px;border-radius:10px;background:color-mix(in srgb,var(--card) 90%,transparent);font-size:20px;font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.links{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:22px}
.links a{display:block;text-align:center;background:var(--group);color:var(--blue);text-decoration:none;font-weight:600;border-radius:12px;padding:9px 0;font-size:14px}
.hint{color:var(--text2);font-size:13px;margin:0 4px 16px}
.menu-btn{width:34px;height:34px;border-radius:50%;background:var(--fill);color:var(--blue);display:grid;place-items:center}
.menu-btn svg{width:18px;height:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.tile{position:relative;background:var(--card);border-radius:14px;border:2px solid transparent;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 6px 4px}
.tile.seen{border-color:var(--green)}
.tile svg{width:100%;flex:1;min-height:0}
.tile b{font-size:13px;font-weight:800;letter-spacing:.06em;margin-top:2px}
.tile.seen b{color:var(--green)}
.tile .nopl{flex:1;display:grid;place-items:center;color:var(--text3);font-size:11px}
.viewbtn{width:34px;height:34px;border-radius:50%;background:var(--fill);color:var(--blue);display:grid;place-items:center}
.viewbtn svg{width:18px;height:18px}
.countrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0 10px}
.countrow .count{margin:0 4px}
.vseg{display:flex;background:var(--fill);border-radius:9px;padding:2px;flex:none}
.vseg button{padding:4px 10px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--text2)}
.vseg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
#mapView .seg{margin-bottom:8px}
.mapbox{position:relative;background:var(--card);border-radius:16px;overflow:hidden}
.mapbox canvas{display:block;width:100%;touch-action:none;cursor:grab}
.mapbox .zoom{top:8px;right:8px}
.mapinfo{display:none;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:9px 12px;margin-top:8px}
.mapinfo.on{display:flex}
.mapinfo .t{flex:1;min-width:0;font-size:14px}
.mapinfo .t b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mapinfo .t span{color:var(--text2);font-size:12.5px}
.mapinfo button{background:var(--blue);color:#fff;border-radius:999px;padding:6px 13px;font-size:13.5px;font-weight:700}
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin:10px 4px 6px;font-size:12.5px;color:var(--text2)}
.legend span{display:flex;align-items:center;gap:5px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.dot.v{background:var(--green);box-shadow:0 0 0 1.5px var(--card)}
.dot.o{background:var(--text2);opacity:.6;width:6px;height:6px}
.sw{width:14px;height:9px;border-radius:2px;background:var(--landv);display:inline-block}
.chip.sm{padding:4px 10px;font-size:12.5px;margin-left:auto}
:root{--ocean:#E6EEF8;--land:#D6D6DC;--landv:#A9CBFF;--border:#FFFFFF;--grat:rgba(0,0,0,.06)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ocean:#0D1826;--land:#3A3A3E;--landv:#1E4F8F;--border:#1C1C1E;--grat:rgba(255,255,255,.06)}}
:root[data-theme="dark"]{--ocean:#0D1826;--land:#3A3A3E;--landv:#1E4F8F;--border:#1C1C1E;--grat:rgba(255,255,255,.06)}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="top">
  <div class="titlebar">
    <h1>Flughäfen</h1>
    <div class="tb-right">
      <button class="menu-btn" id="menuBtn" aria-label="Daten sichern"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M4 19h16"/></svg></button>
      <button class="addbtn" id="addBtn" aria-label="Eigenen Flughafen hinzufügen">+</button>
      <button class="pill" id="statBtn" aria-label="Statistiken öffnen"><span id="pillTxt">0/0</span>
        <svg viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="7" width="3" height="8" rx="1.5"/><rect x="6.5" y="2" width="3" height="13" rx="1.5"/><rect x="12" y="9" width="3" height="6" rx="1.5"/></svg></button>
    </div>
  </div>
  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
    <input id="q" type="search" placeholder="Stadt, Code oder Land" autocomplete="off" autocorrect="off" spellcheck="false">
    <button class="clear" id="qClear" aria-label="Suche löschen">✕</button>
  </div>
  <div class="chips" id="chips"></div>
  <div class="divider"></div>
</div>

<main>
  <div class="countrow"><div class="count" id="count"></div>
    <div class="vseg" id="viewSeg" role="tablist" aria-label="Ansicht"><button data-v="list">Liste</button><button data-v="grid">Pisten</button><button data-v="map">Karte</button></div></div>
  <div class="list" id="list"></div>
  <div id="mapView" hidden>
    <div class="seg" id="projSeg"><button data-p="2d" class="on">2D · Equal Earth</button><button data-p="3d">3D · Globus</button></div>
    <div class="mapbox" id="mapBox">
      <canvas id="mapCanvas" aria-label="Weltkarte mit besuchten Flughäfen"></canvas>
      <div class="zoom"><button id="mzIn" aria-label="Hineinzoomen">+</button><button id="mzOut" aria-label="Herauszoomen">−</button><button id="mzReset" aria-label="Ansicht zurücksetzen">⟲</button></div>
    </div>
    <div class="mapinfo" id="mapInfo"></div>
    <div class="legend"><span><i class="dot v"></i>besucht</span><span><i class="dot o"></i>offen</span><span><i class="sw"></i>besuchtes Land</span>
      <button class="chip sm on" id="openToggle">Offene zeigen</button></div>
    <p class="hint" id="mapHint"></p>
  </div>
</main>

<nav class="tabbar" aria-label="Sortierung">
  <button class="tab on" data-sort="name"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M4 12h11M4 17h7"/></svg>Name</button>
  <button class="tab" data-sort="land"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>Land</button>
  <button class="tab" data-sort="date"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M2 16l20-6-1-3-7 2-6-6-2 1 3 7-5 1.5-2-2-1.5.5z"/><path d="M3 21h18" stroke-linecap="round"/></svg>Besucht</button>
</nav>

<div class="scrim" id="scrim"></div>

<section class="sheet" id="statSheet" role="dialog" aria-label="Statistiken">
  <div class="grab"></div>
  <div class="sh-head"><h2>Statistiken</h2><button class="xbtn" data-close aria-label="Schließen"><svg viewBox="0 0 14 14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M2 2l10 10M12 2 2 12"/></svg></button></div>
  <div class="sh-body" id="statBody"></div>
</section>

<section class="sheet" id="visitSheet" role="dialog" aria-label="Flughafen">
  <div class="grab"></div>
  <div class="sh-head"><h2 id="vTitle">Flughafen</h2><button class="xbtn" data-close aria-label="Schließen"><svg viewBox="0 0 14 14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M2 2l10 10M12 2 2 12"/></svg></button></div>
  <div class="sh-body" id="vBody">
    <div class="hero-ap" id="vHero"></div>
    <div class="field"><label for="vDate">Zuletzt dort gewesen</label><input type="date" id="vDate"></div>
    <button class="btn primary" id="vSave">Als besucht speichern</button>
    <button class="btn danger" id="vRemove">Als nicht besucht markieren</button>
    <div style="height:24px"></div>
    <div class="sec">Lageplan</div>
    <div class="seg" id="planSeg"><button data-m="plan" class="on">Pisten</button><button data-m="sat">Satellit</button><button data-m="map">Karte</button></div>
    <div class="plan" id="plan"></div>
    <p class="hint" id="planHint"></p>
    <div class="links" id="vLinks"></div>
    <div class="sec">Details</div>
    <div class="facts" id="vFacts"></div>
    <button class="btn danger" id="vDelete">Eigenen Flughafen löschen</button>
  </div>
</section>

<section class="sheet" id="addSheet" role="dialog" aria-label="Flughafen hinzufügen">
  <div class="grab"></div>
  <div class="sh-head"><h2>Flughafen hinzufügen</h2><button class="xbtn" data-close aria-label="Schließen"><svg viewBox="0 0 14 14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M2 2l10 10M12 2 2 12"/></svg></button></div>
  <div class="sh-body">
    <div class="two">
      <div class="field"><label for="aCode">IATA-Code</label><input id="aCode" maxlength="3" placeholder="z. B. MGL" autocapitalize="characters"></div>
      <div class="field"><label for="aCC">Land (ISO)</label><input id="aCC" maxlength="2" placeholder="z. B. DE" autocapitalize="characters"></div>
    </div>
    <div class="field"><label for="aCity">Stadt</label><input id="aCity" placeholder="z. B. Mönchengladbach"></div>
    <div class="field"><label for="aName">Name des Flughafens</label><input id="aName" placeholder="optional"></div>
    <div class="two">
      <div class="field"><label for="aLat">Breitengrad</label><input id="aLat" inputmode="decimal" placeholder="51.230"></div>
      <div class="field"><label for="aLon">Längengrad</label><input id="aLon" inputmode="decimal" placeholder="6.504"></div>
    </div>
    <div class="field"><label for="aCont">Kontinent</label><select id="aCont"></select></div>
    <div class="err" id="aErr"></div>
    <button class="btn primary" id="aSave">Hinzufügen</button>
  </div>
</section>

<section class="sheet" id="dataSheet" role="dialog" aria-label="Daten sichern">
  <div class="grab"></div>
  <div class="sh-head"><h2>Daten sichern</h2><button class="xbtn" data-close aria-label="Schließen"><svg viewBox="0 0 14 14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M2 2l10 10M12 2 2 12"/></svg></button></div>
  <div class="sh-body">
    <p class="hint">Deine Besuche liegen nur im Speicher dieses Browsers. Lade ab und zu eine Sicherung herunter – damit kannst du sie auch auf ein anderes Gerät übertragen.</p>
    <button class="btn primary" id="expBtn">Sicherung herunterladen</button>
    <button class="btn plain" id="impBtn">Sicherung laden</button>
    <input type="file" id="impFile" accept="application/json,.json" hidden>
    <p class="foot" id="dataInfo"></p>
  </div>
</section>

<div class="toast" id="toast"></div>

const CONT = {EU:"Europa",AS:"Asien",NA:"Nordamerika",SA:"Südamerika",AF:"Afrika",OC:"Ozeanien"};
const CONT_ORDER = ["EU","AS","NA","SA","AF","OC"];
const BASE = DATA.map(r=>({code:r[0],city:r[1],name:r[2],cc:r[3],cont:r[4],lat:r[5],lon:r[6],elev:r[7],muni:r[8],icao:r[9],rw:r[10]}));
const LSKEY = "airport-tracker-v1";

let regionNames;
try{ regionNames = new Intl.DisplayNames(["de"],{type:"region"}); }catch(e){ regionNames=null; }
const countryName = cc => { try{ return (regionNames && regionNames.of(cc)) || cc; }catch(e){ return cc; } };
const flag = cc => /^[A-Z]{2}$/.test(cc) ? String.fromCodePoint(...[...cc].map(c=>0x1F1E6+c.charCodeAt(0)-65)) : "🏳️";
const fmtDate = d => { if(!d) return ""; const [y,m,dd]=d.split("-"); return `${dd}.${m}.${y}`; };
const today = () => { const n=new Date(); return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,"0")}-${String(n.getDate()).padStart(2,"0")}`; };
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = (x,d) => x.toLocaleString("de-DE",{minimumFractionDigits:d,maximumFractionDigits:d});
const hasPos = a => typeof a.lat==="number" && typeof a.lon==="number" && isFinite(a.lat) && isFinite(a.lon);
function dms(v,pos,neg){ const s=v<0?neg:pos; v=Math.abs(v); const d=Math.floor(v), mf=(v-d)*60, m=Math.floor(mf), sec=Math.round((mf-m)*60); return `${d}° ${String(m).padStart(2,"0")}′ ${String(sec).padStart(2,"0")}″ ${s}`; }
const fmtLL = a => `${num(Math.abs(a.lat),4)}° ${a.lat<0?"S":"N"}, ${num(Math.abs(a.lon),4)}° ${a.lon<0?"W":"O"}`;

let state = {visits:{}, custom:[], updatedAt:0};
let ui = {filter:"all", cont:null, sort:"name", q:""};
try{ const v=localStorage.getItem(LSKEY+"-view"); ui.view = ["grid","map"].includes(v) ? v : "list"; }catch(e){ ui.view="list"; }
const ICON_GRID='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 19 12 5M14 17l6-3"/></svg>';
const ICON_LIST='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>';
let storageOk = true;
try{ const s = JSON.parse(localStorage.getItem(LSKEY)||"null"); if(s && s.visits) state = Object.assign({visits:{},custom:[],updatedAt:0}, s); }catch(e){ storageOk=false; }
const all = () => BASE.concat(state.custom.map(c=>Object.assign({own:true,rw:[]},c)));
function save(){ state.updatedAt=Date.now(); try{ localStorage.setItem(LSKEY, JSON.stringify(state)); }catch(e){ storageOk=false; toast("Speichern im Browser nicht möglich"); } }

// ---------- Liste ----------
const $ = id => document.getElementById(id);
function renderChips(){
  let h = [["all","Alle"],["seen","Besucht"],["miss","Fehlt"]].map(([k,l])=>`<button class="chip${ui.filter===k?" on":""}" data-f="${k}">${l}</button>`).join("");
  h += `<span class="vsep"></span>` + CONT_ORDER.map(k=>`<button class="chip${ui.cont===k?" on":""}" data-c="${k}">${CONT[k]}</button>`).join("");
  $("chips").innerHTML = h;
}
function filtered(){
  const q = ui.q.trim().toLowerCase();
  let arr = all().filter(a=>{
    const seen = !!state.visits[a.code];
    if(ui.filter==="seen" && !seen) return false;
    if(ui.filter==="miss" && seen) return false;
    if(ui.cont && a.cont!==ui.cont) return false;
    if(q && !(a.code+" "+(a.icao||"")+" "+a.city+" "+a.name+" "+(a.muni||"")+" "+countryName(a.cc)+" "+a.cc).toLowerCase().includes(q)) return false;
    return true;
  });
  const byName = (a,b)=> a.city.localeCompare(b.city,"de") || a.code.localeCompare(b.code);
  if(ui.sort==="name") arr.sort(byName);
  else if(ui.sort==="land") arr.sort((a,b)=> countryName(a.cc).localeCompare(countryName(b.cc),"de") || byName(a,b));
  else arr.sort((a,b)=>{ const da=state.visits[a.code]||"", db=state.visits[b.code]||""; return da!==db ? db.localeCompare(da) : byName(a,b); });
  return arr;
}
function card(a){
  const d = state.visits[a.code];
  return `<button class="card${d?" seen":""}" data-code="${esc(a.code)}">
    <span class="check" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
    <span class="body">
      <div class="city">${esc(a.city)}</div>
      <div class="meta"><span class="tag code c-${a.cont}">${esc(a.code)}</span><span class="tag cc">${esc(countryName(a.cc))}</span>${a.own?'<span class="tag own">eigener</span>':""}</div>
      ${a.name?`<div class="aname">${esc(a.name)}</div>`:""}
      ${hasPos(a)?`<div class="coords">${fmtLL(a)}</div>`:""}
      ${d?`<div class="date">✓ ${fmtDate(d)}</div>`:""}
    </span>
    <span class="flag" aria-label="${esc(countryName(a.cc))}">${flag(a.cc)}</span>
  </button>`;
}

const WORLD = topojson.feature(WORLD_TOPO, WORLD_TOPO.objects.countries).features;
const BORDERS = topojson.mesh(WORLD_TOPO, WORLD_TOPO.objects.countries, (a,b)=>a!==b);
const SPHERE = {type:"Sphere"}, GRAT = d3.geoGraticule10();
const M = {mode:"2d", k:1, tx:0, ty:0, rot:[-10,-42], gz:1, showOpen:true, sel:null, spin:true, pts:[], w:0, h:0, arr:[]};
try{ const s=JSON.parse(localStorage.getItem(LSKEY+"-map")||"null"); if(s){ M.mode=s.mode==="3d"?"3d":"2d"; M.showOpen=s.showOpen!==false; } }catch(e){}
const cv = $("mapCanvas"), ctx = cv.getContext("2d");
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function saveMapPrefs(){ try{ localStorage.setItem(LSKEY+"-map", JSON.stringify({mode:M.mode, showOpen:M.showOpen})); }catch(e){} }
function projection(){
  const w=M.w, h=M.h;
  if(M.mode==="2d"){
    const p=d3.geoEqualEarth().fitExtent([[6,6],[w-6,h-6]],SPHERE);
    return p.scale(p.scale()*M.k).translate([w/2+M.tx, h/2+M.ty]);
  }
  const p=d3.geoOrthographic().fitExtent([[10,10],[w-10,h-10]],SPHERE);
  return p.scale(p.scale()*M.gz).rotate(M.rot).clipAngle(90).precision(0.5);
}
let mapRaf=0;
function drawMap(arr){
  if(arr) M.arr=arr;
  cancelAnimationFrame(mapRaf); mapRaf=requestAnimationFrame(paint);
}
function paint(){
  if($("mapView").hidden) return;
  const box=$("mapBox"), w=box.clientWidth||360, h=M.mode==="2d" ? Math.round(w/1.95) : Math.min(w, Math.round(window.innerHeight*0.62));
  const dpr=window.devicePixelRatio||1;
  if(cv.width!==Math.round(w*dpr)||cv.height!==Math.round(h*dpr)){ cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr); cv.style.height=h+"px"; }
  M.w=w; M.h=h;
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,w,h);
  const proj=projection(), path=d3.geoPath(proj,ctx);
  const seenCC=new Set(all().filter(a=>state.visits[a.code]).map(a=>a.cc));
  const C={ocean:css("--ocean"),land:css("--land"),landv:css("--landv"),border:css("--border"),grat:css("--grat"),green:css("--green"),open:css("--text2"),card:css("--card"),text:css("--text"),blue:css("--blue")};
  if(M.mode==="3d"){ // leichter Schatten hinter Globus
    ctx.save(); ctx.shadowColor="rgba(0,0,0,.18)"; ctx.shadowBlur=18; ctx.beginPath(); path(SPHERE); ctx.fillStyle=C.ocean; ctx.fill(); ctx.restore();
  } else { ctx.beginPath(); path(SPHERE); ctx.fillStyle=C.ocean; ctx.fill(); }
  ctx.beginPath(); path(GRAT); ctx.strokeStyle=C.grat; ctx.lineWidth=0.7; ctx.stroke();
  ctx.beginPath(); WORLD.forEach(f=>{ if(!seenCC.has(f.id)) path(f); }); ctx.fillStyle=C.land; ctx.fill();
  ctx.beginPath(); WORLD.forEach(f=>{ if(seenCC.has(f.id)) path(f); }); ctx.fillStyle=C.landv; ctx.fill();
  ctx.beginPath(); path(BORDERS); ctx.strokeStyle=C.border; ctx.lineWidth=0.6; ctx.stroke();
  ctx.beginPath(); path(SPHERE); ctx.strokeStyle=C.grat; ctx.lineWidth=1; ctx.stroke();
  // Punkte
  const center = M.mode==="3d" ? [-M.rot[0],-M.rot[1]] : null;
  M.pts=[];
  const zoomR = M.mode==="2d" ? Math.min(1.8,1+ (M.k-1)*0.12) : Math.min(1.6,1+(M.gz-1)*0.15);
  const list=M.arr.filter(hasPos);
  const drawSet=(visited)=>{
    list.forEach(a=>{
      const v=!!state.visits[a.code]; if(v!==visited) return;
      if(!v && !M.showOpen) return;
      if(center && d3.geoDistance([a.lon,a.lat],center)>Math.PI/2-0.02) return;
      const xy=proj([a.lon,a.lat]); if(!xy||xy[0]<-10||xy[0]>w+10||xy[1]<-10||xy[1]>h+10) return;
      M.pts.push({a,x:xy[0],y:xy[1],v});
      ctx.beginPath();
      if(v){ ctx.arc(xy[0],xy[1],4.2*zoomR,0,7); ctx.fillStyle=C.green; ctx.fill(); ctx.lineWidth=1.5; ctx.strokeStyle=C.card; ctx.stroke(); }
      else { ctx.arc(xy[0],xy[1],1.9*zoomR,0,7); ctx.globalAlpha=.55; ctx.fillStyle=C.open; ctx.fill(); ctx.globalAlpha=1; }
    });
  };
  drawSet(false); drawSet(true);
  // Auswahl
  if(M.sel){
    const p=M.pts.find(q=>q.a.code===M.sel);
    if(p){
      ctx.beginPath(); ctx.arc(p.x,p.y,9*zoomR,0,7); ctx.lineWidth=2.5; ctx.strokeStyle=C.blue; ctx.stroke();
      ctx.font="700 12px -apple-system,BlinkMacSystemFont,sans-serif";
      const label=p.a.code, tw=ctx.measureText(label).width, lx=Math.min(w-tw-12,Math.max(4,p.x-tw/2-6)), ly=p.y-12*zoomR-20;
      ctx.fillStyle=C.card; ctx.beginPath(); if(ctx.roundRect) ctx.roundRect(lx,ly<2?p.y+12:ly,tw+12,18,9); else ctx.rect(lx,ly<2?p.y+12:ly,tw+12,18); ctx.fill();
      ctx.fillStyle=C.text; ctx.fillText(label,lx+6,(ly<2?p.y+12:ly)+13);
    }
  }
  const nV=M.arr.filter(a=>state.visits[a.code]).length;
  $("mapHint").textContent = (M.mode==="2d" ? "Ziehen zum Verschieben, mit zwei Fingern zoomen." : "Ziehen zum Drehen, mit zwei Fingern zoomen.") + " Tippe auf einen Punkt für Details." + (nV? "" : " Noch keine besuchten Flughäfen in dieser Auswahl.");
  if(M.mode==="3d" && M.spin){ M.rot[0]+=0.12; mapRaf=requestAnimationFrame(paint); }
}
function showInfo(a){
  const box=$("mapInfo");
  if(!a){ box.classList.remove("on"); box.innerHTML=""; return; }
  const d=state.visits[a.code];
  box.innerHTML=`<span style="font-size:24px">${flag(a.cc)}</span><div class="t"><b>${esc(a.city)} · ${esc(a.code)}</b><span>${d?"✓ besucht am "+fmtDate(d):"noch nicht besucht"} · ${esc(countryName(a.cc))}</span></div><button id="miOpen">Details</button>`;
  box.classList.add("on"); $("miOpen").onclick=()=>openVisit(a.code);
}
// Interaktion
const ptrs=new Map(); let gest=null, moved=0;
function clampPan(){ if(M.mode!=="2d") return; const mx=M.w*(M.k-1)/2+10, my=M.h*(M.k-1)/2+10; M.tx=Math.max(-mx,Math.min(mx,M.tx)); M.ty=Math.max(-my,Math.min(my,M.ty)); }
function zoomBy(f){
  M.spin=false;
  if(M.mode==="2d"){ const nk=Math.max(1,Math.min(14,M.k*f)), r=nk/M.k; M.k=nk; M.tx*=r; M.ty*=r; clampPan(); }
  else M.gz=Math.max(0.8,Math.min(10,M.gz*f));
  drawMap();
}
cv.addEventListener("pointerdown",e=>{ cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY}); moved=0; M.spin=false;
  if(ptrs.size===2){ const [p1,p2]=[...ptrs.values()]; gest={d:Math.hypot(p1.x-p2.x,p1.y-p2.y)}; } });
cv.addEventListener("pointermove",e=>{
  const prev=ptrs.get(e.pointerId); if(!prev) return;
  const cur={x:e.clientX,y:e.clientY}; ptrs.set(e.pointerId,cur);
  if(ptrs.size===2 && gest){ const [p1,p2]=[...ptrs.values()]; const d=Math.hypot(p1.x-p2.x,p1.y-p2.y); if(gest.d>0){ zoomBy(d/gest.d); } gest.d=d; moved+=10; return; }
  const dx=cur.x-prev.x, dy=cur.y-prev.y; moved+=Math.abs(dx)+Math.abs(dy);
  if(M.mode==="2d"){ M.tx+=dx; M.ty+=dy; clampPan(); }
  else { const s=0.28/M.gz; M.rot[0]+=dx*s; M.rot[1]=Math.max(-89,Math.min(89,M.rot[1]-dy*s)); }
  drawMap();
});
function endPtr(e){
  const had=ptrs.has(e.pointerId); ptrs.delete(e.pointerId); if(ptrs.size<2) gest=null;
  if(had && ptrs.size===0 && moved<6 && e.type==="pointerup"){
    const r=cv.getBoundingClientRect(), x=e.clientX-r.left, y=e.clientY-r.top;
    let best=null, bd=1e9;
    M.pts.forEach(p=>{ const d=Math.hypot(p.x-x,p.y-y)-(p.v?4:0); if(d<bd){bd=d;best=p;} });
    if(best && bd<16){ M.sel=best.a.code; showInfo(best.a); } else { M.sel=null; showInfo(null); }
    drawMap();
  }
}
cv.addEventListener("pointerup",endPtr); cv.addEventListener("pointercancel",endPtr);
cv.addEventListener("wheel",e=>{ e.preventDefault(); zoomBy(Math.exp(-e.deltaY*0.002)); },{passive:false});
cv.addEventListener("dblclick",()=>zoomBy(2));
$("mzIn").onclick=()=>zoomBy(1.6); $("mzOut").onclick=()=>zoomBy(1/1.6);
$("mzReset").onclick=()=>{ M.k=1; M.tx=0; M.ty=0; M.gz=1; M.rot=[-10,-42]; drawMap(); };
$("projSeg").addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b) return; M.mode=b.dataset.p; saveMapPrefs(); syncMapCtl(); drawMap(); });
$("openToggle").onclick=()=>{ M.showOpen=!M.showOpen; saveMapPrefs(); syncMapCtl(); drawMap(); };

function miniSVG(a){
  if(!hasPos(a) || !a.rw || !a.rw.length) return '<span class="nopl">keine Pisten</span>';
  const k=Math.cos(a.lat*Math.PI/180), P=(la,lo)=>[(lo-a.lon)*k*111320, -(la-a.lat)*110574];
  const segs=a.rw.map(r=>{ if(r.length>=8) return [P(r[4],r[5]),P(r[6],r[7]),r[3]||45];
    const h=r[4]*Math.PI/180, dx=Math.sin(h)*r[2]/2, dy=-Math.cos(h)*r[2]/2; return [[-dx,-dy],[dx,dy],r[3]||45]; });
  const xs=segs.flatMap(s=>[s[0][0],s[1][0]]), ys=segs.flatMap(s=>[s[0][1],s[1][1]]);
  const minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);
  const span=Math.max(maxX-minX,maxY-minY,1500)*1.12, s=100/span, cx=(minX+maxX)/2, cy=(minY+maxY)/2;
  const T=p=>[(50+(p[0]-cx)*s).toFixed(1),(50+(p[1]-cy)*s).toFixed(1)];
  return '<svg viewBox="0 0 100 100" aria-hidden="true">'+segs.map(g=>{ const [x1,y1]=T(g[0]),[x2,y2]=T(g[1]);
    return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--text)" stroke-opacity=".85" stroke-width="${Math.max(3.5,g[2]*s).toFixed(1)}"/>`; }).join("")+'</svg>';
}
function tile(a){ const d=state.visits[a.code];
  return `<button class="tile${d?" seen":""}" data-code="${esc(a.code)}" aria-label="${esc(a.city)} ${esc(a.code)}${d?", besucht":""}">${miniSVG(a)}<b>${esc(a.code)}</b></button>`; }
function render(){
  const list = all(), seen = list.filter(a=>state.visits[a.code]).length;
  $("pillTxt").textContent = `${seen}/${list.length}`;
  renderChips();
  const arr = filtered();
  $("count").textContent = `${arr.length} von ${list.length} Flughäfen`;
  document.querySelectorAll("#viewSeg button").forEach(b=>{ b.classList.toggle("on",b.dataset.v===ui.view); b.setAttribute("aria-selected",b.dataset.v===ui.view); });
  const isMap = ui.view==="map";
  $("mapView").hidden = !isMap; $("list").hidden = isMap && arr.length>0;
  document.querySelector(".tabbar").style.display = isMap ? "none" : "";
  if(isMap) drawMap(arr);
  $("list").className = ui.view==="grid" && arr.length ? "grid" : "list";
  $("list").innerHTML = arr.length ? arr.map(ui.view==="grid"?tile:card).join("") :
    (ui.q ? `<div class="empty"><b>Kein Treffer für „${esc(ui.q)}“</b>Fehlt ein Flughafen? Über + kannst du ihn selbst anlegen.</div>`
          : ui.filter==="seen" ? `<div class="empty"><b>Noch nichts abgehakt</b>Tippe auf einen Flughafen, um ihn als besucht zu markieren.</div>`
          : `<div class="empty"><b>Alles erledigt</b>In dieser Auswahl fehlt dir kein Flughafen mehr.</div>`);
  if($("statSheet").classList.contains("on")) renderStats();
}

// ---------- Statistik ----------
function renderStats(){
  const list = all(), seenArr = list.filter(a=>state.visits[a.code]);
  const pct = list.length ? seenArr.length/list.length*100 : 0, C = 2*Math.PI*92;
  const countries = [...new Set(seenArr.map(a=>a.cc))], conts = new Set(seenArr.map(a=>a.cont));
  const rows = CONT_ORDER.map(k=>{ const tot=list.filter(a=>a.cont===k).length, s=seenArr.filter(a=>a.cont===k).length;
    return `<div class="row"><span class="n">${CONT[k]}</span><span class="bar"><i style="width:${tot?s/tot*100:0}%"></i></span><span class="v">${s}/${tot}</span></div>`; }).join("");
  const byC = {}; seenArr.forEach(a=>{ byC[a.cc]=(byC[a.cc]||0)+1; });
  const top = Object.entries(byC).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const topRows = top.map(([cc,n])=>{ const tot=list.filter(a=>a.cc===cc).length;
    return `<div class="row"><span class="n">${flag(cc)} ${esc(countryName(cc))}</span><span class="bar"><i style="width:${n/tot*100}%"></i></span><span class="v">${n}/${tot}</span></div>`; }).join("");
  // Extrempunkte
  const pos = seenArr.filter(hasPos);
  let ext = "";
  if(pos.length){
    const pick = f => pos.reduce((m,a)=>f(a,m)?a:m);
    const N=pick((a,m)=>a.lat>m.lat), S=pick((a,m)=>a.lat<m.lat), W=pick((a,m)=>a.lon<m.lon), O=pick((a,m)=>a.lon>m.lon);
    const hi = pos.filter(a=>a.elev!=null); const H = hi.length ? hi.reduce((m,a)=>a.elev>m.elev?a:m) : null;
    const f = (l,a,v)=>`<div class="fact"><span>${l}</span><span>${esc(a.city)} (${esc(a.code)}) · ${v}</span></div>`;
    ext = `<div class="sec">Deine Extreme</div><div class="facts">${f("Nördlichster",N,num(N.lat,1)+"°")}${f("Südlichster",S,num(S.lat,1)+"°")}${f("Westlichster",W,num(W.lon,1)+"°")}${f("Östlichster",O,num(O.lon,1)+"°")}${H?f("Höchstgelegener",H,num(H.elev,0)+" m"):""}</div>`;
  }
  const now = new Date(), months = [];
  for(let i=11;i>=0;i--){ const d=new Date(now.getFullYear(),now.getMonth()-i,1); months.push({key:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`,lbl:d.toLocaleDateString("de-DE",{month:"narrow"}),n:0}); }
  Object.values(state.visits).forEach(v=>{ const m=months.find(x=>v.startsWith(x.key)); if(m) m.n++; });
  const max = Math.max(1,...months.map(m=>m.n));
  const bars = months.map(m=>`<div class="mcol">${m.n?`<b>${m.n}</b>`:""}<i class="${m.n?"":"z"}" style="height:${m.n?Math.max(6,m.n/max*100):3}%"></i><span>${m.lbl}</span></div>`).join("");
  $("statBody").innerHTML = `
    <div class="ring"><svg viewBox="0 0 220 220"><circle cx="110" cy="110" r="92" fill="none" stroke="var(--fill2)" stroke-width="20"/>
      <circle cx="110" cy="110" r="92" fill="none" stroke="var(--blue)" stroke-width="20" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct/100)}" ${seenArr.length?"":'opacity="0"'}/></svg>
      <div class="in"><span class="frac">${seenArr.length}/${list.length}</span><span class="pct">${num(pct,1)} %</span><span class="lbl">BESUCHT</span></div></div>
    <div class="quick"><div><b>${countries.length}</b><span>Länder</span></div><div><b>${conts.size}/6</b><span>Kontinente</span></div><div><b>${seenArr.filter(a=>a.cc==="DE").length}</b><span>in Deutschland</span></div></div>
    <div class="sec">Nach Kontinent</div><div class="group">${rows}</div>
    ${top.length?`<div class="sec">Meistbesuchte Länder</div><div class="group">${topRows}</div>`:""}
    ${ext}
    <div class="sec">Besuche in den letzten 12 Monaten</div><div class="group"><div class="months">${bars}</div></div>
    ${countries.length?`<div class="sec">Deine Länder</div><div class="group"><div class="countries">${countries.sort((a,b)=>countryName(a).localeCompare(countryName(b),"de")).map(cc=>`<span>${flag(cc)} ${esc(countryName(cc))}</span>`).join("")}</div></div>`:""}
    <div class="foot">Gezählt wird pro Flughafen der letzte Besuch.</div>`;
}

// ---------- Pistenplan (offline, SVG) ----------
function planSVG(a){
  const W=360, H=250, lat0=a.lat, lon0=a.lon, k=Math.cos(lat0*Math.PI/180);
  const P = (la,lo)=>[(lo-lon0)*k*111320, -(la-lat0)*110574];
  const segs = a.rw.map(r=>{
    let p1,p2;
    if(r.length>=8){ p1=P(r[4],r[5]); p2=P(r[6],r[7]); }
    else { const h=r[4]*Math.PI/180, dx=Math.sin(h)*r[2]/2, dy=-Math.cos(h)*r[2]/2; p1=[-dx,-dy]; p2=[dx,dy]; }
    return {a:r[0],b:r[1],len:r[2],wid:r[3]||45,p1,p2,approx:r.length<8};
  });
  const xs=[0,...segs.flatMap(s=>[s.p1[0],s.p2[0]])], ys=[0,...segs.flatMap(s=>[s.p1[1],s.p2[1]])];
  let minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);
  const pad=Math.max(350,(maxX-minX+maxY-minY)*0.12);
  minX-=pad;maxX+=pad;minY-=pad;maxY+=pad;
  const s=Math.min(W/(maxX-minX),H/(maxY-minY)), cx=(minX+maxX)/2, cy=(minY+maxY)/2;
  const T=p=>[W/2+(p[0]-cx)*s, H/2+(p[1]-cy)*s];
  let g="";
  segs.forEach(sg=>{
    const [x1,y1]=T(sg.p1),[x2,y2]=T(sg.p2), w=Math.max(6,sg.wid*s);
    g+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--text)" stroke-opacity=".82" stroke-width="${w}"/>`;
    g+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--group)" stroke-width="1" stroke-dasharray="6 5" stroke-opacity=".9"/>`;
    const L=Math.hypot(x2-x1,y2-y1)||1, ux=(x2-x1)/L, uy=(y2-y1)/L;
    g+=`<text x="${x1-ux*14}" y="${y1-uy*14+4}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--text2)">${esc(sg.a)}</text>`;
    g+=`<text x="${x2+ux*14}" y="${y2+uy*14+4}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--text2)">${esc(sg.b)}</text>`;
  });
  const [ax,ay]=T([0,0]);
  g+=`<circle cx="${ax}" cy="${ay}" r="5" fill="var(--blue)" stroke="var(--group)" stroke-width="2"/>`;
  // Maßstab
  const mPerPx=1/s, target=mPerPx*90, steps=[250,500,1000,2000,5000,10000];
  const sb=steps.find(v=>v>=target*0.6)||10000, sbpx=sb*s;
  g+=`<g transform="translate(14 ${H-16})"><rect width="${sbpx}" height="4" fill="var(--text2)"/><text y="-6" font-size="11" fill="var(--text2)">${sb>=1000?num(sb/1000,sb%1000?1:0)+" km":sb+" m"}</text></g>`;
  // Nordpfeil
  g+=`<g transform="translate(${W-22} 28)"><path d="M0-14 6 6 0 2-6 6Z" fill="var(--text2)"/><text y="20" text-anchor="middle" font-size="11" font-weight="700" fill="var(--text2)">N</text></g>`;
  return {svg:`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Pistenplan ${esc(a.code)}">${g}</svg>`, approx:segs.some(x=>x.approx)};
}

// ---------- Kacheln (online) ----------
let tileZ = 14, planMode = "plan", current = null;
function tilesHTML(){ return `<div class="tiles" id="tiles"><div class="off" id="tOff">Keine Verbindung – Satellit und Karte brauchen Internet. Der Pistenplan funktioniert offline.</div><span class="pin"></span><div class="zoom"><button id="zIn" aria-label="Hineinzoomen">+</button><button id="zOut" aria-label="Herauszoomen">−</button></div></div><span class="attr" id="tAttr"></span>`; }
function drawTiles(){
  const box=$("tiles"); if(!box||!current) return;
  box.querySelectorAll("img").forEach(i=>i.remove());
  const w=box.clientWidth||340, h=box.clientHeight||260, z=tileZ, n=2**z;
  const la=current.lat*Math.PI/180;
  const cx=(current.lon+180)/360*n*256, cy=(1-Math.log(Math.tan(la)+1/Math.cos(la))/Math.PI)/2*n*256;
  const x0=Math.floor((cx-w/2)/256), x1=Math.floor((cx+w/2)/256), y0=Math.floor((cy-h/2)/256), y1=Math.floor((cy+h/2)/256);
  let total=0, failed=0; const frag=document.createDocumentFragment();
  for(let ty=y0;ty<=y1;ty++) for(let tx=x0;tx<=x1;tx++){
    if(ty<0||ty>=n) continue;
    const xx=((tx%n)+n)%n, img=new Image(); total++;
    img.alt=""; img.decoding="async"; img.referrerPolicy="no-referrer-when-downgrade";
    img.style.left=(tx*256-(cx-w/2))+"px"; img.style.top=(ty*256-(cy-h/2))+"px";
    img.onerror=()=>{ failed++; if(failed===total){ const o=$("tOff"); if(o) o.style.display="flex"; } };
    img.src = planMode==="sat" ? `https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${z}/${ty}/${xx}` : `https://tile.openstreetmap.org/${z}/${xx}/${ty}.png`;
    frag.appendChild(img);
  }
  box.insertBefore(frag, box.firstChild);
  $("tAttr").textContent = planMode==="sat" ? "© Esri, Maxar, Earthstar Geographics" : "© OpenStreetMap-Mitwirkende";
}
function renderPlan(){
  const a=current, box=$("plan"), hint=$("planHint");
  document.querySelectorAll("#planSeg button").forEach(b=>b.classList.toggle("on",b.dataset.m===planMode));
  $("planSeg").style.display = hasPos(a) ? "flex" : "none";
  if(!hasPos(a)){ box.innerHTML=`<div class="empty" style="padding:30px">Für diesen Flughafen sind keine Koordinaten hinterlegt.</div>`; hint.textContent=""; return; }
  if(planMode==="plan"){
    if(!a.rw || !a.rw.length){ box.innerHTML=`<div class="empty" style="padding:30px">Keine Pistendaten vorhanden – schau dir die Satellitenansicht an.</div>`; hint.textContent=""; return; }
    const p=planSVG(a); box.innerHTML=p.svg;
    hint.textContent = "Schematisch: Start- und Landebahnen maßstabsgetreu, blauer Punkt = Flughafenbezugspunkt." + (p.approx?" Lage einzelner Pisten nur aus Richtung und Länge geschätzt.":"");
  } else {
    box.innerHTML=tilesHTML(); hint.textContent="";
    $("zIn").onclick=()=>{ tileZ=Math.min(18,tileZ+1); drawTiles(); };
    $("zOut").onclick=()=>{ tileZ=Math.max(8,tileZ-1); drawTiles(); };
    requestAnimationFrame(drawTiles);
  }
}
$("planSeg").addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b) return; planMode=b.dataset.m; renderPlan(); });

// ---------- Sheets ----------
function show(id){ closeSheets(); $("scrim").classList.add("on"); $(id).classList.add("on"); document.body.style.overflow="hidden"; }
function closeSheets(){ document.querySelectorAll(".sheet.on").forEach(s=>s.classList.remove("on")); $("scrim").classList.remove("on"); document.body.style.overflow=""; }
$("scrim").onclick = closeSheets;
document.querySelectorAll("[data-close]").forEach(b=>b.onclick=closeSheets);
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeSheets(); });
document.querySelectorAll(".sheet").forEach(sh=>{
  let y0=null, dy=0;
  sh.addEventListener("touchstart",e=>{ const body=sh.querySelector(".sh-body"); if(e.target.closest(".tiles")) return; if(body.contains(e.target) && body.scrollTop>0) return; y0=e.touches[0].clientY; dy=0; },{passive:true});
  sh.addEventListener("touchmove",e=>{ if(y0===null) return; dy=e.touches[0].clientY-y0; if(dy>0){ sh.style.transition="none"; sh.style.transform=`translateY(${dy}px)`; } },{passive:true});
  sh.addEventListener("touchend",()=>{ if(y0===null) return; sh.style.transition=""; sh.style.transform=""; if(dy>110) closeSheets(); y0=null; });
});

function openVisit(code){
  const a = all().find(x=>x.code===code); if(!a) return;
  current = a; tileZ = 14;
  if(planMode==="plan" && (!a.rw||!a.rw.length) && hasPos(a)) planMode="sat";
  const d = state.visits[code];
  $("vTitle").textContent = d ? "Besucht" : "Flughafen";
  $("vHero").innerHTML = `<div class="f">${flag(a.cc)}</div><div class="c">${esc(a.city)} · ${esc(a.code)}</div><div class="s">${esc(a.name||"")}${a.name?", ":""}${esc(countryName(a.cc))}</div>`;
  $("vDate").value = d || today(); $("vDate").max = today();
  $("vSave").textContent = d ? "Datum speichern" : "Als besucht speichern";
  $("vRemove").style.display = d ? "block" : "none";
  $("vDelete").style.display = a.own ? "block" : "none";
  const f=(l,v)=>v!=null&&v!==""?`<div class="fact"><span>${l}</span><span>${v}</span></div>`:"";
  const rwTxt = (a.rw||[]).map(r=>`${esc(r[0])}/${esc(r[1])} · ${num(r[2],0)} m`).join("<br>");
  $("vFacts").innerHTML =
    f("Stadt",esc(a.city)) + (a.muni && a.muni!==a.city ? f("Gemeinde",esc(a.muni)) : "") + f("Land",`${flag(a.cc)} ${esc(countryName(a.cc))}`) +
    f("Kontinent",CONT[a.cont]) + f("IATA / ICAO",`${esc(a.code)}${a.icao?" / "+esc(a.icao):""}`) +
    (hasPos(a)? f("Breitengrad",`${num(a.lat,5)}°<br><small>${dms(a.lat,"N","S")}</small>`) + f("Längengrad",`${num(a.lon,5)}°<br><small>${dms(a.lon,"O","W")}</small>`) : "") +
    (a.elev!=null? f("Höhe",`${num(a.elev,0)} m ü. M.`):"") + (rwTxt? f(a.rw.length>1?"Pisten":"Piste",rwTxt):"") +
    (d? f("Besucht am",fmtDate(d)):"");
  $("vLinks").innerHTML = hasPos(a) ? `<a href="https://maps.apple.com/?ll=${a.lat},${a.lon}&q=${encodeURIComponent(a.code+" "+(a.name||a.city))}&t=k" target="_blank" rel="noopener">Apple Karten</a><a href="https://www.google.com/maps/search/?api=1&query=${a.lat},${a.lon}" target="_blank" rel="noopener">Google Maps</a>` : "";
  show("visitSheet"); $("vBody").scrollTop=0;
  renderPlan();
}
$("vSave").onclick = ()=>{ if(!current) return; state.visits[current.code] = $("vDate").value || today(); save(); closeSheets(); render(); if(M.sel===current.code) showInfo(current); toast(`${current.city} gespeichert`); };
$("vRemove").onclick = ()=>{ if(!current) return; delete state.visits[current.code]; save(); closeSheets(); render(); if(M.sel===current.code) showInfo(current); toast(`${current.city} entfernt`); };
$("vDelete").onclick = ()=>{ if(!current||!current.own) return; if(!confirm(`${current.city} (${current.code}) wirklich löschen?`)) return;
  state.custom = state.custom.filter(c=>c.code!==current.code); delete state.visits[current.code]; save(); closeSheets(); render(); toast("Flughafen gelöscht"); };

// ---------- Eigener Flughafen ----------
$("aCont").innerHTML = CONT_ORDER.map(k=>`<option value="${k}">${CONT[k]}</option>`).join("");
$("addBtn").onclick = ()=>{ ["aCode","aCC","aCity","aName","aLat","aLon"].forEach(i=>$(i).value=""); $("aCont").value="EU"; $("aErr").textContent=""; show("addSheet"); };
$("aSave").onclick = ()=>{
  const code=$("aCode").value.trim().toUpperCase(), cc=$("aCC").value.trim().toUpperCase(), city=$("aCity").value.trim(), name=$("aName").value.trim(), cont=$("aCont").value;
  const la=$("aLat").value.trim().replace(",","."), lo=$("aLon").value.trim().replace(",",".");
  if(!/^[A-Z0-9]{3}$/.test(code)) return $("aErr").textContent="Der IATA-Code braucht genau drei Zeichen.";
  if(!/^[A-Z]{2}$/.test(cc)) return $("aErr").textContent="Gib das Land als zweistelligen ISO-Code an, etwa DE oder FR.";
  if(!city) return $("aErr").textContent="Gib eine Stadt an.";
  if(all().some(a=>a.code===code)) return $("aErr").textContent=`${code} ist schon in der Liste – such einfach danach.`;
  const entry={code,city,name,cc,cont};
  if(la||lo){ const lat=parseFloat(la), lon=parseFloat(lo);
    if(!(lat>=-90&&lat<=90&&lon>=-180&&lon<=180)) return $("aErr").textContent="Koordinaten als Dezimalgrad angeben, z. B. 51.23 und 6.50.";
    entry.lat=lat; entry.lon=lon; }
  state.custom.push(entry); save(); closeSheets(); ui.q=code; $("q").value=code; $("qClear").style.display="grid"; render(); toast(`${city} hinzugefügt`);
};

// ---------- Sicherung ----------
$("menuBtn").onclick = ()=>{ const n=Object.keys(state.visits).length;
  $("dataInfo").textContent = storageOk ? `${n} Besuche${state.custom.length?`, ${state.custom.length} eigene Flughäfen`:""} gespeichert.` : "Achtung: Dieser Browser speichert nichts dauerhaft. Sichere deine Daten regelmäßig.";
  show("dataSheet"); };
$("expBtn").onclick = ()=>{
  const blob=new Blob([JSON.stringify({app:"flughaefen",version:1,exported:new Date().toISOString(),visits:state.visits,custom:state.custom},null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob), a=document.createElement("a");
  a.href=url; a.download=`flughaefen-${today()}.json`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000);
  toast("Sicherung erstellt");
};
$("impBtn").onclick = ()=>$("impFile").click();
$("impFile").onchange = async e=>{
  const file=e.target.files[0]; e.target.value=""; if(!file) return;
  try{
    const d=JSON.parse(await file.text());
    if(!d || typeof d.visits!=="object") throw 0;
    const visits={}; Object.entries(d.visits).forEach(([k,v])=>{ if(/^[A-Z0-9]{3}$/.test(k) && /^\d{4}-\d{2}-\d{2}$/.test(v)) visits[k]=v; });
    const custom=Array.isArray(d.custom)?d.custom.filter(c=>c&&/^[A-Z0-9]{3}$/.test(c.code)&&c.city&&/^[A-Z]{2}$/.test(c.cc)&&CONT[c.cont]).map(c=>({code:c.code,city:String(c.city),name:String(c.name||""),cc:c.cc,cont:c.cont,...(typeof c.lat==="number"&&typeof c.lon==="number"?{lat:c.lat,lon:c.lon}:{})})):[];
    if(!confirm(`Sicherung mit ${Object.keys(visits).length} Besuchen laden? Deine aktuellen Einträge werden ersetzt.`)) return;
    state.visits=visits; state.custom=custom; save(); closeSheets(); render(); toast("Sicherung geladen");
  }catch(err){ toast("Datei ist keine gültige Sicherung"); }
};

$("statBtn").onclick = ()=>{ renderStats(); show("statSheet"); $("statBody").scrollTop=0; };

// ---------- Events ----------
$("viewSeg").addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b) return; ui.view=b.dataset.v; try{ localStorage.setItem(LSKEY+"-view", ui.view); }catch(e){} render(); window.scrollTo({top:0}); });
$("list").addEventListener("click",e=>{ const c=e.target.closest(".card,.tile"); if(c) openVisit(c.dataset.code); });
$("chips").addEventListener("click",e=>{ const b=e.target.closest(".chip"); if(!b) return;
  if(b.dataset.f) ui.filter=b.dataset.f; if(b.dataset.c) ui.cont = ui.cont===b.dataset.c ? null : b.dataset.c; render(); window.scrollTo({top:0}); });
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{ ui.sort=t.dataset.sort; document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===t)); render(); window.scrollTo({top:0}); });
$("q").addEventListener("input",e=>{ ui.q=e.target.value; $("qClear").style.display=ui.q?"grid":"none"; render(); });
$("qClear").onclick = ()=>{ ui.q=""; $("q").value=""; $("qClear").style.display="none"; render(); $("q").focus(); };
let tt; function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove("on"),1800); }
render();

</script>
</body>
</html>
