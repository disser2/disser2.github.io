<title>Sozialcheck Deutschland</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#ECEEEA;
  --surface:#FFFFFF;
  --surface-2:#F5F6F3;
  --ink:#14181C;
  --muted:#5A6169;
  --line:#D2D7CF;
  --line-strong:#B7BEB3;
  --accent:#1B3FD8;
  --accent-deep:#1533A8;
  --accent-soft:#E3E8FC;
  --on-accent:#FFFFFF;
  --good:#0B6E3F;
  --check:#8A5200;
  --shadow:0 1px 0 rgba(20,24,28,.05), 0 8px 24px -18px rgba(20,24,28,.5);
  --r:6px;
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",Arial,sans-serif;
  --f-mono:"IBM Plex Mono","SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#14171A; --surface:#1C2026; --surface-2:#22272E;
    --ink:#E9ECE7; --muted:#9AA3AA; --line:#333A42; --line-strong:#49525B;
    --accent:#8FA6FF; --accent-deep:#B3C2FF; --accent-soft:#242C46; --on-accent:#0F1320;
    --good:#5FCB93; --check:#E4AE5E;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 8px 24px -18px #000;
  }
}
:root[data-theme="dark"]{
  --ground:#14171A; --surface:#1C2026; --surface-2:#22272E;
  --ink:#E9ECE7; --muted:#9AA3AA; --line:#333A42; --line-strong:#49525B;
  --accent:#8FA6FF; --accent-deep:#B3C2FF; --accent-soft:#242C46; --on-accent:#0F1320;
  --good:#5FCB93; --check:#E4AE5E;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 8px 24px -18px #000;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.015em}
p{margin:0}
a{color:var(--accent)}
.wrap{max-width:940px;margin:0 auto;padding:0 20px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

/* ---------- Kopf ---------- */
header.top{position:sticky;top:0;z-index:20;background:var(--ground);border-bottom:1px solid var(--line)}
.topbar{display:flex;align-items:center;gap:16px;justify-content:space-between;padding:14px 20px;max-width:940px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:-.02em}
.brand .mark{width:26px;height:26px;border-radius:3px;background:var(--accent);display:grid;place-items:center;flex:none}
.brand .mark svg{width:16px;height:16px;stroke:var(--on-accent);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.rail{display:none;gap:4px;align-items:center}
@media(min-width:800px){.rail{display:flex}}
.rail button{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:none;border:0;border-bottom:2px solid transparent;padding:4px 7px 5px;cursor:pointer}
.rail button[data-state="done"]{color:var(--ink)}
.rail button[data-state="now"]{color:var(--accent);border-bottom-color:var(--accent)}
.rail button:disabled{cursor:default;opacity:.45}
.rail button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.progress{height:3px;background:var(--line)}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s cubic-bezier(.2,.7,.3,1)}
@media (prefers-reduced-motion:reduce){.progress i{transition:none}}

/* ---------- Frage ---------- */
main{padding:28px 0 132px}
.qhead{display:flex;flex-direction:column;gap:8px;margin-bottom:22px}
.qhead h1{font-size:clamp(26px,5.2vw,38px);line-height:1.1}
.qhead .sub{color:var(--muted);font-size:15px;max-width:56ch}
.tiles{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
@media(min-width:760px){.tiles{grid-template-columns:repeat(var(--cols,4),1fr)}}
.tile{position:relative;display:flex;flex-direction:column;gap:9px;align-items:flex-start;text-align:left;
  min-height:134px;padding:16px 16px 15px;background:var(--surface);color:var(--ink);
  border:1.5px solid var(--line);border-radius:var(--r);cursor:pointer;font:inherit;
  transition:border-color .12s,background .12s,transform .12s}
.tile:hover{border-color:var(--line-strong)}
.tile:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tile .ico{width:30px;height:30px;stroke:var(--accent);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.tile .num{font-family:var(--f-display);font-size:27px;line-height:1;color:var(--accent);font-weight:700;letter-spacing:-.03em}
.tile .lab{font-family:var(--f-display);font-weight:600;font-size:16.5px;line-height:1.22;margin-top:auto}
.tile .hint{font-size:13px;color:var(--muted);line-height:1.35}
.tile[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tile[aria-pressed="true"] .ico{stroke:var(--on-accent)}
.tile[aria-pressed="true"] .num{color:var(--on-accent)}
.tile[aria-pressed="true"] .hint{color:var(--on-accent);opacity:.82}
.tile .tick{position:absolute;top:13px;right:13px;width:19px;height:19px;opacity:0;stroke:var(--on-accent);fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
.tile[aria-pressed="true"] .tick{opacity:1}
@media (prefers-reduced-motion:no-preference){.tile:active{transform:scale(.985)}}

/* ---------- Aktionsleiste ---------- */
.actions{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--ground);border-top:1px solid var(--line)}
.actions .inner{max-width:940px;margin:0 auto;padding:14px 20px;display:flex;gap:12px;align-items:center}
.btn{font:inherit;font-family:var(--f-display);font-weight:600;font-size:17px;border-radius:var(--r);border:1.5px solid transparent;cursor:pointer;padding:16px 26px;transition:background .12s,color .12s}
.btn-primary{background:var(--accent);color:var(--on-accent);flex:1;min-height:58px}
.btn-primary:hover{background:var(--accent-deep)}
.btn-ghost{background:transparent;color:var(--ink);border-color:var(--line-strong);min-height:58px;padding:16px 20px}
.btn-ghost:hover{background:var(--surface)}
.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.counter{font-family:var(--f-mono);font-size:12px;color:var(--muted);letter-spacing:.05em;white-space:nowrap}

/* ---------- Ergebnis ---------- */
.res-head{border-bottom:2px solid var(--ink);padding-bottom:18px;margin-bottom:24px}
.res-head h1{font-size:clamp(28px,6vw,42px);line-height:1.05;margin-top:6px}
.score{display:flex;gap:26px;flex-wrap:wrap;margin-top:16px}
.score div{display:flex;align-items:baseline;gap:8px}
.score b{font-family:var(--f-display);font-size:30px;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.score span{font-size:14px;color:var(--muted)}
.score .g b{color:var(--good)}
.score .c b{color:var(--check)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:18px 0 0;align-items:center}
.chip{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.03em;background:var(--surface-2);border:1px solid var(--line);border-radius:99px;padding:6px 11px;color:var(--muted)}
button.chip{background:none;border-color:var(--line-strong);color:var(--accent);cursor:pointer;font-family:var(--f-body);font-size:12.5px;font-weight:600;padding:7px 14px}
button.chip:hover{background:var(--accent-soft)}
button.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.group{margin-top:34px}
.group>h2{font-size:20px;display:flex;align-items:center;gap:10px}
.group>h2 .dot{width:11px;height:11px;border-radius:2px;flex:none}
.group .glead{color:var(--muted);font-size:14.5px;margin:7px 0 16px;max-width:64ch}
.cards{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:830px){.cards{grid-template-columns:1fr 1fr}}
.card{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.card .stripe{width:5px;flex:none;background:var(--line-strong)}
.card.hoch .stripe{background:var(--good)}
.card.pruefen .stripe{background:var(--check)}
.card .body{padding:17px 18px;display:flex;flex-direction:column;gap:9px;flex:1;min-width:0}
.card h3{font-size:18px;line-height:1.2}
.card .was{font-size:14.5px}
.card dl{margin:2px 0 0;display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:10px}
.card dl>div{display:flex;gap:9px;font-size:13.5px}
.card dt{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);flex:none;width:42px;padding-top:3px}
.card dd{margin:0;color:var(--muted)}
.card .go{margin-top:auto;padding-top:12px;display:flex;gap:8px;flex-wrap:wrap}
.go a{display:inline-flex;align-items:center;gap:7px;font-family:var(--f-display);font-weight:600;font-size:14.5px;text-decoration:none;
  background:var(--accent-soft);color:var(--accent-deep);border-radius:var(--r);padding:11px 15px;min-height:44px}
.go a:hover{background:var(--accent);color:var(--on-accent)}
.go a.sec{background:transparent;border:1.5px solid var(--line-strong);color:var(--ink)}
.go a.sec:hover{background:var(--surface-2);color:var(--ink)}
.go a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.go svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
details.more{margin-top:34px;border-top:1px solid var(--line);padding-top:18px}
details.more>summary{cursor:pointer;font-family:var(--f-display);font-weight:600;font-size:16px;list-style:none;display:flex;align-items:center;gap:9px}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::before{content:"+";font-family:var(--f-mono);color:var(--accent);font-size:18px}
details.more[open]>summary::before{content:"\2013"}
details.more>summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
details.more .cards{margin-top:16px;opacity:.7}
.note{margin-top:38px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:9px;max-width:74ch}
.note b{color:var(--ink);font-family:var(--f-display);font-size:15px}
footer.foot{border-top:1px solid var(--line);margin-top:28px;padding:20px 0 40px;font-size:12.5px;color:var(--muted);display:flex;gap:16px;flex-wrap:wrap;justify-content:space-between;align-items:center}
.hidden{display:none!important}
</style>

<header class="top">
  <div class="topbar">
    <div class="brand">
      <span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg></span>
      Sozialcheck
    </div>
    <nav class="rail" id="rail" aria-label="Schritte"></nav>
  </div>
  <div class="progress"><i id="bar"></i></div>
</header>

<main>
  <div class="wrap">
    <section id="step" aria-live="polite"></section>
    <section id="result" class="hidden"></section>
  </div>
</main>

<div class="actions" id="actions">
  <div class="inner">
    <button class="btn btn-ghost" id="back" type="button">Zurück</button>
    <button class="btn btn-primary" id="next" type="button">Weiter</button>
    <span class="counter" id="counter"></span>
  </div>
</div>

<script>
"use strict";

/* ------------------------------------------------------------ Fragen */
var STEPS = [
  { id:"leben", multi:true, kurz:"Leben", cols:3,
    frage:"Was trifft auf dich zu?",
    sub:"Mehrere Antworten möglich. Tippe alles an, was passt.",
    optionen:[
      {v:"kinder",      ico:"i-kinder",      lab:"Kinder im Haushalt", hint:"Eigene, Stief- oder Pflegekinder"},
      {v:"schwanger",   ico:"i-schwanger",   lab:"Schwanger oder Kind kommt", hint:"Auch kurz nach der Geburt"},
      {v:"allein",      ico:"i-allein",      lab:"Alleinerziehend", hint:"Kind lebt hauptsächlich bei dir"},
      {v:"pflege",      ico:"i-pflege",      lab:"Ich pflege jemanden", hint:"Angehörige zu Hause"},
      {v:"behinderung", ico:"i-behinderung", lab:"Behinderung oder chronisch krank", hint:"Auch ohne Ausweis"},
      {v:"keins",       ico:"i-nichts",      lab:"Nichts davon", hint:""}
    ]},
  { id:"arbeit", multi:true, kurz:"Arbeit", cols:5,
    frage:"Wie sieht dein Alltag gerade aus?",
    sub:"Mehrere Antworten möglich.",
    optionen:[
      {v:"job",           ico:"i-job",        lab:"Angestellt", hint:"Voll- oder Teilzeit, Minijob"},
      {v:"selbst",        ico:"i-selbst",     lab:"Selbstständig", hint:"Freiberuflich oder Gewerbe"},
      {v:"arbeitslos",    ico:"i-suche",      lab:"Arbeitslos", hint:"Oder kurz davor"},
      {v:"studium",       ico:"i-studium",    lab:"Studium", hint:"Uni, FH, Fernstudium"},
      {v:"ausbildung",    ico:"i-ausbildung", lab:"Ausbildung", hint:"Betrieblich oder schulisch"},
      {v:"schule",        ico:"i-schule",     lab:"Schule", hint:"Allgemeinbildend"},
      {v:"weiterbildung", ico:"i-weiter",     lab:"Weiterbildung geplant", hint:"Umschulung, Meister, Fachwirt"},
      {v:"krank",         ico:"i-krank",      lab:"Länger krank", hint:"Arbeitsunfähig oder in Reha"},
      {v:"rente",         ico:"i-rente",      lab:"Rente", hint:"Altersrente oder Pension"},
      {v:"pause",         ico:"i-pause",      lab:"Gerade nichts davon", hint:"Erziehungszeit, Pause"}
    ]},
  { id:"wohnen", multi:false, kurz:"Wohnen", cols:4,
    frage:"Wie wohnst du?",
    sub:"Eine Antwort. Es geht automatisch weiter.",
    optionen:[
      {v:"miete",    ico:"i-miete",    lab:"Zur Miete", hint:"Wohnung oder Haus"},
      {v:"eigentum", ico:"i-eigentum", lab:"Eigenes Zuhause", hint:"Eigentum, oft mit Kredit"},
      {v:"eltern",   ico:"i-eltern",   lab:"Bei Familie", hint:"Eltern oder Angehörige"},
      {v:"unsicher", ico:"i-unsicher", lab:"Unsicher oder ohne Wohnung", hint:"Kündigung, Mietschulden, Notunterkunft"}

  { id:"geld", multi:false, kurz:"Geld", cols:4,

    optionen:[

      {v:"gering",      num:"2", lab:"Reicht gerade so", hint:"Nichts bleibt übrig, keine Rücklagen"},
      {v:"mittel",      num:"3", lab:"Kommen zurecht", hint:"Etwas Luft, kleine Rücklagen"},
      {v:"hoch",        num:"4", lab:"Gut versorgt", hint:"Deutlich mehr als nötig"}
    ]},
  { id:"alter", multi:false, kurz:"Alter", cols:5,
    frage:"Wie alt bist du?",
    sub:"Einige Leistungen hängen am Alter.",
    optionen:[
      {v:"u18",   num:"<18", lab:"Unter 18"},
      {v:"18_24", num:"18",  lab:"18 bis 24"},
      {v:"25_44", num:"25",  lab:"25 bis 44"},
      {v:"45_64", num:"45",  lab:"45 bis 64"},
      {v:"65p",   num:"65+", lab:"65 oder älter"}
    ]}
];

/* -------------------------------------------------- Leistungskatalog */

/* ------------------------------------------------------------ Zustand */
var KEY="sozialcheck.v1";
var i=0, fertig=false;
var A={leben:[],arbeit:[],wohnen:null,geld:null,alter:null};
try{ var gespeichert=localStorage.getItem(KEY);
  if(gespeichert){ var p=JSON.parse(gespeichert); if(p&&p.A){ for(var k in A){ if(p.A[k]!=null) A[k]=p.A[k]; } } }
}catch(e){}
function speichern(){ try{ localStorage.setItem(KEY,JSON.stringify({A:A})); }catch(e){} }

function $(id){ return document.getElementById(id); }
function el(t,c,x){ var n=document.createElement(t); if(c)n.className=c; if(x!=null)n.textContent=x; return n; }
function ico(id,c){ return '<svg class="'+c+'" aria-hidden="true"><use href="#'+id+'"></use></svg>'; }

/* ----------------------------------------------------- Schrittansicht */
function renderRail(){
  var r=$("rail"); r.innerHTML="";
  STEPS.forEach(function(s,n){
    var b=el("button",null,(n+1)+". "+s.kurz);
    b.type="button";
    b.dataset.state = fertig ? "done" : (n<i ? "done" : (n===i ? "now" : "todo"));
    b.disabled = !fertig && n>i;
    b.onclick=function(){ fertig=false; i=n; renderStep(); };
    r.appendChild(b);
  });
  $("bar").style.width = (fertig ? 100 : (i/STEPS.length)*100)+"%";
}

function renderStep(){
  var s=STEPS[i], root=$("step");
  $("result").classList.add("hidden");
  root.classList.remove("hidden");
  $("actions").classList.remove("hidden");
  root.innerHTML="";

  var head=el("div","qhead");
  head.appendChild(el("p","eyebrow","Schritt "+(i+1)+" von "+STEPS.length));
  head.appendChild(el("h1",null,s.frage));
  head.appendChild(el("p","sub",s.sub));
  root.appendChild(head);

  var grid=el("div","tiles");
  grid.style.setProperty("--cols", s.cols||4);
  s.optionen.forEach(function(o){
    var b=document.createElement("button");
    b.type="button"; b.className="tile";
    var aktiv = s.multi ? A[s.id].indexOf(o.v)>=0 : A[s.id]===o.v;
    b.setAttribute("aria-pressed", aktiv?"true":"false");
    b.innerHTML =
      (o.ico ? ico(o.ico,"ico") : '<span class="num">'+o.num+'</span>') +
      '<span class="lab">'+o.lab+'</span>' +
      (o.hint ? '<span class="hint">'+o.hint+'</span>' : '') +
      ico("i-tick","tick");
    b.onclick=function(){ waehle(s,o,b); };
    grid.appendChild(b);
  });
  root.appendChild(grid);

  $("back").style.visibility = i===0 ? "hidden" : "visible";
  $("next").textContent = (i===STEPS.length-1) ? "Ergebnis anzeigen" : "Weiter";
  $("counter").textContent = s.multi ? (A[s.id].length+" gewählt") : "";
  renderRail();
  window.scrollTo(0,0);
}

function waehle(s,o,b){
  if(s.multi){
    var arr=A[s.id];
    if(o.v==="keins"){
      A[s.id] = arr.indexOf("keins")>=0 ? [] : ["keins"];
    } else {
      var k=arr.indexOf(o.v);
      if(k>=0) arr.splice(k,1); else arr.push(o.v);
      var kx=arr.indexOf("keins"); if(kx>=0) arr.splice(kx,1);
    }
    speichern(); renderStep();
  } else {
    A[s.id]=o.v; speichern();
    var alle=b.parentElement.querySelectorAll(".tile");
    for(var x=0;x<alle.length;x++) alle[x].setAttribute("aria-pressed","false");
    b.setAttribute("aria-pressed","true");
    var ruhig = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    setTimeout(weiter, ruhig?0:170);
  }
}
function weiter(){ if(i<STEPS.length-1){ i++; renderStep(); } else { fertig=true; renderResult(); } }
$("next").onclick=weiter;
$("back").onclick=function(){ if(i>0){ i--; renderStep(); } };

/* --------------------------------------------------------- Auswertung */
function fakten(){
  return {
    l:function(v){ return A.leben.indexOf(v)>=0; },
    a:function(v){ return A.arbeit.indexOf(v)>=0; },
    wohnen:A.wohnen, geld:A.geld, alter:A.alter,
    knapp: A.geld==="sehr_gering"||A.geld==="gering"
  };
}
function auswerten(){
  var f=fakten(), r={hoch:[],pruefen:[],rest:[]};
  KATALOG.forEach(function(p){
    var lvl=null; try{ lvl=p.r(f); }catch(e){ lvl=null; }
    if(lvl==="hoch") r.hoch.push(p); else if(lvl==="pruefen") r.pruefen.push(p); else r.rest.push(p);
  });
  return r;
}

function karte(p,lvl){
  var c=el("article","card "+lvl);
  c.innerHTML =
    '<div class="stripe"></div><div class="body">'+
      '<h3>'+p.n+'</h3>'+
      '<p class="was">'+p.was+'</p>'+
      '<dl><div><dt>Wer</dt><dd>'+p.wer+'</dd></div><div><dt>Wo</dt><dd>'+p.wo+'</dd></div></dl>'+
      '<div class="go">'+
        '<a href="'+p.url+'" target="_blank" rel="noopener noreferrer">Infos und Antrag'+ico("i-ext","")+'</a>'+
        (p.url2 ? '<a class="sec" href="'+p.url2+'" target="_blank" rel="noopener noreferrer">'+(p.lab2||"Mehr")+ico("i-ext","")+'</a>' : '')+
      '</div>'+
    '</div>';
  return c;
}

function gruppe(titel,farbe,lead,liste,lvl){
  var g=el("section","group");
  var h=el("h2");
  var d=el("span","dot"); d.style.background=farbe;
  h.appendChild(d); h.appendChild(document.createTextNode(titel+" ("+liste.length+")"));
  g.appendChild(h);
  g.appendChild(el("p","glead",lead));
  var cards=el("div","cards");
  liste.forEach(function(p){ cards.appendChild(karte(p,lvl)); });
  g.appendChild(cards);
  return g;
}

function labelVon(stepId,v){
  var s=null, o=null, x;
  for(x=0;x<STEPS.length;x++){ if(STEPS[x].id===stepId){ s=STEPS[x]; break; } }
  if(!s) return v;
  for(x=0;x<s.optionen.length;x++){ if(s.optionen[x].v===v){ o=s.optionen[x]; break; } }
  return o ? o.lab : v;
}

function renderResult(){
  var r=auswerten(), root=$("result");
  $("step").classList.add("hidden");
  root.classList.remove("hidden");
  $("actions").classList.add("hidden");
  root.innerHTML="";

  var head=el("div","res-head");
  head.appendChild(el("p","eyebrow","Dein Ergebnis"));
  head.appendChild(el("h1",null, r.hoch.length ? "Diese Leistungen passen zu dir" : "Das solltest du prüfen"));
  var sc=el("div","score");
  sc.innerHTML='<div class="g"><b>'+r.hoch.length+'</b><span>wahrscheinlich für dich</span></div>'+
               '<div class="c"><b>'+r.pruefen.length+'</b><span>prüfen lohnt sich</span></div>';
  head.appendChild(sc);

  var chips=el("div","chips");
  A.leben.forEach(function(v){ chips.appendChild(el("span","chip",labelVon("leben",v))); });
  A.arbeit.forEach(function(v){ chips.appendChild(el("span","chip",labelVon("arbeit",v))); });
  ["wohnen","geld","alter"].forEach(function(k){ if(A[k]) chips.appendChild(el("span","chip",labelVon(k,A[k]))); });
  var edit=el("button","chip","Angaben ändern");
  edit.type="button";
  edit.onclick=function(){ fertig=false; i=0; renderStep(); };
  chips.appendChild(edit);
  head.appendChild(chips);
  root.appendChild(head);

  var cs=getComputedStyle(document.documentElement);
  if(r.hoch.length){
    root.appendChild(gruppe("Wahrscheinlich für dich", cs.getPropertyValue("--good"),
      "Nach deinen Angaben erfüllst du die typischen Voraussetzungen. Ein Antrag lohnt sich, viele Leistungen gibt es auch rückwirkend.",
      r.hoch,"hoch"));
  }
  if(r.pruefen.length){
    root.appendChild(gruppe("Prüfen lohnt sich", cs.getPropertyValue("--check"),
      "Hier hängt es an Details wie Einkommensgrenze, Alter des Kindes oder Versicherungszeiten. Ein Anruf bei der zuständigen Stelle klärt das in Minuten.",
