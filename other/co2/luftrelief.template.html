<title>Luftrelief</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@1,6..72,400;1,6..72,500&display=swap">
<style>
/* Layout: ein Kartenblatt. Kopfzeile, Werkzeugleiste, Reliefbühne (füllt den Rest), Profilleiste.
   Die Chrome bleibt neutral; Farbe tragen allein die Messwerte. */
:root {
  color-scheme: light;
  --mode: light;
  --ground: #e8ecef;
  --ground-hi: #f5f7f8;
  --ground-lo: #d8dfe3;
  --panel: #f6f8f9;
  --ink: #14212b;
  --ink-2: #44535e;
  --ink-3: #647480;
  --hair: #d2d9de;
  --hair-2: #bcc6cd;
  --wall: #cdd4d9;
  --good: #0ca30c;
  --warn: #fab219;
  --serious: #ec835a;
  --critical: #d03b3b;
  --font-display: "Newsreader", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --font-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --gutter: clamp(16px, 2.2vw, 28px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --mode: dark;
    --ground: #0e1418;
    --ground-hi: #19232b;
    --ground-lo: #090d10;
    --panel: #131b21;
    --ink: #edf2f5;
    --ink-2: #b1bec7;
    --ink-3: #8795a0;
    --hair: #25313a;
    --hair-2: #384853;
    --wall: #2b3943;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --mode: dark;
  --ground: #0e1418;
  --ground-hi: #19232b;
  --ground-lo: #090d10;
  --panel: #131b21;
  --ink: #edf2f5;
  --ink-2: #b1bec7;
  --ink-3: #8795a0;
  --hair: #25313a;
  --hair-2: #384853;
  --wall: #2b3943;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font: 14px/1.45 var(--font-ui);
  -webkit-font-smoothing: antialiased;
}
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

.app {
  height: 100%;
  display: grid;
  grid-template-rows: auto auto minmax(340px, 1fr) auto;
}

/* Kopfzeile */
.masthead {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 2px 22px;
  padding: 14px var(--gutter) 4px;
}
.masthead h1 {
  margin: 0;
  font: italic 400 31px/1.05 var(--font-display);
  letter-spacing: -0.01em;
}
.sub { margin: 0; color: var(--ink-2); font-size: 13px; }
.lede {
  flex: 1 1 100%;
  margin: 0;
  color: var(--ink-3);
  font-size: 12.5px;
}

/* Werkzeugleiste */
.toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: end;
  gap: 10px 22px;
  padding: 8px var(--gutter) 12px;
  border-bottom: 1px solid var(--hair);
}
.field { display: grid; gap: 4px; min-width: 0; margin: 0; padding: 0; border: 0; }
.lab {
  padding: 0;
  color: var(--ink-3);
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.lab output { font-family: var(--font-data); letter-spacing: 0; color: var(--ink-2); }
.seg {
  display: inline-flex;
  flex-wrap: wrap;
  gap: 2px;
  padding: 2px;
  border: 1px solid var(--hair-2);
  border-radius: 7px;
  background: var(--panel);
}
.seg button {
  padding: 7px 10px;
  border: 0;
  border-radius: 5px;
  background: none;
  color: var(--ink-2);
  font: 500 13px/1 var(--font-ui);
  cursor: pointer;
}
.seg button:hover { color: var(--ink); background: color-mix(in srgb, var(--ink) 8%, transparent); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
select {
  appearance: none;
  padding: 8px 30px 8px 10px;
  border: 1px solid var(--hair-2);
  border-radius: 7px;
  background-color: var(--panel);
  background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
  background-position: calc(100% - 15px) 55%, calc(100% - 10px) 55%;
  background-size: 5px 5px;
  background-repeat: no-repeat;
  color: var(--ink);
  font: 500 13px/1 var(--font-ui);
  cursor: pointer;
}
input[type="range"] { width: 132px; height: 31px; margin: 0; accent-color: var(--ink); cursor: pointer; }

/* Reliefbühne */
.stage {
  position: relative;
  min-height: 0;
  overflow: hidden;
  background: radial-gradient(110% 85% at 50% 30%, var(--ground-hi), var(--ground) 55%, var(--ground-lo));
}
#gl {
  position: absolute;
  inset: 0;
  display: block;
  width: 100%;
  height: 100%;
  cursor: grab;
  touch-action: none;
}
#gl:active { cursor: grabbing; }
#gl:focus-visible { outline-offset: -4px; }
.labels { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.lbl {
  position: absolute;
  left: 0;
  top: 0;
  visibility: hidden;
  white-space: nowrap;
  color: var(--ink-2);
  font: 11.5px/1.2 var(--font-data);
  text-shadow: 0 0 3px var(--ground), 0 0 7px var(--ground);
}
.lbl.month { font: 500 11px/1.2 var(--font-ui); letter-spacing: 0.12em; text-transform: uppercase; }
.lbl.peak { padding-bottom: 14px; color: var(--ink); text-align: center; text-shadow: none; }
.lbl.peak .tag {
  display: grid;
  justify-items: center;
  padding: 3px 7px 4px;
  border-radius: 5px;
  background: color-mix(in srgb, var(--panel) 86%, transparent);
  box-shadow: 0 0 0 1px var(--hair);
}
.lbl.peak b { font: 500 12px/1.2 var(--font-data); }
.lbl.peak span { color: var(--ink-2); font: 11px/1.2 var(--font-ui); }
.lbl.peak::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: 1px;
  width: 1px;
  height: 13px;
  background: var(--ink);
}
.marker {
  position: absolute;
  left: -7px;
  top: -7px;
  width: 14px;
  height: 14px;
  border: 2px solid var(--ink);
  border-radius: 50%;
  box-shadow: 0 0 0 2px var(--panel), inset 0 0 0 2px var(--panel);
  visibility: hidden;
}
.views { position: absolute; top: 12px; right: 16px; }
.legend {
  position: absolute;
  left: 16px;
  bottom: 14px;
  display: grid;
  gap: 5px;
  width: min(264px, calc(100% - 32px));
  padding: 10px 12px 11px;
  border: 1px solid var(--hair);
  border-radius: 8px;
  background: color-mix(in srgb, var(--panel) 88%, transparent);
  backdrop-filter: blur(8px);
  font-size: 12px;
}
.legend h2 { margin: 0; font: 600 12px/1.3 var(--font-ui); }
.legend canvas { display: block; width: 100%; height: 10px; border-radius: 2px; }
.legend .ticks { position: relative; height: 14px; color: var(--ink-2); font: 11px/1.2 var(--font-data); }
.legend .ticks span { position: absolute; top: 0; transform: translateX(-50%); }
.legend .ticks span:first-child { transform: none; }
.legend .ticks span:last-child { transform: translateX(-100%); }
.legend p { margin: 0; color: var(--ink-2); line-height: 1.35; }
.legend .key { display: inline-block; width: 18px; height: 3px; margin-right: 7px; border-radius: 2px; background: var(--warn); box-shadow: 0 0 0 1px color-mix(in srgb, var(--ink) 45%, transparent); vertical-align: middle; }
.tip {
  position: absolute;
  left: 0;
  top: 0;
  z-index: 3;
  padding: 7px 10px 8px;
  border-radius: 6px;
  background: var(--ink);
  color: var(--panel);
  font-size: 12px;
  line-height: 1.35;
  white-space: nowrap;
  pointer-events: none;
}
.tip b { font: 500 13px/1.3 var(--font-data); }
.tip i { font-style: normal; opacity: 0.72; }
.hint {
  position: absolute;
  left: 16px;
  top: 14px;
  max-width: calc(100% - 380px);
  margin: 0;
  color: var(--ink-3);
  font-size: 12px;
  transition: opacity 0.6s;
  pointer-events: none;
}
.hint.gone { opacity: 0; }
.fail { position: absolute; inset: 0; display: grid; place-items: center; margin: 0; padding: 24px; color: var(--ink-2); text-align: center; }

/* Profilleiste */
.panel {
  display: grid;
  grid-template-columns: minmax(300px, 340px) minmax(0, 1fr) minmax(0, 1.5fr);
  gap: 8px 30px;
  padding: 12px var(--gutter) 14px;
  border-top: 1px solid var(--hair);
  background: var(--panel);
}
.readout { display: grid; align-content: start; gap: 6px; min-width: 0; }
.when { margin: 0; font-weight: 600; }
.when span { color: var(--ink-2); font-weight: 400; }
.vals { display: grid; grid-template-columns: 1fr 1fr; gap: 1px 24px; margin: 0; }
.vals div:first-child { grid-column: 1 / -1; }
.vals div { display: flex; align-items: baseline; gap: 8px; }
.vals dt { flex: 1; color: var(--ink-2); font-size: 12.5px; }
.vals dd { margin: 0; color: var(--ink-2); font-size: 12px; white-space: nowrap; }
.vals dd b { color: var(--ink); font: 500 13.5px/1.4 var(--font-data); }
.vals .on dt { color: var(--ink); font-weight: 600; }
.status { display: inline-flex; align-items: baseline; gap: 4px; margin-left: 6px; color: var(--ink); }
.status i { font-style: normal; font-size: 10px; }
.status[data-s="good"] i { color: var(--good); }
.status[data-s="warn"] i { color: var(--warn); }
.status[data-s="serious"] i { color: var(--serious); }
.status[data-s="critical"] i { color: var(--critical); }
.foot { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 2px 14px; }
.note { margin: 0; color: var(--ink-3); font-size: 12px; }
.link {
  justify-self: start;
  padding: 0;
  border: 0;
  background: none;
  color: var(--ink-2);
  font: 12.5px/1.4 var(--font-ui);
  text-decoration: underline;
  text-underline-offset: 3px;
  cursor: pointer;
}
.link:hover { color: var(--ink); }
.chart { display: grid; grid-template-rows: auto 1fr; gap: 4px; min-width: 0; margin: 0; }
.chart figcaption { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 14px; font-size: 12.5px; }
.chart figcaption b { font-weight: 600; }
.chart .keys { display: flex; flex-wrap: wrap; gap: 2px 12px; color: var(--ink-2); font-size: 12px; }
.chart .keys i { display: inline-block; width: 14px; margin-right: 5px; border-top: 2px solid var(--ink); vertical-align: middle; }
.chart .keys i.thin { border-top: 1px solid var(--ink-3); }
.chart svg { display: block; width: 100%; height: 124px; overflow: visible; cursor: crosshair; touch-action: pan-y; }
.chart text { fill: var(--ink-3); font: 11px var(--font-data); }
.chart .ty { text-anchor: end; }
.chart .tx { text-anchor: middle; }
.chart .tr { text-anchor: end; fill: var(--ink-2); }
.chart .tv { fill: var(--ink); font-weight: 500; paint-order: stroke; stroke: var(--panel); stroke-width: 4px; stroke-linejoin: round; }
.chart .g { stroke: var(--hair); }
.chart .axis { stroke: var(--hair-2); }
.chart .ref { stroke: var(--warn); stroke-width: 1.5; }
.chart .cross { stroke: var(--ink-3); }
.chart path { fill: none; stroke-linejoin: round; stroke-linecap: round; }
.chart .s-main { stroke: var(--ink); stroke-width: 2; }
#svgYear .s-main { stroke-width: 1.5; }
.chart .s-thin { stroke: var(--ink-3); stroke-width: 1; }
.chart .dot { fill: var(--ink); stroke: var(--panel); stroke-width: 2; }
.tablewrap { grid-column: 2 / -1; max-height: 150px; overflow: auto; }
.tablewrap table { width: 100%; border-collapse: collapse; font: 12px/1.3 var(--font-data); font-variant-numeric: tabular-nums; }
.tablewrap th, .tablewrap td { padding: 3px 10px; border-bottom: 1px solid var(--hair); text-align: right; white-space: nowrap; }
.tablewrap th { position: sticky; top: 0; background: var(--panel); color: var(--ink-2); font: 500 11.5px/1.3 var(--font-ui); }
.tablewrap th:first-child, .tablewrap td:first-child { text-align: left; }
.tablewrap tr.sel td { background: color-mix(in srgb, var(--ink) 9%, transparent); }
.tablewrap tbody tr { cursor: pointer; }

@media (max-width: 1000px) {
  .panel { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .readout { grid-column: 1 / -1; }
  .vals { grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); column-gap: 28px; }
  .vals div:first-child { grid-column: auto; }
  .tablewrap { grid-column: 1 / -1; }
}
@media (max-width: 900px), (max-height: 700px) {
  .lede, #lgContour { display: none; }
}
@media (max-width: 640px) {
  .app { height: auto; grid-template-rows: auto auto 56svh auto; }
  .masthead h1 { font-size: 27px; }
  .lede, .hint { display: none; }
  .panel { grid-template-columns: minmax(0, 1fr); }
  .legend { bottom: 10px; padding: 8px 10px; }
  .views { right: 12px; }
  .seg button { padding: 7px 8px; }
}
@media (prefers-reduced-motion: reduce) {
  .hint { transition: none; }
}
</style>

<div class="app">
  <header class="masthead">
    <h1>Luftrelief</h1>
    <p class="sub" id="sub">Raumluft als Geländemodell</p>
    <p class="lede" id="lede"></p>
  </header>

  <div class="toolbar">
    <fieldset class="field">
      <legend class="lab">Höhe</legend>
      <div class="seg" id="segHeight"></div>
    </fieldset>
    <label class="field">
      <span class="lab">Farbe</span>
      <select id="selColor"></select>
    </label>
    <fieldset class="field">
      <legend class="lab">Glättung</legend>
      <div class="seg" id="segSmooth">
        <button type="button" data-v="raw">Rohdaten</button>
        <button type="button" data-v="w7">7 Tage</button>
        <button type="button" data-v="w30">30 Tage</button>
      </div>
    </fieldset>
    <label class="field">
      <span class="lab">Überhöhung <output id="exOut" for="rngEx">1,0×</output></span>
      <input type="range" id="rngEx" min="0.4" max="2.4" step="0.1" value="1">
    </label>
  </div>

  <main class="stage" id="stage">
    <canvas id="gl" tabindex="0" aria-label="3D-Relief der Messwerte: Datum von links nach rechts, Uhrzeit von hinten nach vorn, Messwert als Höhe. Pfeiltasten bewegen die Auswahl."></canvas>
    <div class="labels" id="labels" aria-hidden="true"><div class="marker" id="marker"></div></div>
    <div class="views seg" id="segView" role="group" aria-label="Ansicht">
      <button type="button" data-v="relief">Relief</button>
      <button type="button" data-v="karte">Karte</button>
      <button type="button" data-v="jahr">Jahresgang</button>
      <button type="button" data-v="tag">Tagesgang</button>
    </div>
    <div class="legend" id="legend">
      <h2 id="lgTitle"></h2>
      <canvas id="lgRamp" width="256" height="1"></canvas>
      <div class="ticks" id="lgTicks"></div>
      <p id="lgContour"></p>
      <p id="lgThresh"><span class="key"></span>1.000 ppm, Pettenkofer-Zahl</p>
    </div>
    <div class="tip" id="tip" hidden></div>
    <p class="hint" id="hint">Ziehen dreht · Scrollen zoomt · Rechtsklick verschiebt · Klick heftet einen Zeitpunkt an</p>
  </main>

  <section class="panel" aria-label="Ausgewählter Zeitpunkt">
    <div class="readout">
      <p class="when" id="roWhen"></p>
      <dl class="vals" id="roVals"></dl>
      <div class="foot">
        <button type="button" class="link" id="btnTable" aria-pressed="false">Tageswerte als Tabelle</button>
        <p class="note" id="roNote"></p>
      </div>
    </div>
    <figure class="chart" id="figDay">
      <figcaption><b id="capDay"></b><span class="keys" id="keysDay"></span></figcaption>
      <svg id="svgDay" role="img" aria-label="Verlauf des ausgewählten Tages"></svg>
    </figure>
    <figure class="chart" id="figYear">
      <figcaption><b id="capYear"></b><span class="keys" id="keysYear"></span></figcaption>
      <svg id="svgYear" role="img" aria-label="Verlauf der ausgewählten Uhrzeit über alle Tage"></svg>
    </figure>
    <div class="tablewrap" id="tableWrap" hidden></div>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.147.0/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script>/*__DATA__*/</script>
<script>
(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
};
const stage = $('#stage'), canvas = $('#gl'), labelLayer = $('#labels');
const fail = msg => { stage.append(el('p', 'fail', msg)); canvas.hidden = true; $('#legend').hidden = true; $('#hint').hidden = true; };
if (!window.THREE || !THREE.OrbitControls) {
  fail('Die 3D-Bibliothek konnte nicht geladen werden. Bitte Internetverbindung prüfen und die Seite neu laden.');
  return;
}

// ---------- Daten ----------
const NX = DATA.days, NZ = DATA.slots, N = NX * NZ;
const W = 24, D = 9.6, H0 = 3.4, BASE = 0.34;
const X0 = -W / 2, Z0 = -D / 2, DX = W / (NX - 1), DZ = D / (NZ - 1);
const startUTC = Date.parse(DATA.start + 'T00:00:00Z');
const dayDate = i => new Date(startUTC + i * 864e5);
const gapSet = new Set(DATA.gaps);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const easeInOut = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeOut = t => 1 - Math.pow(1 - t, 3);

const METRICS = [
  { id: 'co2', name: 'CO₂', unit: 'ppm', dec: 0, q: 100, step: 100, idx: 5, hue: [160, 228], chroma: 0.125 },
  { id: 't', name: 'Temperatur', unit: '°C', dec: 1, q: 1, step: 1, idx: 5, hue: [98, 28], chroma: 0.17 },
  { id: 'rh', name: 'rel. Feuchte', unit: '%', dec: 0, q: 5, step: 2, idx: 5, hue: [240, 272], chroma: 0.15 },
  { id: 'ah', name: 'abs. Feuchte', unit: 'g/m³', dec: 1, q: 1, step: 1, idx: 5, hue: [305, 288], chroma: 0.15 },
  { id: 'dpt', name: 'Taupunkt', unit: '°C', dec: 1, q: 1, step: 1, idx: 5, hue: [335, 355], chroma: 0.14 },
  { id: 'vpd', name: 'VPD', unit: 'kPa', dec: 2, q: 0.5, step: 0.1, idx: 5, hue: [88, 55], chroma: 0.11 },
];
const raw = {};
for (const m of METRICS) {
  const src = DATA.m[m.id], sc = DATA.scale[m.id], a = new Float32Array(N);
  let lo = Infinity, hi = -Infinity;
  for (let k = 0; k < N; k++) { const v = src[k] / sc; a[k] = v; if (v < lo) lo = v; if (v > hi) hi = v; }
  raw[m.id] = a;
  m.min = lo; m.max = hi;
  m.lo = Math.floor(lo / m.q + 1e-9) * m.q;
  m.hi = Math.ceil(hi / m.q - 1e-9) * m.q;
  if (m.hi <= m.lo) m.hi = m.lo + m.q;
  m.nf = new Intl.NumberFormat('de-DE', { minimumFractionDigits: m.dec, maximumFractionDigits: m.dec });
  m.ticks = [];
  const big = m.step * m.idx;
  for (let n = Math.ceil(m.lo / big - 1e-9); n * big <= m.hi + 1e-9; n++) if (n * big > m.lo + 1e-9) m.ticks.push(n * big);
}
const byId = Object.fromEntries(METRICS.map(m => [m.id, m]));
const fmt = (m, v) => m.nf.format(v);
const nfPlain = new Intl.NumberFormat('de-DE', { maximumFractionDigits: 2 });
const fmtTick = v => nfPlain.format(v);

const SMOOTH = { raw: 0, w7: 3, w30: 15 };
const SMOOTH_NAME = { raw: 'Rohdaten', w7: '7-Tage-Mittel', w30: '30-Tage-Mittel' };
const fieldCache = new Map();
function field(id, mode) {
  const r = SMOOTH[mode];
  if (!r) return raw[id];
  const key = id + mode;
  if (fieldCache.has(key)) return fieldCache.get(key);
  const src = raw[id], out = new Float32Array(N), pre = new Float64Array(NX + 1);
  for (let j = 0; j < NZ; j++) {
    for (let i = 0; i < NX; i++) pre[i + 1] = pre[i] + src[i * NZ + j];
    for (let i = 0; i < NX; i++) {
      const a = Math.max(0, i - r), b = Math.min(NX - 1, i + r);
      out[i * NZ + j] = (pre[b + 1] - pre[a]) / (b - a + 1);
    }
  }
  fieldCache.set(key, out);
  return out;
}
const medianCache = new Map();
function slotMedian(id) {
  if (medianCache.has(id)) return medianCache.get(id);
  const out = new Float32Array(NZ), col = new Float32Array(NX);
  for (let j = 0; j < NZ; j++) {
    for (let i = 0; i < NX; i++) col[i] = raw[id][i * NZ + j];
    col.sort();
    out[j] = NX % 2 ? col[(NX - 1) / 2] : (col[NX / 2 - 1] + col[NX / 2]) / 2;
  }
  medianCache.set(id, out);

  state.table = !state.table;
  $('#btnTable').setAttribute('aria-pressed', state.table);
  $('#btnTable').textContent = state.table ? 'Verläufe anzeigen' : 'Tageswerte als Tabelle';
  $('#figDay').hidden = $('#figYear').hidden = state.table;
  $('#tableWrap').hidden = !state.table;
  tableDay = -1;
  panelDirty = true;
});

// ---------- Auswahl ----------
function selectionChanged() {
  const s = sel();
  surfU.uSel.value.set(X0 + s.i * DX, Z0 + s.j * DZ);
  dirty = panelDirty = true;
}
function setPin(i, j) {
  state.pin = { i: clamp(i, 0, NX - 1), j: clamp(j, 0, NZ - 1) };
  state.hover = null;
  selectionChanged();
}
const raycaster = new THREE.Raycaster(), ndc = new THREE.Vector2();
function pick(e) {
  const r = canvas.getBoundingClientRect();
  ndc.set((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const hit = raycaster.intersectObject(surface, false)[0];
  if (!hit) return null;
  const p = surface.worldToLocal(hit.point.clone());
  return { i: clamp(Math.round((p.x - X0) / DX), 0, NX - 1), j: clamp(Math.round((p.z - Z0) / DZ), 0, NZ - 1) };
}
const tip = $('#tip');
function showTip(e, s) {
  const k = s.i * NZ + s.j, hm = state.hm, cm = colorMetric();
  tip.replaceChildren(el('i', '', `${WD[dayDate(s.i).getUTCDay()]}, ${dateShort(s.i)} · ${slotLabel(s.j)} Uhr`));
  const add = (m, v, what) => tip.append(el('br'), el('b', '', `${fmt(m, v)} ${m.unit}`), ' ' + what);
  if (state.smooth !== 'raw') add(hm, field(hm.id, state.smooth)[k], `${hm.name}, ${SMOOTH_NAME[state.smooth]}`);
  add(hm, raw[hm.id][k], state.smooth === 'raw' ? hm.name : 'gemessen');
  if (cm !== hm) add(cm, raw[cm.id][k], cm.name);
  tip.hidden = false;
  const r = stage.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  tip.style.transform = `translate(${Math.round(x + 16 + tw > r.width ? x - tw - 12 : x + 16)}px,${Math.round(y + 18 + th > r.height ? y - th - 12 : y + 18)}px)`;
}
let pendingMove = null, downAt = null;
function handleHover(e) {
  const hit = pick(e);
  if (hit) {
    if (!state.hover || state.hover.i !== hit.i || state.hover.j !== hit.j) { state.hover = hit; selectionChanged(); }
    showTip(e, hit);
  } else if (state.hover) { state.hover = null; tip.hidden = true; selectionChanged(); } else tip.hidden = true;
}
canvas.addEventListener('pointerdown', e => { downAt = { x: e.clientX, y: e.clientY }; tip.hidden = true; pendingMove = null; });
canvas.addEventListener('pointermove', e => {
  if (e.buttons || e.pointerType === 'touch' || camTween) return;
  pendingMove = e;
});
canvas.addEventListener('pointerup', e => {
  if (downAt && Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y) < 5) {
    const hit = pick(e);
    if (hit) setPin(hit.i, hit.j);
  }
  downAt = null;
});
canvas.addEventListener('pointerleave', () => {
  pendingMove = null;
  tip.hidden = true;
  if (state.hover) { state.hover = null; selectionChanged(); }
});
canvas.addEventListener('keydown', e => {
  const step = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
  if (!step) return;
  e.preventDefault();
  setPin(state.pin.i + step[0] * (e.shiftKey ? 7 : 1), state.pin.j + step[1] * (e.shiftKey ? 4 : 1));
});
for (const [id, axis] of [['svgDay', 'j'], ['svgYear', 'i']]) {
  const svg = $('#' + id);
  const at = e => {
    const g = svg._g;
    if (!g) return null;
    const v = g.x0 + (e.clientX - svg.getBoundingClientRect().left - g.ml) / g.pw * (g.x1 - g.x0);
    const base = state.hover || state.pin;
    return axis === 'j' ? { i: base.i, j: clamp(Math.round(v * 2), 0, NZ - 1) } : { i: clamp(Math.round(v), 0, NX - 1), j: base.j };
  };
  svg.addEventListener('pointermove', e => {
    const s = at(e);
    if (!s) return;
    state.hover = axis === 'j' ? { i: state.pin.i, j: s.j } : { i: s.i, j: state.pin.j };
    selectionChanged();
  });
  svg.addEventListener('pointerleave', () => { if (state.hover) { state.hover = null; selectionChanged(); } });
  svg.addEventListener('click', e => {
    const s = at(e);
    if (s) axis === 'j' ? setPin(state.pin.i, s.j) : setPin(s.i, state.pin.j);
  });
}

// ---------- Bedienelemente ----------
const segHeight = $('#segHeight'), selColor = $('#selColor');
for (const m of METRICS) {
  const b = el('button', '', m.name);
  b.type = 'button'; b.dataset.v = m.id;
  segHeight.append(b);
}
selColor.append(new Option('wie Höhe', ''), ...METRICS.map(m => new Option(m.name, m.id)));
const press = (group, v) => { for (const b of group.querySelectorAll('button')) b.setAttribute('aria-pressed', b.dataset.v === v); };
const pressView = () => press($('#segView'), state.view);
function refit() {
  if (userMoved || !state.view) return;
  if (camTween) camTo = poseOf(state.view); else applyPose(poseOf(state.view));
}
segHeight.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b || state.hm.id === b.dataset.v) return;
  state.hm = byId[b.dataset.v];
  press(segHeight, state.hm.id);
  retarget(true);
  refit();
});
selColor.addEventListener('change', () => { state.cm = selColor.value ? byId[selColor.value] : null; retarget(true); });
$('#segSmooth').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b || state.smooth === b.dataset.v) return;
  state.smooth = b.dataset.v;
  press($('#segSmooth'), state.smooth);
  retarget(true);
  refit();
});
const rngEx = $('#rngEx'), exOut = $('#exOut');
rngEx.addEventListener('input', () => {
  state.ex = +rngEx.value;
  exOut.textContent = state.ex.toFixed(1).replace('.', ',') + '×';
  refit();
  dirty = true;
});
$('#segView').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (b) goView(b.dataset.v);
});

// ---------- Kopfzeile ----------
{
  const last = NX - 1, d0 = dayDate(0), d1 = dayDate(last);
  $('#sub').textContent = `Raumluft vom ${d0.getUTCDate()}. ${MONTH[d0.getUTCMonth()]} bis ${d1.getUTCDate()}. ${MONTH[d1.getUTCMonth()]} ${d1.getUTCFullYear()} · ${DATA.measured.toLocaleString('de-DE')} Messungen im 30-Minuten-Takt`;
  const co2 = raw.co2, m = byId.co2;
  let over = 0;
  for (let k = 0; k < N; k++) if (co2[k] > 1000) over++;
  const means = months.filter(x => x.i1 - x.i0 >= 13).map(x => {
    let sum = 0;
    for (let k = x.i0 * NZ; k < (x.i1 + 1) * NZ; k++) sum += co2[k];
    return { mo: x.mo, v: sum / ((x.i1 - x.i0 + 1) * NZ) };
  }).sort((a, b) => b.v - a.v);
  let bj = 0, bv = -1;
  for (let j = 0; j < NZ; j++) {
    let sum = 0;
    for (let i = 0; i < NX; i++) sum += co2[i * NZ + j];
    if (sum > bv) { bv = sum; bj = j; }
  }
  const parts = [`${Math.round(over / N * 100)} % der Messungen liegen über 1.000 ppm CO₂`];
  if (means.length > 1) parts.push(`Monatsmittel von ${fmt(m, means[0].v)} ppm im ${MONTH[means[0].mo]} bis ${fmt(m, means[means.length - 1].v)} ppm im ${MONTH[means[means.length - 1].mo]}`);
  parts.push(`im Tagesmittel am höchsten um ${slotLabel(bj)} Uhr`);
  $('#lede').textContent = parts.join(' · ');
}

// ---------- Start ----------
// Der Auftakt beginnt erst, wenn die Bühne eine echte Größe hat: aus der Karte wächst das Relief.
let started = false;
function start() {
  started = true;
  if (RM) {
    state.view = 'relief';
    applyPose(poseOf('relief'));
    pressView();
    return;
  }
  introK = 0.02;
  state.view = 'karte';
  applyPose(poseOf('karte'));
  goView('relief', 2300, 450);
  tween(2100, u => { introK = lerp(0.02, 1, easeOut(u)); }, null, 650);
}
function resize() {
  const r = stage.getBoundingClientRect();
  sw = Math.max(1, r.width); sh = Math.max(1, r.height);
  renderer.setSize(sw, sh, false);
  camera.aspect = sw / sh;
  camera.setViewOffset(sw, sh, -viewShift.x, -viewShift.y, sw, sh);
  measureFixed();
  if (started) refit(); else if (sw > 80 && sh > 80) start();
  dirty = panelDirty = true;
}
press(segHeight, state.hm.id);
press($('#segSmooth'), state.smooth);
applyTheme();
setContourMetric(state.hm);
contourMetric = state.hm;
retarget(false);
resize();
selectionChanged();
new ResizeObserver(resize).observe(stage);
new ResizeObserver(() => { panelDirty = true; }).observe($('#figYear'));
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => {
  for (const n of labelLayer.querySelectorAll('.lbl')) { n._w = n.offsetWidth; n._h = n.offsetHeight; }
  dirty = panelDirty = true;
});
requestAnimationFrame(frame);
})();
</script>
